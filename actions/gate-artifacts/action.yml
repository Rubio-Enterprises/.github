name: Test Gate artifacts
description: Keep Lifecycle evidence without changing the gate result
inputs:
  name:
    description: Job id and canonical concern set
    required: true
  representative:
    description: Release Check representative repository, empty in production
    default: ''
  package:
    description: Whether the package Lifecycle Script was attempted
    default: ''
runs:
  using: composite
  steps:
    - name: Stage regular non-hidden Lifecycle files
      id: stage
      shell: bash
      env:
        PACKAGE_ATTEMPT: ${{ inputs.package }}
      run: |
        if [ "${CI_IMAGE:-false}" = true ]; then
          export MISE_OVERRIDE_CONFIG_FILENAMES=/opt/standards/mise/standards.toml
        fi
        python3 "$GITHUB_ACTION_PATH/stage.py"
    - name: Upload reports
      id: reports
      if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}-reports-${{ github.run_attempt }}${{ inputs.representative != '' && format('-{0}', inputs.representative) || '' }}
        path: ${{ runner.temp }}/gate-artifacts/reports
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload packaged output
      id: package
      if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.package == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}-package-${{ github.run_attempt }}${{ inputs.representative != '' && format('-{0}', inputs.representative) || '' }}
        path: ${{ runner.temp }}/gate-artifacts/dist
        retention-days: 7
        if-no-files-found: ignore
    - name: Clean up staged evidence
      if: ${{ always() }}
      shell: bash
      run: rm -rf -- "$RUNNER_TEMP/gate-artifacts"
