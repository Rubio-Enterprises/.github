name: Run project commands in the Repository Image
description: Declared CI Image routing or pin-checked direct/hosted project execution
inputs:
  operation:
    description: route or run
    default: run
  mode:
    description: direct (CI Image runner) or hosted (Dev Container CLI)
    default: ""
  task:
    description: lint-hooks, typecheck or build
    required: true
  runner:
    description: Existing runner-label array, for routing only
    default: "[]"
  rollout:
    description: CI_IMAGE_REPOS org variable, for routing only
    default: ""
  token:
    description: Repository-scoped GITHUB_TOKEN with packages read, for hosted pulls and v2 setup
    default: ""
outputs:
  runner:
    description: Selected runner-label array
    value: ${{ steps.route.outputs.runner }}
  mode:
    description: Empty for unchanged native execution, direct or hosted
    value: ${{ steps.route.outputs.mode }}
runs:
  using: composite
  steps:
    - id: route
      if: inputs.operation == 'route'
      shell: bash
      env:
        ORIGINAL_RUNNER: ${{ inputs.runner }}
        CI_IMAGE_REPOS: ${{ inputs.rollout }}
        PROJECT_TASK: ${{ inputs.task }}
      run: node "$GITHUB_ACTION_PATH/route.mjs"
    - name: Install the pinned Dev Container CLI
      if: inputs.operation == 'run' && inputs.mode == 'hosted'
      shell: bash
      run: npm install --prefix "$RUNNER_TEMP/project-devcontainer-cli" --ignore-scripts --no-audit --no-fund @devcontainers/cli@0.89.0
    - name: Execute the image project task
      if: inputs.operation == 'run'
      shell: bash
      env:
        IMAGE_MODE: ${{ inputs.mode }}
        PROJECT_TASK: ${{ inputs.task }}
        IMAGE_PULL_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
