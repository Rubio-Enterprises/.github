name: Repository image assets
description: Central generic build inputs and immutable base-pair validation
inputs:
  operation:
    description: resolve, inspect, release, prepare, pack, key or alias
    required: true
  base:
    description: Public base tag or immutable index reference
    default: ghcr.io/rubio-enterprises/devcontainers/base:latest
  base-ci:
    description: Public runner base tag or immutable index reference
    default: ghcr.io/rubio-enterprises/devcontainers/base-ci:latest
  config:
    description: Repository-relative extra-Features definition
    default: .github/.devcontainer/devcontainer.json
outputs:
  release:
    description: Requested Standards Release
    value: ${{ steps.run.outputs.release }}
  version:
    description: Resolved Standards Release
    value: ${{ steps.run.outputs.version }}
  integrity:
    description: Resolved package integrity
    value: ${{ steps.run.outputs.integrity }}
  base:
    description: Resolved base index reference
    value: ${{ steps.run.outputs.base }}
  base-ci:
    description: Resolved runner base index reference
    value: ${{ steps.run.outputs.base-ci }}
  assets:
    description: Trusted central assets directory
    value: ${{ steps.run.outputs.assets }}
  context:
    description: Prepared job-local build inputs
    value: ${{ steps.run.outputs.context }}
  input-key:
    description: Image input key of this commit
    value: ${{ steps.run.outputs.input-key }}
  rule:
    description: inputs (setup reads only manifests) or tree (setup may read any tracked file)
    value: ${{ steps.run.outputs.rule }}
  skip:
    description: true when the published :main pair already has this commit's image inputs
    value: ${{ steps.run.outputs.skip }}
  dev-index:
    description: Published dev index digest to alias
    value: ${{ steps.run.outputs.dev-index }}
  dev-child:
    description: Published dev amd64 image digest to alias
    value: ${{ steps.run.outputs.dev-child }}
  ci-index:
    description: Published CI index digest to alias
    value: ${{ steps.run.outputs.ci-index }}
  ci-child:
    description: Published CI amd64 image digest to alias
    value: ${{ steps.run.outputs.ci-child }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        BASE: ${{ inputs.base }}
        BASE_CI: ${{ inputs.base-ci }}
        CONFIG: ${{ inputs.config }}
      run: node "$GITHUB_ACTION_PATH/image.mjs" "$OPERATION"
