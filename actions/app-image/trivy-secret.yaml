# The App Image secret scan's policy (structure.sh passes it with --secret-config). skip-patterns replaces Trivy's defaults, so
# it keeps them and adds the package caches and logs a base or build stage leaves behind: they hold third-party download
# metadata (an npm cache index records the signed URLs it fetched from), never the repository's own secrets.
# The repository cannot change this file: it comes from this repository's central action, and Trivy runs outside the checkout.
skip-patterns:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/go.mod"
  - "**/go.sum"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/Pipfile.lock"
  - "**/Gemfile.lock"
  - "**/*.jpg"
  - "**/*.png"
  - "**/*.gif"
  - "**/*.doc"
  - "**/*.pdf"
  - "**/*.bin"
  - "**/*.svg"
  - "**/*.socket"
  - "**/*.deb"
  - "**/*.rpm"
  - "**/*.zip"
  - "**/*.gz"
  - "**/*.gzip"
  - "**/*.tar"
  - "**/pnpm-store/**"
  - "**/_cacache/**"
  - "**/.npm/_logs/**"
  - "**/.cache/uv/**"
  - "**/.cache/pip/**"
  - "**/.cache/yarn/**"
  - "**/.yarn/cache/**"
  - "**/.cargo/registry/**"
  - "**/go/pkg/mod/**"
