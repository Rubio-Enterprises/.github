# The App Image secret scan's policy (structure.sh passes it with --secret-config). skip-patterns replaces Trivy's defaults, so
# it keeps them and adds the package caches and logs a base or build stage leaves behind: they hold third-party download
# metadata (an npm cache index records the signed URLs it fetched from), never the repository's own secrets.
# Two third-party files that look like private keys are skipped by exact path, each with its reason below: the scan stays on for
# every other file of the image that carries them.
# The repository cannot change this file: it comes from this repository's central action, and Trivy runs outside the checkout.
skip-patterns:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/go.mod"
  - "**/go.sum"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/Pipfile.lock"
  - "**/Gemfile.lock"
  - "**/*.jpg"
  - "**/*.png"
  - "**/*.gif"
  - "**/*.doc"
  - "**/*.pdf"
  - "**/*.bin"
  - "**/*.svg"
  - "**/*.socket"
  - "**/*.deb"
  - "**/*.rpm"
  - "**/*.zip"
  - "**/*.gz"
  - "**/*.gzip"
  - "**/*.tar"
  - "**/pnpm-store/**"
  - "**/_cacache/**"
  - "**/.npm/_logs/**"
  - "**/.cache/uv/**"
  - "**/.cache/pip/**"
  - "**/.cache/yarn/**"
  - "**/.yarn/cache/**"
  - "**/.cargo/registry/**"
  - "**/go/pkg/mod/**"
  # ghcr.io/music-assistant/server (the base of ma-music-video-companion) ships Google's Widevine CDM key for its Python
  # runtime: an upstream file in the base layers, not a credential of ours.
  - "usr/local/bin/widevine_cdm/**"
  # pywiim (a Music Assistant dependency) embeds the public client key of WiiM devices in this module as a constant.
  - "**/site-packages/pywiim/api/constants.py"
