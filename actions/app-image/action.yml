name: App image Build Service client
description: Connects an image job to the Build Service, builds one app image there, copies it to GHCR and prunes stale candidates
inputs:
  operation:
    description: connect, build, publish or prune
    required: true
# A composite action's inner steps write to their own step outputs: only what is declared here reaches the calling workflow
outputs:
  digest:
    description: build, publish. Digest of the built image (the index digest when it carries attestations)
    value: ${{ steps.run.outputs.digest }}
  image:
    description: publish. The GHCR image@digest the copy produced
    value: ${{ steps.run.outputs.image }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
      run: |
        set -euo pipefail
        case "$OPERATION" in
          # The certificate exchange and builder setup are the repository-image action's; they have one implementation.
          connect) exec bash "$GITHUB_ACTION_PATH/../repository-image/connect.sh" ;;
          build | publish | prune) exec bash "$GITHUB_ACTION_PATH/$OPERATION.sh" ;;
          *) echo "::error::Unknown app image operation"; exit 1 ;;
        esac
