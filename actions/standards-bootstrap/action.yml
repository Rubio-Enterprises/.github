name: standards-bootstrap
description: >-
  Set up a config_model native repository (standards ADR-0033): clone its
  Shared Config Checkout before loading its mise includes, using a read-only
  standards-reader token. Install its mise tools when requested, require the
  checkout, then remove the token route. Does
  nothing for a rendered repository. Usage: docs/standards-bootstrap.md.
author: Rubio-Enterprises
inputs:
  app-id:
    description: >-
      The standards-reader App ID: pass `secrets.STANDARDS_READER_APP_ID`.
      Required for a native repository.
    required: false
    default: ""
  private-key:
    description: >-
      The standards-reader App private key: pass
      `secrets.STANDARDS_READER_APP_PRIVATE_KEY`. Required for a native
      repository.
    required: false
    default: ""
  config-model:
    description: >-
      `native` or `rendered`. Empty reads `config_model` from
      `.copier-answers.yml`, where an absent answer means `rendered`. Any other
      value fails.
    required: false
    default: ""
  mise-version:
    description: >-
      The mise version for jdx/mise-action, at least 2026.10.19. Empty uses the
      runner's installed mise, so a warm runner is never self-updated, or
      2026.10.19 when none is installed.
    required: false
    default: ""
  cache-key-prefix:
    description: The jdx/mise-action `cache_key_prefix`.
    required: false
    default: mise-v1
  bootstrap-parts:
    description: >-
      `repos,tools` installs the checkout and toolchain (default). `repos` only
      provisions the checkout, without tool caching or environment export, for
      jobs that build their toolchain elsewhere, such as Dev Container images.
    required: false
    default: repos,tools
  keep-route:
    description: >-
      `true` keeps the token route to `standards` for the rest of the job.
      Only for a job whose later steps must refresh the checkout; by default
      the route is removed before repository code runs.
    required: false
    default: "false"
outputs:
  config-model:
    description: The resolved config model, `native` or `rendered`.
    value: ${{ steps.model.outputs.config_model }}
runs:
  using: composite
  steps:
    - name: Read the config model
      id: model
      shell: bash
      env:
        GIVEN_MODEL: ${{ inputs.config-model }}
      run: |
        set -euo pipefail
        config_model="$GIVEN_MODEL"
        if [ -z "$config_model" ]; then
          config_model="$(awk '/^config_model:/ { sub(/^config_model:[[:space:]]*/, ""); gsub(/["\047[:space:]]/, ""); print; exit }' .copier-answers.yml 2>/dev/null || true)"
        fi
        case "${config_model:=rendered}" in
          rendered|native) ;;
          *) echo "::error::unsupported config_model answer: $config_model" >&2; exit 1 ;;
        esac
        printf 'config_model=%s\n' "$config_model" >> "$GITHUB_OUTPUT"
        echo "config_model: $config_model"
    - name: Check the native prerequisites
      id: prerequisites
      if: steps.model.outputs.config_model == 'native'
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.private-key }}
        MISE_VERSION: ${{ inputs.mise-version }}
        BOOTSTRAP_PARTS: ${{ inputs.bootstrap-parts }}
      run: |
        set -euo pipefail
        case "$BOOTSTRAP_PARTS" in
          repos|repos,tools) ;;
          *) echo "::error::bootstrap-parts must be repos or repos,tools" >&2; exit 1 ;;
        esac
        if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
          echo "::error::config_model native needs the standards-reader App: pass secrets.STANDARDS_READER_APP_ID and secrets.STANDARDS_READER_APP_PRIVATE_KEY as app-id and private-key; a reusable workflow's caller must forward them" >&2
          exit 1
        fi
        floor=2026.10.19
        version="$MISE_VERSION"
        if [ -z "$version" ]; then
          # The path jdx/mise-action checks before it would self-update.
          binary="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin/mise"
          version="$floor"
          if [ -e "$binary" ]; then
            version="$("$binary" version --json | jq -er '.version | strings | capture("^(?<number>[0-9]{4}[.][0-9]+[.][0-9]+)( |$)").number')"
          fi
        fi
        if ! [[ "$version" =~ ^([0-9]{4})[.]([0-9]+)[.]([0-9]+)$ ]]; then
          echo "::error::mise-version must be YYYY.M.P, got '$version'" >&2
          exit 1
        fi
        if [ $((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]})) -lt 2026010019 ]; then
          echo "::error::config_model native needs mise $floor or later, got $version" >&2
          exit 1
        fi
        printf 'mise_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
    - name: Install mise without loading repository config
      if: steps.model.outputs.config_model == 'native'
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
      with:
        version: ${{ steps.prerequisites.outputs.mise_version }}
        install: false
        cache: false
        env: false
        # mise-action always runs mise ls, even with install/env disabled.
        working_directory: ${{ runner.temp }}
    - name: Read the Shared Config Checkout declaration
      id: declaration
      if: steps.model.outputs.config_model == 'native'
      shell: bash
      run: |
        set -euo pipefail
        # Explicit-file config get reads stored TOML without resolving includes.
        if ! url="$(mise config get --file .mise.toml 'bootstrap.repos.".standards-config".url')" ||
           ! ref="$(mise config get --file .mise.toml 'bootstrap.repos.".standards-config".ref')"; then
          echo "::error::declare the Shared Config Checkout in .mise.toml [bootstrap.repos]" >&2
          exit 1
        fi
        case "$url" in
          https://github.com/Rubio-Enterprises/standards|https://github.com/Rubio-Enterprises/standards.git) ;;
          *) echo "::error::the Shared Config Checkout must use the Rubio-Enterprises/standards HTTPS URL" >&2; exit 1 ;;
        esac
        case "$ref" in
          stable|canary) ;;
          *) echo "::error::the Shared Config Checkout ref must be stable or canary" >&2; exit 1 ;;
        esac
        printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
        echo "Shared Config Checkout declaration: standards $ref"
    - name: Mint the standards read token
      id: token
      if: steps.model.outputs.config_model == 'native'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: standards
        permission-contents: read
    - name: Check out the Shared Config Checkout
      if: steps.model.outputs.config_model == 'native'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: Rubio-Enterprises/standards
        ref: ${{ steps.declaration.outputs.ref }}
        path: .standards-config
        token: ${{ steps.token.outputs.token }}
        fetch-depth: 0
        persist-credentials: false
    - name: Route the standards clone through the token
      if: steps.model.outputs.config_model == 'native'
      shell: bash
      env:
        TOKEN: ${{ steps.token.outputs.token }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        git config --global \
          url."https://x-access-token:${TOKEN}@github.com/${OWNER}/standards".insteadOf \
          "https://github.com/${OWNER}/standards"
    # Image builds need the checkout, not a second toolchain on the runner
    - name: Install mise and bootstrap the Shared Config Checkout
      if: steps.model.outputs.config_model == 'native'
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
        # A failed private clone must fail, not wait on a credential prompt.
        GIT_TERMINAL_PROMPT: "0"
        GCM_INTERACTIVE: never
      with:
        version: ${{ steps.prerequisites.outputs.mise_version }}
        cache_key_prefix: ${{ inputs.cache-key-prefix }}
        cache: ${{ inputs.bootstrap-parts != 'repos' }}
        env: ${{ inputs.bootstrap-parts != 'repos' }}
        bootstrap: true
        bootstrap_args: --only ${{ inputs.bootstrap-parts }}
    # Independent of the repository's own post-repos hook, so a stub that drops
    # the hook or the checkout declaration still fails here instead of letting
    # Lefthook's `extends` skip the shared hooks silently.
    - name: Require the Shared Config Checkout
      if: steps.model.outputs.config_model == 'native'
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
        GIT_TERMINAL_PROMPT: "0"
        GCM_INTERACTIVE: never
      run: |
        set -euo pipefail
        mise bootstrap repos status --missing
        if [ ! -f .standards-config/config/lefthook/base.yml ]; then
          echo "::error::shared config missing at .standards-config/config/lefthook/base.yml: declare the checkout in .mise.toml [bootstrap.repos] and run 'mise bootstrap --only repos,tools' (standards ADR-0033)" >&2
          exit 1
        fi
        sha="$(git -C .standards-config rev-parse HEAD)"
        ref="$(git -C .standards-config symbolic-ref -q --short HEAD || echo detached)"
        echo "Shared Config Checkout: standards \`$ref\` at \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Shared Config Checkout: standards $ref at $sha"
    # Removes only this action's route: a caller's own token routes, such as
    # private module reads, are not this action's to remove.
    - name: Remove the standards read route
      if: always() && steps.model.outputs.config_model == 'native' && inputs.keep-route != 'true'
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        routes() { git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true; }
        while read -r key _; do
          case "$key" in
            "url.https://x-access-token:"*"@github.com/${OWNER}/standards.insteadof")
              git config --global --remove-section "${key%.insteadof}" || true ;;
          esac
        done <<<"$(routes)"
        while read -r key _; do
          case "$key" in
            "url.https://x-access-token:"*"@github.com/${OWNER}/standards.insteadof")
              echo "::error::the standards token route survived removal" >&2
              exit 1 ;;
          esac
        done <<<"$(routes)"
