name: standards-bootstrap
description: >-
  Resolve the standards legacy/copier branch once and provision its full-history Shared Config
  Directory before loading consumer mise config. Export STANDARDS_PIN, verify
  readiness without a standards credential, then bootstrap the requested tools.
  Usage: docs/standards-bootstrap.md.
author: Rubio-Enterprises
inputs:
  app-id:
    description: The standards-reader App ID; pass secrets.STANDARDS_READER_APP_ID.
    required: false
    default: ""
  private-key:
    description: >-
      The standards-reader App private key; pass
      secrets.STANDARDS_READER_APP_PRIVATE_KEY.
    required: false
    default: ""
  mise-version:
    description: >-
      The mise version for jdx/mise-action, at least 2026.10.19. Empty uses the
      runner's installed mise, so a warm runner is never self-updated, or
      2026.10.19 when none is installed. Repos-only mode reuses a compatible PATH
      executable, or installs this exact version when explicitly requested.
    required: false
    default: ""
  cache-key-prefix:
    description: The jdx/mise-action cache_key_prefix.
    required: false
    default: mise-v1
  bootstrap-parts:
    description: >-
      repos,tools installs the checkout and toolchain (default). repos only
      provisions and verifies the checkout, without tool caching or environment
      export, for jobs that build their toolchain elsewhere.
    required: false
    default: repos,tools
runs:
  using: composite
  steps:
    - name: Check the native prerequisites
      id: prerequisites
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.private-key }}
        MISE_VERSION: ${{ inputs.mise-version }}
        BOOTSTRAP_PARTS: ${{ inputs.bootstrap-parts }}
      run: |
        set -euo pipefail
        case "$BOOTSTRAP_PARTS" in
          repos|repos,tools) ;;
          *) echo "::error::bootstrap-parts must be repos or repos,tools" >&2; exit 1 ;;
        esac
        if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
          echo "::error::shared config bootstrap needs the standards-reader App: pass secrets.STANDARDS_READER_APP_ID and secrets.STANDARDS_READER_APP_PRIVATE_KEY as app-id and private-key; a reusable workflow's caller must forward them" >&2
          exit 1
        fi
        floor=2026.10.19
        version="$MISE_VERSION"
        if [ "$BOOTSTRAP_PARTS" = repos ]; then
          version="${version:-$floor}"
        elif [ -z "$version" ]; then
          # Match mise-action's binary lookup without self-updating a warm runner
          binary="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin/mise"
          version="$floor"
          if [ -e "$binary" ]; then
            version="$("$binary" version --json | jq -er '.version | strings | capture("^(?<number>[0-9]{4}[.][0-9]+[.][0-9]+)( |$)").number')"
          fi
        fi
        if ! [[ "$version" =~ ^([0-9]{4})[.]([0-9]+)[.]([0-9]+)$ ]]; then
          echo "::error::mise-version must be YYYY.M.P, got '$version'" >&2
          exit 1
        fi
        IFS=. read -r floor_year floor_month floor_patch <<<"$floor"
        floor_number=$((10#$floor_year * 1000000 + 10#$floor_month * 1000 + 10#$floor_patch))
        if [ $((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]})) -lt "$floor_number" ]; then
          echo "::error::shared config bootstrap needs mise $floor or later, got $version" >&2
          exit 1
        fi
        if [ "$BOOTSTRAP_PARTS" = repos ]; then
          binary="$(type -P mise || true)"
          if [ -n "$binary" ]; then
            installed="$("$binary" version --json | jq -er '.version | strings | capture("^(?<number>[0-9]{4}[.][0-9]+[.][0-9]+)( |$)").number')"
            if ! [[ "$installed" =~ ^([0-9]{4})[.]([0-9]+)[.]([0-9]+)$ ]]; then
              echo "::error::installed mise must report YYYY.M.P" >&2
              exit 1
            fi
            installed_number=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
            if [ "$installed_number" -ge "$floor_number" ] &&
               { [ -z "$MISE_VERSION" ] || [ "$installed" = "$MISE_VERSION" ]; }; then
              if ! [[ "$binary" = /* && "$binary" != *$'\n'* && "$binary" != *$'\r'* ]]; then
                echo "::error::installed mise must have a single-line absolute path" >&2
                exit 1
              fi
              printf 'mise_binary=%s\nuse_existing_mise=true\n' "$binary" >> "$GITHUB_OUTPUT"
              version="$installed"
            fi
          fi
        fi
        printf 'mise_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
    - name: Mint the standards read token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: Rubio-Enterprises
        repositories: standards
        permission-contents: read
    - name: Resolve the standards legacy ref once
      id: pin
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # standards main is the v2 package; the Copier-era Shared Config stays on this branch
        STANDARDS_LEGACY_REF: legacy/copier
      run: |
        set -euo pipefail
        sha="$(gh api "repos/Rubio-Enterprises/standards/commits/$STANDARDS_LEGACY_REF" --jq .sha)"
        if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::standards $STANDARDS_LEGACY_REF must resolve to a lowercase 40-hex commit" >&2
          exit 1
        fi
        printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
    - name: Check out the Shared Config Directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: Rubio-Enterprises/standards
        ref: ${{ steps.pin.outputs.sha }}
        path: .standards-config
        token: ${{ steps.token.outputs.token }}
        fetch-depth: 0
        persist-credentials: false
    - name: Remove the standards read route
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        # Remove legacy standards routes without touching unrelated routes
        routes() { git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true; }
        while read -r key _; do
          case "$key" in
            "url.https://x-access-token:"*"@github.com/Rubio-Enterprises/standards.insteadof")
              git config --global --remove-section "${key%.insteadof}" || true ;;
          esac
        done <<<"$(routes)"
        while read -r key _; do
          case "$key" in
            "url.https://x-access-token:"*"@github.com/Rubio-Enterprises/standards.insteadof")
              echo "::error::the standards token route survived removal" >&2
              exit 1 ;;
          esac
        done <<<"$(routes)"
    - name: Validate and export the standards pin
      shell: bash
      env:
        STANDARDS_PIN: ${{ steps.pin.outputs.sha }}
      run: |
        set -euo pipefail
        if ! [[ "$STANDARDS_PIN" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::STANDARDS_PIN must be a nonempty lowercase 40-hex commit" >&2
          exit 1
        fi
        if [ ! -d .standards-config/.git ]; then
          echo "::error::the Shared Config Directory must be a real Git checkout" >&2
          exit 1
        fi
        url=https://github.com/Rubio-Enterprises/standards.git
        # checkout uses the credential-free URL without its optional .git suffix
        if [ "$(git -C .standards-config config --get remote.origin.url)" = "${url%.git}" ]; then
          git -C .standards-config remote set-url origin "$url"
        fi
        if [ "$(git -C .standards-config config --get remote.origin.url)" != "$url" ] ||
           [ "$(git -C .standards-config rev-parse HEAD)" != "$STANDARDS_PIN" ] ||
           [ "$(git -C .standards-config rev-parse --is-shallow-repository)" != false ] ||
           [ -n "$(git -C .standards-config status --porcelain --untracked-files=all)" ]; then
          echo "::error::shared config must be clean, non-shallow, at STANDARDS_PIN and use the credential-free standards origin" >&2
          exit 1
        fi
        printf 'STANDARDS_PIN=%s\n' "$STANDARDS_PIN" >> "$GITHUB_ENV"
        echo "Shared Config Directory: standards at \`$STANDARDS_PIN\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Shared Config Directory: standards at $STANDARDS_PIN"
    - name: Install mise without loading repository config
      if: steps.prerequisites.outputs.use_existing_mise != 'true'
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
      with:
        version: ${{ steps.prerequisites.outputs.mise_version }}
        install: false
        cache: false
        env: false
        # mise-action always runs mise ls, even with install/env disabled
        working_directory: ${{ runner.temp }}
    - name: Require the Shared Config Directory before bootstrap
      shell: bash
      env:
        GIT_TERMINAL_PROMPT: "0"
        GCM_INTERACTIVE: never
      run: |
        set -euo pipefail
        if ! [[ "$STANDARDS_PIN" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::STANDARDS_PIN must be a nonempty lowercase 40-hex commit" >&2
          exit 1
        fi
        status="$(mise bootstrap repos status --missing --json)"
        # A skipped or absent declaration otherwise makes status succeed unchecked
        if ! jq -e --arg pin "$STANDARDS_PIN" '
          .repos | any(.path_raw == ".standards-config" and
            .url == "https://github.com/Rubio-Enterprises/standards.git" and
            .ref == $pin and .current_sha == $pin and .state == "current")
        ' <<<"$status" >/dev/null; then
          echo "::error::mise must declare .standards-config at STANDARDS_PIN with no depth" >&2
          exit 1
        fi
        if [ ! -f .standards-config/config/lefthook/base.yml ]; then
          echo "::error::shared config missing at .standards-config/config/lefthook/base.yml" >&2
          exit 1
        fi
    - name: Install mise and bootstrap the Shared Config Checkout
      if: steps.prerequisites.outputs.use_existing_mise != 'true'
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
        GIT_TERMINAL_PROMPT: "0"
        GCM_INTERACTIVE: never
      with:
        version: ${{ steps.prerequisites.outputs.mise_version }}
        cache_key_prefix: ${{ inputs.cache-key-prefix }}
        cache: ${{ inputs.bootstrap-parts != 'repos' }}
        env: ${{ inputs.bootstrap-parts != 'repos' }}
        bootstrap: true
        bootstrap_args: --only ${{ inputs.bootstrap-parts }}
    - name: Bootstrap repos with the verified mise executable
      if: steps.prerequisites.outputs.use_existing_mise == 'true'
      shell: bash
      env:
        MISE_BINARY: ${{ steps.prerequisites.outputs.mise_binary }}
        GIT_TERMINAL_PROMPT: "0"
        GCM_INTERACTIVE: never
      run: |
        set -euo pipefail
        "$MISE_BINARY" bootstrap --only repos
