name: Execute a repository-owned project command
description: Direct execution or a job-scoped hosted Repository Image through the Dev Container CLI
inputs:
  operation:
    description: prepare starts the hosted environment; run executes caller-owned shell
    default: run
  hosted-image:
    description: The project router's hosted-image output; false executes directly
    default: "false"
  run:
    description: Caller-owned Bash script, with the same fail-fast shell as a run step
    default: ""
  forward-env:
    description: Whitespace-separated environment variable names to forward for this invocation only
    default: ""
  token:
    description: Repository GITHUB_TOKEN with packages read; used only by hosted prepare
    default: ""
outputs:
  image:
    description: Immutable pulled image ID
  pull-seconds:
    description: Time spent pulling the image
  start-seconds:
    description: Metadata qualification and container startup after the pull
  cli-seconds:
    description: Pinned CLI installation time
  prepare-seconds:
    description: Complete prepare operation wall time
runs:
  using: node24
  main: index.mjs
  post: cleanup.mjs
  post-if: always()
