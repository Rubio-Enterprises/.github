# The Standards Check (docs/standards-check.md). The `standards` org ruleset injects this workflow
# into every repository whose custom property selects it.
# In CI:
#   - Private repositories run `standards check` and `standards check-pr` inside their CI Image
#     on the Container Pool.
#   - Hosted/public repositories install `just`, log in to GHCR, and run `just build`, `just check`,
#     and `just check-pr` through Docker Compose on the host.
# No standards logic lives here; change the checks in Rubio-Enterprises/standards.
name: standards
# Ruleset workflows ignore `types` and other filters: they run on opened, synchronize and reopened
# (and merge_group checks_requested) only, so editing a title or description re-runs nothing.
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
  packages: read # pull the internal ghcr.io/rubio-enterprises/base:main image
  pull-requests: read # Danger reads the pull request it checks
  issues: read # Danger fetches it through GET /repos/{o}/{r}/issues/{n}
concurrency:
  group: standards-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    if: github.repository != 'Rubio-Enterprises/.github'
    permissions:
      contents: read
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
    with:
      route: linux
  standards-linux:
    name: standards-linux
    # This repository is not onboarded; its own pull requests would fail `test -f lefthook.yml`.
    needs: route
    if: github.repository != 'Rubio-Enterprises/.github'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      # Full history: check:pr scans BASE_SHA..HEAD_SHA, and on a fork `check` needs
      # origin/upstream and its merge-base. Measured on karakeep (94 MB): 4.7 s vs 2.2 s shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require lefthook.yml
        run: |
          test -f lefthook.yml ||
            { echo "::error::repository not onboarded: run npm init @rubio-enterprises/standards"; exit 1; }
      - id: week
        name: Name this week's cache keys
        run: echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"
      # Restore only. A pull request's own save is scoped to its merge ref, so no other pull request
      # could restore it. The caller standards-cache.yml writes these keys on the default branch.
      - id: trivy-db
        name: Restore the trivy vulnerability database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/trivy/db
          key: standards-trivy-db-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: standards-trivy-db-${{ runner.os }}-
      - name: Restore the PR conventions' npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/standards-npm
          key: standards-npm-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: standards-npm-${{ runner.os }}-
      # trivy replaces a database older than a day (metadata.json NextUpdate), which would make the
      # weekly cache useless. A restored one under 8 days old is used as it is.
      - name: Use the restored trivy database without updating it
        if: steps.trivy-db.outputs.cache-matched-key != ''
        run: |
          days=$(jq -r '(now - (.UpdatedAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) / 86400 | floor' \
            .cache/trivy/db/metadata.json) || days=99
          echo "trivy vulnerability database: restored, $days day(s) old"
          if [ "$days" -lt 8 ]; then echo "TRIVY_SKIP_DB_UPDATE=true" >>"$GITHUB_ENV"; fi

      - id: check-ci
        name: Every Check on every file (CI Image)
        if: needs.route.outputs.ci-image == 'true'
        run: standards check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

      - id: check-pr-ci
        name: Pull-request Checks (CI Image)
        if: ${{ !cancelled() && needs.route.outputs.ci-image == 'true' && steps['check-ci'].outcome != 'skipped' }}
        run: standards check-pr
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

      - name: Install just
        if: needs.route.outputs.ci-image != 'true'
        uses: Rubio-Enterprises/.github/actions/setup-just@main

      - name: Log in to ghcr.io
        if: needs.route.outputs.ci-image != 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container-writable hosted checkout
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
      - name: Build dev image
        if: needs.route.outputs.ci-image != 'true'
        run: just build
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Bundler-based Checks (Hosted)
        if: needs.route.outputs.ci-image != 'true'
        run: |
          if [ -f Gemfile ]; then
            just exec bin/setup.sh
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - id: check-hosted
        name: Every Check on every file (Hosted)
        if: needs.route.outputs.ci-image != 'true'
        run: |
          if [ "$CI_PLATFORM" = macos ]; then
            just exec standards check
          else
            just check
          fi
        env:
          CI_PLATFORM: ${{ needs.route.outputs.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

      - id: check-pr-hosted
        name: Pull-request Checks (Hosted)
        if: ${{ !cancelled() && needs.route.outputs.ci-image != 'true' && steps['check-hosted'].outcome != 'skipped' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/ci"
          cp "$GITHUB_EVENT_PATH" "$GITHUB_WORKSPACE/.cache/ci/event.json"
          jq -n \
            --arg GITHUB_WORKFLOW "$GITHUB_WORKFLOW" \
            --arg GITHUB_EVENT_NAME "$GITHUB_EVENT_NAME" \
            --arg GITHUB_EVENT_PATH "$GITHUB_WORKSPACE/.cache/ci/event.json" \
            --arg GITHUB_REPOSITORY "$GITHUB_REPOSITORY" \
            --arg GITHUB_RUN_ID "$GITHUB_RUN_ID" \
            --arg GITHUB_SERVER_URL "$GITHUB_SERVER_URL" \
            --arg GITHUB_STEP_SUMMARY "$GITHUB_WORKSPACE/.cache/ci/summary.md" \
            --arg BASE_SHA "$BASE_SHA" \
            --arg HEAD_SHA "$HEAD_SHA" \
            --arg PR_TITLE "$PR_TITLE" \
            '$ARGS.named' >"$GITHUB_WORKSPACE/.cache/ci/context.json"
          status=0
          GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/.cache/ci/event.json" \
            GITHUB_STEP_SUMMARY="$GITHUB_WORKSPACE/.cache/ci/summary.md" just check-pr || status=$?
          if [ -f "$GITHUB_WORKSPACE/.cache/ci/summary.md" ]; then
            cat "$GITHUB_WORKSPACE/.cache/ci/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

      - name: Summarize what the Checks rewrote
        if: ${{ failure() && (steps['check-ci'].outcome == 'failure' || steps['check-hosted'].outcome == 'failure') }}
        run: |
          { echo '```'; git status --short; git diff --stat; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::the Checks failed or a Fixer rewrote files; run 'just check' locally and commit the result"

  standards-native:
    name: standards-native
    needs: route
    if: github.repository != 'Rubio-Enterprises/.github' && needs.route.outputs.platform == 'macos'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').macos || fromJSON('["macos-26"]') }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      # Full history: check:pr scans BASE_SHA..HEAD_SHA, and on a fork `check` needs
      # origin/upstream and its merge-base. Measured on karakeep (94 MB): 4.7 s vs 2.2 s shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install just
        uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Install mise if missing
        shell: bash
        run: |
          set -euo pipefail
          if command -v mise >/dev/null 2>&1; then exit 0; fi
          case "$(uname -s):$(uname -m)" in
            Darwin:arm64) ;;
            *) echo '::error::unsupported mise platform'; exit 1 ;;
          esac
          version=2026.11.1
          # jdx/mise v2026.11.1 SHASUMS256.txt, macos-arm64.tar.gz
          checksum=e1eaf20469e586f65849256a0be6a58dd7a3e93ae8db68bc74dd7af5ca0fe7f6
          work=$(mktemp -d "$RUNNER_TEMP/mise.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "https://github.com/jdx/mise/releases/download/v$version/mise-v$version-macos-arm64.tar.gz" -o "$work/mise.tar.gz"
          printf '%s  %s\n' "$checksum" "$work/mise.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/mise/bin"
          tar -xzf "$work/mise.tar.gz" -C "$RUNNER_TEMP" mise/bin/mise
          printf '%s\n' "$RUNNER_TEMP/mise/bin" >> "$GITHUB_PATH"
      - name: Set up native Checks
        run: just setup-native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Native Checks
        run: just check-native

  standards:
    name: standards
    needs: [route, standards-linux, standards-native]
    if: ${{ always() && github.repository != 'Rubio-Enterprises/.github' }}
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require all applicable Checks to succeed
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          PLATFORM: ${{ needs.route.outputs.platform }}
          LINUX_RESULT: ${{ needs.standards-linux.result }}
          NATIVE_RESULT: ${{ needs.standards-native.result }}
        run: |
          test "$ROUTE_RESULT" = success && test "$LINUX_RESULT" = success &&
            { { test "$PLATFORM" = macos && test "$NATIVE_RESULT" = success; } ||
              { test "$PLATFORM" = linux && test "$NATIVE_RESULT" = skipped; }; }
