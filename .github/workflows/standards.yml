# The Standards Check (docs/standards-check.md). The `standards` org ruleset injects this workflow
# into every repository whose custom property selects it. A thin shell: install the repository's
# Standards Release and run the Conformance Tasks it ships (`check`, `check:pr`). No standards
# logic lives here; change the checks in Rubio-Enterprises/standards.
name: standards
# Ruleset workflows ignore `types` and other filters: they run on opened, synchronize and reopened
# (and merge_group checks_requested) only, so editing a title or description re-runs nothing.
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
  packages: read # the internal @rubio-enterprises/standards package
  pull-requests: read # Danger reads the pull request it checks
  issues: read # Danger fetches it through GET /repos/{o}/{r}/issues/{n}
concurrency:
  group: standards-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    if: github.repository != 'Rubio-Enterprises/.github'
    permissions:
      contents: read
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
  standards:
    name: standards
    # This repository is not onboarded; its own pull requests would fail `test -f lefthook.yml`.
    needs: route
    if: ${{ always() && github.repository != 'Rubio-Enterprises/.github' }}
    runs-on: >-
      ${{ needs.route.result == 'success' && fromJSON(needs.route.outputs.runner)
      || (fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]')) }}
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      # renovate: datasource=github-releases depName=jdx/mise
      MISE_VERSION: "2026.10.19"
    steps:
      - name: Require successful project routing
        if: needs.route.result != 'success'
        run: |
          echo '::error::project runner routing did not succeed'
          exit 1
      # Full history: check:pr scans BASE_SHA..HEAD_SHA, and on a fork `check` needs
      # origin/upstream and its merge-base. Measured on karakeep (94 MB): 4.7 s vs 2.2 s shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require lefthook.yml
        run: |
          test -f lefthook.yml ||
            { echo "::error::repository not onboarded: run npm init @rubio-enterprises/standards"; exit 1; }
      - id: week
        name: Name this week's cache keys
        run: echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"
      # mise's pipx backend needs uv on PATH on a cold runner (AGENTS.md).
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: needs.route.outputs.ci-image != 'true'
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.17"
      # mise-action's own cache saves only after its own install, which this job leaves to `setup`;
      # the standards-setup action owns the Standards Setup Caches instead.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        if: needs.route.outputs.ci-image != 'true'
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: false
      # Restore only: the default-branch seed (standards-seed.yml) saves this key. A save here
      # would serve only this pull request.
      - name: Restore the trivy vulnerability database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ runner.os }}-${{ steps.week.outputs.week }}
      - name: Trust the checked-out repository in the CI Image
        if: needs.route.outputs.ci-image == 'true'
        run: mise trust "$GITHUB_WORKSPACE"
      # Restores the default branch's Standards Setup Caches on plain runners, then `mise run setup`.
      - id: setup
        name: Install the Standards Release, its tools and the repository's dependencies
        uses: Rubio-Enterprises/.github/actions/standards-setup@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          restore: ${{ needs.route.outputs.ci-image != 'true' }}
      # A repository task of the same name silently replaces a package task (mise precedence), so
      # `check`/`check:pr` must be the package's: same file content as the installed release's
      # mise/standards.toml (by content, not path: the standards repository links its own tree).
      - name: Require the package's own check and check:pr tasks
        run: |
          pkg=.standards/node_modules/@rubio-enterprises/standards/mise/standards.toml
          want="$(git hash-object "$pkg")"
          for task in check check:pr; do
            src="$(mise tasks info "$task" --json | jq -r .source)"
            [ "$(git hash-object "$src")" = "$want" ] ||
              { echo "::error::$task comes from $src, not the Standards Package; delete the repository's $task task"; exit 1; }
          done
      - id: check
        name: Every Check on every file
        run: mise run check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zizmor's online audits
      - name: Pull-request Checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mise run check:pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Lefthook 2.1 prints no per-job summary in CI when a Fixer's rewrite fails the run.
      - name: Summarize what the Checks rewrote
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        run: |
          { echo '```'; git status --short; git diff --stat; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::the Checks failed or a Fixer rewrote files; run 'mise run check' locally and commit the result"
