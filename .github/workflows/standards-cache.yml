name: standards cache (reusable)
"on":
  workflow_call:
permissions:
  contents: read
  packages: read
concurrency:
  group: standards-cache-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  route:
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
  warm:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: week
        name: Name this week's cache keys
        run: echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"
      - id: trivy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/trivy/db
          key: standards-trivy-db-${{ runner.os }}-${{ steps.week.outputs.week }}
          lookup-only: true
      - id: npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/standards-npm
          key: standards-npm-${{ runner.os }}-${{ steps.week.outputs.week }}
          lookup-only: true
      - name: Install just
        if: needs.route.outputs.ci-image != 'true' && (steps.trivy.outputs.cache-hit != 'true' || steps.npm.outputs.cache-hit != 'true')
        uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Log in to GHCR
        if: needs.route.outputs.ci-image != 'true' && (steps.trivy.outputs.cache-hit != 'true' || steps.npm.outputs.cache-hit != 'true')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download the trivy vulnerability database
        if: steps.trivy.outputs.cache-hit != 'true'
        env:
          CI_IMAGE: ${{ needs.route.outputs.ci-image }}
        run: |
          if [ "$CI_IMAGE" = true ]; then
            trivy fs --download-db-only --no-progress --quiet --cache-dir "$TRIVY_CACHE_DIR"
          else
            just build
            just exec trivy fs --download-db-only --no-progress --quiet --cache-dir "$TRIVY_CACHE_DIR"
          fi
      - name: Fill the PR conventions' npm cache
        if: steps.npm.outputs.cache-hit != 'true'
        env:
          CI_IMAGE: ${{ needs.route.outputs.ci-image }}
        run: |
          if [ "$CI_IMAGE" = true ]; then
            npm ci --prefix /opt/standards/pr-conventions --ignore-scripts --no-audit --no-fund --cache "$XDG_CACHE_HOME/standards-npm"
          else
            just build
            just exec npm ci --prefix /opt/standards/pr-conventions --ignore-scripts --no-audit --no-fund --cache "$XDG_CACHE_HOME/standards-npm"
          fi
      - name: Save the trivy vulnerability database
        if: (steps.trivy.outputs.cache-hit != 'true' || steps.npm.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/trivy/db
          key: standards-trivy-db-${{ runner.os }}-${{ steps.week.outputs.week }}
      - name: Save the PR conventions' npm cache
        if: steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/standards-npm
          key: standards-npm-${{ runner.os }}-${{ steps.week.outputs.week }}
