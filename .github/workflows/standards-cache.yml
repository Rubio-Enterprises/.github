name: standards cache (reusable)
"on":
  workflow_call:
permissions:
  actions: read
  contents: read
  packages: read
concurrency:
  group: standards-cache-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository != 'Rubio-Enterprises/.github' &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.repository.private == false
    permissions:
      actions: read
      contents: read
      packages: read
    uses: Rubio-Enterprises/.github/.github/workflows/default-branch-check.yml@main
  route:
    permissions:
      contents: read
      packages: read
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
    with:
      route: linux
  warm:
    permissions:
      contents: read
      packages: read
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: week
        name: Name this week's cache keys
        run: echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"
      - id: trivy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/trivy/db
          key: standards-trivy-db-${{ runner.os }}-${{ steps.week.outputs.week }}
          lookup-only: true
      - name: Check out central Docker preparation action
        if: needs.route.outputs.ci-image != 'true' && steps.trivy.outputs.cache-hit != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: main
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: actions/prepare-hosted-docker
      - name: Prepare hosted Docker disk
        if: needs.route.outputs.ci-image != 'true' && steps.trivy.outputs.cache-hit != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: ./.cache/central-test-gate/actions/prepare-hosted-docker # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
      - name: Remove central Docker preparation checkout
        if: needs.route.outputs.ci-image != 'true' && steps.trivy.outputs.cache-hit != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: rm -rf .cache/central-test-gate
      - name: Install just
        if: needs.route.outputs.ci-image != 'true' && steps.trivy.outputs.cache-hit != 'true'
        uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Log in to GHCR
        if: needs.route.outputs.ci-image != 'true' && steps.trivy.outputs.cache-hit != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare container-writable hosted checkout
        if: needs.route.outputs.ci-image != 'true' && runner.environment == 'github-hosted' && steps.trivy.outputs.cache-hit != 'true'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
      - name: Download the trivy vulnerability database
        id: trivy-warm
        if: steps.trivy.outputs.cache-hit != 'true'
        env:
          CI_IMAGE: ${{ needs.route.outputs.ci-image }}
        run: |
          if [ "$CI_IMAGE" = true ]; then
            if ! command -v trivy >/dev/null; then
              echo '::notice::CI image has no trivy yet; leave the database cache for the next refresh.'
              exit 0
            fi
            trivy fs --download-db-only --no-progress --quiet --cache-dir "$TRIVY_CACHE_DIR"
          else
            just build
            just exec trivy fs --download-db-only --no-progress --quiet --cache-dir "$TRIVY_CACHE_DIR"
          fi
          echo 'ready=true' >>"$GITHUB_OUTPUT"
      - name: Save the trivy vulnerability database
        if: steps.trivy-warm.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/trivy/db
          key: standards-trivy-db-${{ runner.os }}-${{ steps.week.outputs.week }}
