name: workflow validation
"on":
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate workflow syntax
        run: actionlint
      - name: Guard retired rollback entrypoints
        shell: bash
        run: |
          set -euo pipefail
          if [ -e .github/workflows/plumbing-ref-rollback.yml ]; then
            printf '%s\n' 'automated rollback workflow must remain absent' >&2
            exit 1
          fi
          if python3 .github/scripts/plumbing_ref.py rollback --help >/dev/null 2>&1; then
            printf '%s\n' 'automated rollback command must remain absent' >&2
            exit 1
          fi
      - name: Run workflow contract tests
        run: python3 -m unittest discover -s tests -v
