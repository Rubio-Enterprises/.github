name: workflow validation
# Static validation of this repo's workflows: actionlint plus the guard keeping
# the retired rollback entrypoints absent. The contract tests under tests/ are
# NOT run here — test-gate.yml is their single canonical runner (standards
# ADR 0020), so this workflow no longer duplicates that execution.
"on":
  pull_request:
permissions:
  contents: read
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate workflow syntax
        run: actionlint
      - name: Guard retired rollback entrypoints
        shell: bash
        run: |
          set -euo pipefail
          if [ -e .github/workflows/plumbing-ref-rollback.yml ]; then
            printf '%s\n' 'automated rollback workflow must remain absent' >&2
            exit 1
          fi
          if python3 .github/scripts/plumbing_ref.py rollback --help >/dev/null 2>&1; then
            printf '%s\n' 'automated rollback command must remain absent' >&2
            exit 1
          fi
