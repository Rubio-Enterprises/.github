name: plumbing ref publisher
"on":
  pull_request:
    paths:
      - .github/plumbing-ref/publication-request.json
  push:
    branches: [main]
    paths:
      - .github/plumbing-ref/publication-request.json
permissions: {}
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  readiness:
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-slim"]') }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.observe.outputs.version }}
    steps:
      - name: Check out publication request and candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Observe mise on the gate runner route
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api repos/Rubio-Enterprises/.github/git/ref/tags/gates/wf-v1 --jq '.object.sha')"
          target="$(jq -r '.target_sha' .github/plumbing-ref/publication-request.json)"
          python3 - "$current" "$target" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          pattern = re.compile(
              r'(?m)^[ \t]*# renovate: datasource=github-releases depName=jdx/mise\n'
              r'[ \t]*MISE_VERSION: "([0-9]{4}\.[0-9]+\.[0-9]+)"[ \t]*$'
          )
          def pin(sha):
              text = subprocess.check_output(
                  ["git", "show", f"{sha}:.github/workflows/standards-gates.yml"], text=True
              )
              pins = pattern.findall(text)
              if len(pins) != 1 or len(re.findall(r'(?m)^[ \t]*MISE_VERSION:', text)) != 1:
                  raise SystemExit("gate workflow must contain exactly one approved mise pin")
              return pins[0]

          current, target = sys.argv[1:]
          if pin(current) == pin(target):
              print("unchanged gate mise pin; runner observation not required")
              raise SystemExit(0)
          data_dir = os.environ.get("MISE_DATA_DIR")
          if not data_dir:
              xdg = os.environ.get("XDG_DATA_HOME")
              data_dir = str(Path(xdg) / "mise" if xdg else Path.home() / ".local/share/mise")
          binary = Path(data_dir) / "bin/mise"
          if not binary.is_file():
              raise SystemExit(f"pin change requires preinstalled mise on RUNNER_GLUE: {binary}")
          try:
              reported = json.loads(subprocess.check_output(
                  [str(binary), "version", "--json"], text=True
              ))["version"].split(" ")[0]
          except (KeyError, ValueError, subprocess.CalledProcessError) as error:
              raise SystemExit(f"unparseable preinstalled mise: {error}") from error
          if not re.fullmatch(r"[0-9]{4}\.[0-9]+\.[0-9]+", reported):
              raise SystemExit("unparseable preinstalled mise version")
          if pin(target) != reported:
              raise SystemExit(f"candidate mise {pin(target)} != observed RUNNER_GLUE {reported}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={reported}\n")
          print(f"observed RUNNER_GLUE mise {reported}")
          PY

  validate:
    needs: readiness
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out proposed request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out protected base validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-validator
          persist-credentials: false
      - name: Validate Publication Request
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          WARM_GLUE_MISE_VERSION: ${{ needs.readiness.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          validator=".github/scripts/plumbing_ref.py"
          if [ -f ".base-validator/.github/scripts/plumbing_ref.py" ]; then
            validator=".base-validator/.github/scripts/plumbing_ref.py"
          elif git cat-file -e "$BEFORE_SHA:.github/plumbing-ref/publication-request.json" 2>/dev/null; then
            echo "protected validator is missing from a post-bootstrap revision" >&2
            exit 1
          elif [ -n "$(git rev-list --max-count=1 "$BEFORE_SHA" -- \
            .github/plumbing-ref/publication-request.json \
            .github/scripts/plumbing_ref.py)" ]; then
            echo "publisher bootstrap already completed in protected history" >&2
            exit 1
          fi
          python3 "$validator" forward \
            --repository . \
            --remote origin \
            --request .github/plumbing-ref/publication-request.json \
            --manifest .github/plumbing-ref/gate-family-workflows.json \
            --before-sha "$BEFORE_SHA" \
            --after-sha "$AFTER_SHA" \
            --mode validate \
            --run-attempt 1 \
            --change-scope merge-base

  publish:
    needs: readiness
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out merged request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out protected prior validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.before }}
          path: .base-validator
          persist-credentials: false
      - name: Publish with exact compare-and-swap
        env:
          BEFORE_SHA: ${{ github.event.before }}
          WARM_GLUE_MISE_VERSION: ${{ needs.readiness.outputs.version }}
          AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          validator=".github/scripts/plumbing_ref.py"
          if [ -f ".base-validator/.github/scripts/plumbing_ref.py" ]; then
            validator=".base-validator/.github/scripts/plumbing_ref.py"
          elif git cat-file -e "$BEFORE_SHA:.github/plumbing-ref/publication-request.json" 2>/dev/null; then
            echo "protected validator is missing from a post-bootstrap revision" >&2
            exit 1
          elif [ -n "$(git rev-list --max-count=1 "$BEFORE_SHA" -- \
            .github/plumbing-ref/publication-request.json \
            .github/scripts/plumbing_ref.py)" ]; then
            echo "publisher bootstrap already completed in protected history" >&2
            exit 1
          fi
          python3 "$validator" forward \
            --repository . \
            --remote origin \
            --request .github/plumbing-ref/publication-request.json \
            --manifest .github/plumbing-ref/gate-family-workflows.json \
            --before-sha "$BEFORE_SHA" \
            --after-sha "$AFTER_SHA" \
            --mode publish \
            --run-attempt "$RUN_ATTEMPT" \
            --change-scope direct
