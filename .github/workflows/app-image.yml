name: app image (reusable)
"on":
  workflow_call:
    inputs:
      image-name:
        description: GHCR image without a tag; defaults to ghcr.io/<owner>/<repo>
        type: string
        default: ""
      context:
        description: Build context directory, relative to the repository root
        type: string
        default: .
      file:
        description: Dockerfile relative to the repository root; defaults to <context>/Dockerfile
        type: string
        default: ""
      target:
        description: Dockerfile stage to build
        type: string
        default: ""
      build-args:
        description: Build arguments, one NAME=value per line
        type: string
        default: ""
      labels:
        description: Extra OCI labels for docker/metadata-action, one key=value per line
        type: string
        default: ""
      tags:
        description: docker/metadata-action tag rules. Required when publish is true
        type: string
        default: ""
      flavor:
        description: docker/metadata-action flavor rules
        type: string
        default: ""
      publish:
        description: Push the final tags to GHCR, with provenance and an SBOM unless attestations is false
        type: boolean
        default: false
      candidate:
        description: >-
          Push the image to GHCR under a temporary candidate tag so a later job on another runner can pull it by digest, and
          test exactly those bytes. Stale candidates are pruned on later runs. Exclusive with publish and promote
        type: boolean
        default: false
      promote:
        description: >-
          Publish a tested candidate by retagging it: no build, no builder, no certificate. Needs candidate-image and tags.
          Exclusive with publish and candidate
        type: boolean
        default: false
      candidate-image:
        description: Promote only. The tested candidate, image@digest, from the candidate build's `image` output
        type: string
        default: ""
      attestations:
        description: Add provenance (mode=max) and an SBOM to a candidate or publish build
        type: boolean
        default: true
      moving-tags:
        description: >-
          Publish and promote only. Tags that may move to another image, one exact tag per line (for example a branch channel).
          Every other existing tag is never overwritten, and latest is never published
        type: string
        default: ""
      server:
        description: The image is a long-running server, so its configuration must declare a HEALTHCHECK
        type: boolean
        default: false
      block-vulnerabilities:
        description: Fail the build on a fixable CRITICAL vulnerability. By default the vulnerability report never fails it
        type: boolean
        default: false
      verified-image:
        description: >-
          Publish only: the candidate image@digest a job tested, from this workflow's `image` output. The workflow fails
          unless the published image has the same amd64 layers, so a cache eviction between the test and the publish cannot
          ship something that was not tested. Omit the input to publish without that check. An input that is passed but
          resolves empty (the output it reads is missing, for example because a job was skipped) fails the run instead of
          silently skipping the check
        type: string
        default: none
      standards-install:
        description: >-
          For a Dockerfile that copies a file from .standards/. A separate job with no OIDC token and read-only package
          access runs mise run standards:install and hands .standards/ to the build as an artifact, so repository code
          never runs in the job that holds the certificate and the registry credentials
        type: boolean
        default: false
      ref:
        description: Ref to check out; defaults to the event's ref
        type: string
        default: ""
      submodules:
        description: Check out submodules (false, true or recursive)
        type: string
        default: "false"
      timeout-minutes:
        description: Job timeout, queue time excluded
        type: number
        default: 45
    outputs:
      digest:
        description: Digest of the built image (the index digest when it carries attestations)
        value: ${{ jobs.build.outputs.digest || jobs.promote.outputs.digest }}
      image:
        description: Pullable reference, image@digest. Empty for a build check, which stays in the staging registry
        value: ${{ jobs.build.outputs.image || jobs.promote.outputs.image }}
      version:
        description: docker/metadata-action's version for this run
        value: ${{ jobs.build.outputs.version || jobs.promote.outputs.version }}
      tags:
        description: The final tags, one per line (publish and promote only)
        value: ${{ jobs.build.outputs.tags || jobs.promote.outputs.tags }}
permissions: {}
jobs:
  # The only job that runs repository tasks. It has no OIDC token and cannot write packages, and it runs on the small pool,
  # which cannot reach the Build Service: what it produces reaches the build as data, never as code
  prepare:
    name: Prepare the Standards Package
    if: inputs.standards-install && !inputs.promote
    permissions:
      contents: read
      packages: read
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # mise's pipx backend needs uv on PATH on a cold runner
      - name: Set up uv for mise
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.17"
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.10.19"
          install: false
          # A publishing workflow restores no cache another run could have poisoned
          cache: false
      - name: Install the Standards Package into .standards
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: mise install node && mise run standards:install
      # One name per call: a caller may call this workflow twice in a run, and an artifact name is unique within a run
      - name: Name the artifact
        id: name
        shell: bash
        run: echo "artifact=standards-$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - name: Hand .standards over as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: .standards
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Nothing in this job executes repository content: it holds the OIDC token, the certificate, the staging password and
  # the GHCR token. Repository files reach it only as the build context and as artifact data.
  build:
    name: Build on the Build Service (amd64)
    needs: prepare
    if: ${{ !cancelled() && !failure() && !inputs.promote }}
    permissions:
      contents: read
      packages: write
      id-token: write
    # The image Scale Set's own label is the fallback: the daemon is reachable only from there, so hosted runners cannot build
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').image || fromJSON('["linux-x64-image"]') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ inputs.publish && steps.meta.outputs.tags || '' }}
    steps:
      - name: Resolve the image and the build mode
        id: resolve
        shell: bash
        env:
          IMAGE_INPUT: ${{ inputs.image-name }}
          PUBLISH: ${{ inputs.publish }}
          CANDIDATE: ${{ inputs.candidate }}
          TAGS: ${{ inputs.tags }}
          VERIFIED: ${{ inputs.verified-image }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true && "$CANDIDATE" == true ]]; then
            echo "::error::publish and candidate are exclusive: a candidate is what a run job pulls before anything is published"
            exit 1
          fi
          if [[ "$PUBLISH" == true && -z "${TAGS//[[:space:]]/}" ]]; then
            echo "::error::publish needs the tags input"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${IMAGE_INPUT:-ghcr.io/${GITHUB_REPOSITORY,,}}"
          image="${image,,}"
          prefix="ghcr.io/$owner/"
          package="${image#"$prefix"}"
          if [[ "$image" != "$prefix"* || ! "$package" =~ ^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$ ]]; then
            echo "::error::image-name must be an untagged GHCR image in the caller's owner namespace"
            exit 1
          fi
          # A repository's main image is <repo>; its others are <repo>/<name>
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          if [[ "$package" != "$repo" && "$package" != "$repo/"* ]]; then
            echo "::error::image-name must be $prefix$repo or $prefix$repo/<name>: an image belongs to the repository that builds it"
            exit 1
          fi
          # An omitted input is `none`; a passed value that resolves empty is an unwired output, never "skip the check"
          if [[ "$VERIFIED" != none ]]; then
            if [[ -z "$VERIFIED" ]]; then
              echo "::error::verified-image was passed but is empty: the job output it reads did not resolve. Omit the input to publish without verification"
              exit 1
            fi
            if [[ "$PUBLISH" != true ]]; then
              echo "::error::verified-image only applies to a publish"
              exit 1
            fi
            digest="${VERIFIED#"$image@sha256:"}"
            if [[ "${VERIFIED,,}" != "$image@sha256:"* || ! "${digest,,}" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::verified-image must be this image's candidate, image@sha256:<digest>"
              exit 1
            fi
          fi
          mode=check
          if [[ "$PUBLISH" == true ]]; then mode=publish; fi
          if [[ "$CANDIDATE" == true ]]; then mode=candidate; fi
          printf 'image=%s\nmode=%s\n' "$image" "$mode" >> "$GITHUB_OUTPUT"
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ inputs.submodules }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      # Data, not code: the prepare job's output lands where the Dockerfile expects it
      - name: Fetch the Standards Package prepared without credentials
        if: inputs.standards-install
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: .standards
      - name: Install the Build Service client tools
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        with:
          operation: tools
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # A ref other than the event's is what gets built, so its tags and labels come from the checkout, not the event
          context: ${{ inputs.ref != '' && inputs.ref != github.ref && inputs.ref != github.sha && 'git' || 'workflow' }}
          images: ${{ steps.resolve.outputs.image }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
      - name: Connect to the Build Service
        uses: Rubio-Enterprises/.github/actions/app-image@main
        with:
          operation: connect
      - name: Build the image on the Build Service
        id: build
        uses: Rubio-Enterprises/.github/actions/app-image@main
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          MODE: ${{ steps.resolve.outputs.mode }}
          BUILD_CONTEXT: ${{ inputs.context }}
          BUILD_FILE: ${{ inputs.file }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ inputs.build-args }}
          BUILD_LABELS: ${{ steps.meta.outputs.labels }}
          ATTESTATIONS: ${{ inputs.attestations }}
        with:
          operation: build
      # Before anything reaches GHCR: an image that is root, leaks a secret or lacks a HEALTHCHECK it needs is never pushed.
      # It reads the staged image with the staging credential only
      - name: Check the image's structure
        uses: Rubio-Enterprises/.github/actions/app-image@main
        env:
          SERVER: ${{ inputs.server }}
          BLOCK_VULNERABILITIES: ${{ inputs.block-vulnerabilities }}
        with:
          operation: structure
      - name: Copy the verified image to GHCR
        id: publish
        if: steps.resolve.outputs.mode != 'check'
        uses: Rubio-Enterprises/.github/actions/app-image@main
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          MODE: ${{ steps.resolve.outputs.mode }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MOVING_TAGS: ${{ inputs.moving-tags }}
          VERIFIED_IMAGE: ${{ inputs.verified-image }}
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          operation: publish
      - name: Prune stale candidate images
        if: steps.resolve.outputs.mode == 'candidate'
        uses: Rubio-Enterprises/.github/actions/app-image@main
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        with:
          operation: prune
      - name: Remove the job's certificate, credentials and build inputs
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/build-service" "$RUNNER_TEMP/app-image"

  # Gives a tested candidate its final tags. There is no builder and no certificate here: the job holds only the GHCR token,
  # and nothing from the repository runs in it
  promote:
    name: Promote the tested image
    if: inputs.promote
    permissions:
      contents: read
      packages: write
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
      image: ${{ steps.promote.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Resolve the image
        id: resolve
        shell: bash
        env:
          IMAGE_INPUT: ${{ inputs.image-name }}
          PUBLISH: ${{ inputs.publish }}
          CANDIDATE: ${{ inputs.candidate }}
          TAGS: ${{ inputs.tags }}
          CANDIDATE_IMAGE: ${{ inputs.candidate-image }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true || "$CANDIDATE" == true ]]; then
            echo "::error::promote is exclusive with publish and candidate: it only retags a tested image"
            exit 1
          fi
          if [[ -z "${TAGS//[[:space:]]/}" ]]; then
            echo "::error::promote needs the tags input"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${IMAGE_INPUT:-ghcr.io/${GITHUB_REPOSITORY,,}}"
          image="${image,,}"
          prefix="ghcr.io/$owner/"
          package="${image#"$prefix"}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          if [[ "$image" != "$prefix"* || ! "$package" =~ ^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$ ]] ||
            [[ "$package" != "$repo" && "$package" != "$repo/"* ]]; then
            echo "::error::image-name must be $prefix$repo or $prefix$repo/<name>: an image belongs to the repository that builds it"
            exit 1
          fi
          digest="${CANDIDATE_IMAGE#"$image@sha256:"}"
          if [[ "${CANDIDATE_IMAGE,,}" != "$image@sha256:"* || ! "${digest,,}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::candidate-image must be this image's tested candidate, image@sha256:<digest>: the output it reads did not resolve"
            exit 1
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      # The checkout is needed only to compute tags for a ref other than the event's, and it is data, never code
      - name: Check out the caller
        if: inputs.ref != '' && inputs.ref != github.ref && inputs.ref != github.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the registry client tools
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        with:
          operation: tools
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          context: ${{ inputs.ref != '' && inputs.ref != github.ref && inputs.ref != github.sha && 'git' || 'workflow' }}
          images: ${{ steps.resolve.outputs.image }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}
      - name: Give the tested image its final tags
        id: promote
        uses: Rubio-Enterprises/.github/actions/app-image@main
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          CANDIDATE_IMAGE: ${{ inputs.candidate-image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MOVING_TAGS: ${{ inputs.moving-tags }}
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          operation: promote
      - name: Remove the job's credentials and working files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/build-service" "$RUNNER_TEMP/app-image"
