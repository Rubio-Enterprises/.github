name: typecheck-ts (gate)
# Required Governance Workflow — the `gate-typescript` family. Injected by a
# Terraform org ruleset targeting the `gate-typescript` custom property; GitHub
# auto-triggers it on `pull_request` / `merge_group` and ignores event filters.
# It runs the consumer's `mise run typecheck` task (strict `tsc --noEmit`, or
# `astro check` for astro repos — the task delegates to scripts.typecheck).
# Extracted from the inline `typecheck` job the template rendered into each
# consumer's standards.yml. Property targeting should only attach this to ts-*
# repos; the defensive "no typecheck task -> pass" branch keeps it green if it
# is ever attached to a repo that has no such task.
"on":
  pull_request:
  merge_group:
  # Also callable, so a repo's rendered `standards.yml` can run this same file
  # on push-to-default with `seed-caches: true`. Injected required workflows
  # only ever fire on `pull_request`, and a PR-ref cache is private to that PR,
  # so the default branch is the only place a reusable cache can be written.
  # Reusing THIS file rather than a separate seeder is deliberate: the cache
  # keys are then defined once, and a seeder that drifts from the gate's key
  # format fails silently — it writes caches nobody ever reads.
  workflow_call:
    inputs:
      seed-caches:
        description: >-
          Save the pnpm store cache after installing, instead of only reading
          it. Set this ONLY for push-to-default runs; on a PR ref the write is
          unreadable by every other PR and still consumes the repo's cache
          budget.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Prefixed with the workflow's own name, NOT bare `github.workflow`. In a
  # called workflow `github.workflow` resolves to the CALLER's name, so a bare
  # group would collide with the caller's own concurrency group — the caller
  # holds it while waiting for this job, which waits for the group: deadlock.
  group: typecheck-ts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    # Resolve the runner from the consumer's DECLARED Workload Class
    # (`typecheck_workload_class`, standards ADR-0022) instead of routing every
    # selected repo to glue-heavy.
    #
    # Why this job exists: this workload's `pnpm install` + `tsc` peak at
    # 1.73-2.22 GB while glue is sized around a measured p90 of 0.74 GB per
    # container, and sharing all 24 glue slots with that tail is what let three
    # kodus-ai containers get SIGKILLed simultaneously on 2026-07-28 (a day with
    # 42 host `global_oom` kills whose invokers included postgres and frigate).
    # But glue-heavy is the same image bounded to just 3 slots
    # (mac-dev-playbook cue/mac/config_outrunner.cue), and the gate-typescript
    # selector already means "this repo has TypeScript" — so routing on
    # selection alone put all 15 has_typescript repos onto those 3 slots, where
    # a repo that does not need the tier takes a slot from one that does.
    #
    # A SEPARATE JOB because `runs-on:` is evaluated before any checkout, so the
    # typecheck job cannot read the answers file to choose its own runner.
    # Named `route`, not `detect`, because the typecheck job below already has a
    # `detect` STEP that resolves the mise task.
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-slim"]') }}
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Sparse-checkout the consumer's .copier-answers.yml
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          sparse-checkout: .copier-answers.yml
          sparse-checkout-cone-mode: false
      - name: Pick the runner from the declared Workload Class
        id: pick
        env:
          GLUE_RUNNER: ${{ vars.RUNNER_GLUE || '["ubuntu-slim"]' }}
          # Fallback CHAIN, not a plain default: `|| vars.RUNNER_GLUE` means a
          # glue-heavy declaration is safe to land before the routing variable
          # exists — it degrades to glue rather than silently diverting the
          # fleet's gates to hosted minutes. `["ubuntu-slim"]` remains the last
          # resort for a bootstrap / `fleet ci mode github-hosted` state where
          # neither variable is set.
          HEAVY_RUNNER: >-
            ${{ vars.RUNNER_GLUE_HEAVY || vars.RUNNER_GLUE
            || '["ubuntu-slim"]' }}
        shell: bash
        run: |
          # Anchored and quote-tolerant. The answers file is copier-generated so
          # the value is unquoted, but the `$` anchor stops a future class whose
          # name merely STARTS with glue-heavy from matching by prefix.
          # Case-insensitive per ADR-0018: classes are stored canonically in
          # lowercase but are case-insensitive at workflow boundaries.
          #
          # An absent file or absent answer falls through to glue. That is the
          # intended degradation for a repo that has not re-rendered yet, and it
          # is why the answer carries no copier `when:` mask — a pruned answer
          # would be indistinguishable from a deliberate `glue` declaration.
          if grep -qiE \
            "^typecheck_workload_class:[[:space:]]*[\"']?glue-heavy[\"']?[[:space:]]*\$" \
            .copier-answers.yml 2>/dev/null; then
            printf 'runner=%s\n' "$HEAVY_RUNNER" >> "$GITHUB_OUTPUT"
          else
            printf 'runner=%s\n' "$GLUE_RUNNER" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - name: Check out the consumer repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # uv on PATH routes mise's pipx-backend installs through uvx; without it
      # mise >= 2026.6.2 falls back to pip's --uploaded-prior-to which cold
      # runners' bootstrap pip (< 26) rejects.
      - name: Install uv (routes mise pipx installs through uvx)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.1"

      # Fingerprint the uv-resolved python into the mise cache key (standards#331).
      # mise routes pipx installs through uvx, whose venvs carry a shebang pointing
      # at the uv-MANAGED python under ~/.local/share/uv/python — OUTSIDE the
      # ~/.local/share/mise tree jdx/mise-action caches. When uv's default python
      # bumps (e.g. 3.14.3 → 3.14.4), a cache restored onto a fresh runner VM hands
      # back pipx venvs whose shebang points at an interpreter that VM lacks, so
      # every tool dies with "couldn't exec process" — a permanently poisoned cache
      # no re-run fixes. Folding the version into cache_key_prefix makes a python
      # bump INVALIDATE the cache instead of poisoning it. `uv python find` never
      # downloads and can fall back to a system python, so install first
      # (idempotent — the same managed interpreter uvx would provision anyway),
      # then read the managed version.
      - name: Fingerprint the uv-resolved python for the mise cache key
        id: uv-python
        shell: bash
        run: |
          set -euo pipefail
          uv python install
          version="$(uv python find --managed-python --show-version)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve the uv-managed python version for the mise cache key" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "uv-resolved python for mise cache key: $version"

      - name: Install consumer-repo runtimes
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          # Key the mise cache to the uv-resolved python (standards#331): a python
          # bump changes the prefix and invalidates rather than poisons the cache.
          cache_key_prefix: mise-v1-uvpy${{ steps.uv-python.outputs.version }}
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.7.7"

      - name: Detect the typecheck task
        # `mise tasks info` exits non-zero when the task is absent (non-ts repo,
        # or a repo with no .mise.toml at all — e.g. .github itself). Defensive:
        # property targeting should prevent this, but a mis-targeted repo passes
        # green with a notice rather than failing on a missing task.
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if mise tasks info typecheck >/dev/null 2>&1; then
            echo "has_typecheck=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_typecheck=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no 'typecheck' mise task — repo is not a TypeScript archetype; typecheck gate passes (defensive)"
          fi

      - name: Install pnpm (avoids corepack keyring drift)
        # Mirrors the inline typecheck job: stand pnpm up via action-setup (reads
        # packageManager) rather than corepack, whose bundled pnpm signing-key
        # store crashes with `Cannot find matching keyid`. No-op without a
        # pnpm-lock.
        if: steps.detect.outputs.has_typecheck == 'true' && hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      # Cache the pnpm content-addressed store. Without this the gate
      # re-downloads the whole dependency set on every run — measured at 3,095
      # packages / 78 s quiet / 285 s under load for a large monorepo, on an
      # ephemeral container that starts cold every time. That download is also
      # a memory peak: 5 of the 7 exit-137 kills observed on the glue pool in
      # the 2026-07-28 Renovate wave happened inside `pnpm install`, before any
      # type-checking began.
      #
      # `restore-keys` matters more than the exact key here. A Renovate PR
      # changes the lockfile, so the hash never matches; the prefix match still
      # restores the newest store and pnpm downloads only the delta.
      #
      # This is `cache/restore`, NOT `cache` — the gate READS but never WRITES.
      # Caches written on a PR ref are private to that PR, and this workflow is
      # injected by an org ruleset that only ever fires on `pull_request`, so a
      # writing gate could only ever produce caches no other PR can read. On a
      # 3,000-package monorepo that measured out at ~700 MB and ~110 s of save
      # per PR for zero reuse — and since these repos already sit at ~102 % of
      # the 10 GiB per-repo cache limit, each write evicted something that WAS
      # being hit. PR runs may always read the base branch's caches, so the
      # default branch is the only place worth writing from — which is what the
      # `seed-caches` input and the "Seed the pnpm store cache" step below do.
      # A repo whose `standards.yml` does not call this workflow on push simply
      # gets a no-op miss here, which is still strictly better than the write.
      # Resolving the store must never be able to fail the gate. `pnpm store
      # path` writes the path on stdout and its deprecation notices on stderr,
      # so command substitution already yields a clean value — but an empty or
      # unresolvable result would hand actions/cache an empty `path:`, which is
      # a hard "Path Validation Error" and would fail a REQUIRED check for every
      # pnpm consumer at once. Treat resolution as best-effort: on any failure
      # emit ok=false and skip caching, leaving the install to run uncached.
      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.detect.outputs.has_typecheck == 'true' && hashFiles('pnpm-lock.yaml') != ''
        shell: bash
        run: |
          set -uo pipefail
          if ! store="$(pnpm store path --silent 2>/dev/null)" || [ -z "$store" ]; then
            echo "::notice::could not resolve the pnpm store path — skipping the store cache"
            printf 'ok=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'ok=true\n' >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$store" >> "$GITHUB_OUTPUT"
          echo "pnpm store: $store"
      - name: Restore the pnpm store
        if: steps.pnpm-store.outputs.ok == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install JS deps
        # Type-checking needs node_modules (typescript, @types/*, astro). mise
        # installs the toolchain but not the workspace. Lockfile-aware and
        # frozen: a package.json without a committed lockfile is a hard error,
        # not a lenient install. Mirrors the inline typecheck job.
        #
        # The pnpm branch throttles its own parallelism. This step — NOT the
        # type-check — is where 5 of the 7 exit-137 kills landed during the
        # 2026-07-28 Renovate wave: pnpm's defaults (16 concurrent HTTP
        # requests, 5 concurrent build child-processes) each hold a decompressed
        # tarball in flight, so peak RSS scales with the concurrency, not with
        # the size of the dependency graph. Halving both caps the transient peak
        # while barely moving wall-clock, because the step is network-bound long
        # before it is CPU-bound. The glue containers are sized for ~0.75 GB
        # jobs, so the peak is the number that has to come down.
        #
        # Only pnpm is throttled: it is the measured offender, and the other
        # package managers have no observed kill to justify tuning them blind.
        if: steps.detect.outputs.has_typecheck == 'true'
        env:
          MISE_ENV: ci
        shell: bash
        run: |
          set -euo pipefail
          # Kept in a variable so the branch bodies below stay aligned.
          pnpm_flags=(--frozen-lockfile --network-concurrency=8 --child-concurrency=2)
          if [ -f package.json ]; then
            if   [ -f pnpm-lock.yaml ];               then pnpm install "${pnpm_flags[@]}"
            elif [ -f yarn.lock ];                    then corepack yarn install --frozen-lockfile
            elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
            elif [ -f package-lock.json ];            then npm ci
            else echo "::error::package.json without a lockfile — commit one"; exit 1
            fi
          fi

      # The counterpart to the read-only restore above, and the ONLY place this
      # workflow writes the store. Gated on `seed-caches`, which a repo's
      # rendered `standards.yml` sets true for push-to-default runs only — a
      # write from a PR ref is unreadable by every other PR while still
      # consuming the repo's 10 GiB cache budget.
      #
      # Placed here rather than in a post step so it runs even when the
      # type-check below fails: the store's contents are decided by the
      # lockfile, and a repo with a genuine type error still deserves a warm
      # store for the PR that fixes it. Re-running an unchanged default branch
      # re-uses the same key, which `cache/save` reports as a skip, not an
      # error.
      - name: Seed the pnpm store cache
        if: >-
          inputs.seed-caches
          && steps.detect.outputs.has_typecheck == 'true'
          && steps.pnpm-store.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Cache turbo's local task cache for monorepo consumers. Turbo hashes each
      # package's own inputs plus its resolved external deps, so a restored
      # cache replays every task whose hash still matches and re-runs only the
      # rest. Measured on a 23-package consumer: an unchanged re-run is 80 ms
      # (23/23 replayed), touching one app's source re-runs 1 task, and — the
      # case that matters here — bumping a single package's dependency in the
      # lockfile still replays 22 of 23. That is the shape of a Renovate wave,
      # which is exactly when this pool runs out of memory.
      #
      # The key is intentionally rolling: turbo decides validity from its own
      # hashes, so the cache only needs to be recent, not matched. The artifact
      # is small (single-digit MB for 23 tasks).
      #
      # Unlike the pnpm store above, this one still WRITES from PR runs, and so
      # needs no `seed-caches` gate. The asymmetry is purely about size: at
      # ~1 MB and ~1 s per save it does not move the repo's cache-eviction
      # budget, and the within-PR payoff is real — when Renovate rebases a PR
      # the second run replays 22 of 23 tasks off the first run's cache. A
      # 700 MB store write could not earn that back. Being plain `cache` also
      # means a push-to-default run seeds the default branch for free.
      - name: Restore the turbo task cache
        if: steps.detect.outputs.has_typecheck == 'true' && hashFiles('turbo.json') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-${{ runner.arch }}-

      - name: Type-check (mise run typecheck)
        if: steps.detect.outputs.has_typecheck == 'true'
        env:
          MISE_ENV: ci
          # Conservative CI concurrency floor for monorepo build tools (a turbo
          # `typecheck` spawns one tsc per package; at turbo's default a large
          # workspace can OOM the runner). tsc/astro ignore it; turbo honors it;
          # a repo's explicit --concurrency overrides it.
          TURBO_CONCURRENCY: "2"
        run: mise run typecheck

  gate:
    # Bucket job — always reports so the required check never hangs "Expected".
    #
    # `route` is in `needs` deliberately, not just `typecheck`. A failed `route`
    # SKIPS typecheck, and `skipped` matches neither `failure` nor `cancelled`
    # below — so without this the gate would report PASS on a routing failure
    # while nothing was typechecked. Depending on both keeps that fail-closed.
    needs: [route, typecheck]
    if: always()
    runs-on: ${{ fromJSON(vars.RUNNER_GLUE || '["ubuntu-slim"]') }}
    steps:
      - name: Aggregate gate result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dependency results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "::error::typecheck-ts gate failed (a dependency reported '$r')"
                exit 1
                ;;
            esac
          done
          echo "typecheck-ts gate passed"
