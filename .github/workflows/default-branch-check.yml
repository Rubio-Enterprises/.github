name: default branch verification (reusable)
"on":
  workflow_call:
    inputs:
      central-ref:
        description: Central evidence module source; branch ref for pre-merge canaries only
        type: string
        default: main
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  evidence:
    permissions:
      actions: read
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.lookup.outputs.runs }}
      warm-macos: ${{ steps.macos-cache.outputs.needed }}
    steps:
      - name: Check out the evidence module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ inputs.central-ref }}
          persist-credentials: false
          sparse-checkout: scripts/checked-tree.py
      - id: lookup
        name: Look for exact-files PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(python3 scripts/checked-tree.py) || {
            printf '::warning::scripts/checked-tree.py exited with status %s; running verification.\n' "$?"
            runs='{}'
          }
          if [ -n "$runs" ] && [ "$runs" != '{}' ]; then
            jq -r 'to_entries[] | "Reused [\(.key)](\(.value)): these exact files passed."' <<< "$runs" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'runs=%s\n' "$runs" >> "$GITHUB_OUTPUT"
      - id: macos-cache
        name: Check the default-ref macOS download cache when reusing PR verification
        if: >-
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.lookup.outputs.runs != '{}' && steps.lookup.outputs.runs != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let hash;
            try {
              let platform = context.runAttempt > 1 ? undefined
                : context.payload.repository?.custom_properties?.['ci-platform'];
              if (!platform) {
                const {data} = await github.request('GET /repos/{owner}/{repo}/properties/values', context.repo);
                platform = data.find(p => p.property_name === 'ci-platform')?.value;
              }
              if (platform !== 'macos') return;
              const {data} = await github.request('GET /repos/{owner}/{repo}/contents/image/mise.lock', {
                ...context.repo, ref: context.sha,
              });
              if (data.type !== 'file' || data.encoding !== 'base64' || !data.content) {
                throw new Error('expected a base64-encoded image/mise.lock file');
              }
              // Runner hashFiles hashes the concatenated binary digests, even for one file.
              const {createHash} = require('node:crypto');
              const digest = createHash('sha256').update(data.content, 'base64').digest();
              hash = createHash('sha256').update(digest).digest('hex');
            } catch {
              core.warning('Could not resolve a macOS lock for cache warming.');
              return;
            }
            // Both the organization macOS route and its hosted fallback are ARM64.
            const key = `macos-tools-downloads-macOS-ARM64-${hash}`;
            try {
              const ref = context.ref;
              const {data} = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                ...context.repo, key, ref,
              });
              core.setOutput('needed', !data.actions_caches.some(entry => entry.key === key && entry.ref === ref));
            } catch {
              core.warning('Could not look up the default-ref macOS cache; check on the macOS runner.');
              core.setOutput('needed', true);
            }
  warm-macos-downloads:
    needs: evidence
    if: needs.evidence.outputs.warm-macos == 'true'
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').macos || fromJSON('["macos-26"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the runner's exact cache version before installing
        id: macos-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/macos-tools/cache/downloads-cas
          key: macos-tools-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('image/mise.lock') }}
          lookup-only: true
      - name: Provision pinned repository tools without running Lifecycle Scripts
        if: steps.macos-downloads.outputs.cache-hit != 'true'
        uses: Rubio-Enterprises/.github/actions/macos-tools@main
        with:
          runners: ""
      - name: Save macOS tool downloads on the default ref
        if: steps.macos-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/macos-tools/cache/downloads-cas
          key: ${{ steps.macos-downloads.outputs.cache-primary-key }}
  route:
    needs: evidence
    if: >-
      ${{ !cancelled() && (needs.evidence.result != 'success' ||
      needs.evidence.outputs.runs == '{}' || needs.evidence.outputs.runs == '') }}
    permissions:
      contents: read
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
    with:
      route: linux
  standards-linux:
    name: standards-linux
    needs: route
    permissions:
      contents: read
      packages: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require lefthook.yml
        run: |
          test -f lefthook.yml ||
            { echo "::error::repository not onboarded: run npm init @rubio-enterprises/standards"; exit 1; }
      - name: Check out central Docker preparation action
        if: needs.route.outputs.ci-image != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: main
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: actions/prepare-hosted-docker
      - name: Prepare hosted Docker disk
        if: needs.route.outputs.ci-image != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: ./.cache/central-test-gate/actions/prepare-hosted-docker # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
      - name: Remove central Docker preparation checkout
        if: needs.route.outputs.ci-image != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: rm -rf .cache/central-test-gate
      - id: week
        name: Name this week's cache keys
        run: echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"
      # Restore only. A pull request's own save is scoped to its merge ref, so no other pull request
      # could restore it. The caller standards-cache.yml writes this key on the default branch.
      # The trivy Check globs lockfiles, so a repository without one scans nothing. Restoring the
      # database anyway unpacks 1.81 GB onto the runner's disk for a scan that never runs, which is
      # write wear we pay for on the self-hosted pool. node_modules and .venv are excluded because
      # the Check skips those directories too.
      - id: lockfiles
        name: Look for a lockfile the trivy Check would scan
        run: |
          found=false
          if find . \
            \( -name node_modules -o -name .venv -o -name .git \) -prune -o \
            -type f \( \
              -name package-lock.json -o -name npm-shrinkwrap.json -o -name yarn.lock -o \
              -name pnpm-lock.yaml -o -name bun.lock -o -name uv.lock -o -name poetry.lock -o \
              -name Pipfile.lock -o -name go.sum -o -name Cargo.lock -o -name Gemfile.lock -o \
              -name composer.lock \
            \) -print -quit | grep -q .; then
            found=true
          fi
          echo "trivy vulnerability database: lockfile present: $found"
          echo "found=$found" >>"$GITHUB_OUTPUT"
      - id: trivy-db
        name: Restore the trivy vulnerability database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.lockfiles.outputs.found == 'true'
        with:
          path: .cache/trivy/db
          key: standards-trivy-db-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: standards-trivy-db-${{ runner.os }}-
      # trivy replaces a database older than a day (metadata.json NextUpdate), which would make the
      # weekly cache useless. A restored one under 8 days old is used as it is.
      - name: Use the restored trivy database without updating it
        if: steps.trivy-db.outputs.cache-matched-key != ''
        run: |
          days=$(jq -r '(now - (.UpdatedAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) / 86400 | floor' \
            .cache/trivy/db/metadata.json) || days=99
          echo "trivy vulnerability database: restored, $days day(s) old"
          if [ "$days" -lt 8 ]; then echo "TRIVY_SKIP_DB_UPDATE=true" >>"$GITHUB_ENV"; fi

      - name: Set up dependencies (CI Image)
        if: needs.route.outputs.ci-image == 'true'
        uses: Rubio-Enterprises/.github/actions/setup-check-dependencies@main

      - id: check-ci
        name: Every Check on every file (CI Image)
        if: needs.route.outputs.ci-image == 'true'
        run: standards check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

      - name: Install just
        if: needs.route.outputs.ci-image != 'true'
        uses: Rubio-Enterprises/.github/actions/setup-just@main

      - name: Log in to ghcr.io
        if: needs.route.outputs.ci-image != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: context-hosted
        name: Prepare container-visible hosted context
        if: needs.route.outputs.ci-image != 'true'
        run: |
          for path in .cache .cache/ci .cache/ci/context.json .cache/ci/event.json .cache/ci/summary.md; do
            if [ -L "$GITHUB_WORKSPACE/$path" ]; then
              echo "::error::refusing hosted context through symlink: $path"
              exit 1
            fi
          done
          if git ls-files --error-unmatch -- .cache/ci/context.json >/dev/null 2>&1; then
            echo "::error::refusing tracked hosted context: .cache/ci/context.json"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.cache/ci"
          cp "$GITHUB_EVENT_PATH" "$GITHUB_WORKSPACE/.cache/ci/event.json"
          jq -n \
            --arg GITHUB_WORKFLOW "$GITHUB_WORKFLOW" \
            --arg GITHUB_EVENT_NAME "$GITHUB_EVENT_NAME" \
            --arg GITHUB_EVENT_PATH "$GITHUB_WORKSPACE/.cache/ci/event.json" \
            --arg GITHUB_REPOSITORY "$GITHUB_REPOSITORY" \
            --arg GITHUB_RUN_ID "$GITHUB_RUN_ID" \
            --arg GITHUB_SERVER_URL "$GITHUB_SERVER_URL" \
            --arg GITHUB_STEP_SUMMARY "$GITHUB_WORKSPACE/.cache/ci/summary.md" \
            --arg TRIVY_CACHE_DIR "$TRIVY_CACHE_DIR" \
            --arg XDG_CACHE_HOME "$XDG_CACHE_HOME" \
            --arg CI "$CI" \
            '$ARGS.named + (if env.TRIVY_SKIP_DB_UPDATE == null then {} else
              {TRIVY_SKIP_DB_UPDATE: env.TRIVY_SKIP_DB_UPDATE} end)' \
            >"$GITHUB_WORKSPACE/.cache/ci/context.json"

      - name: Prepare container-writable hosted checkout
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
      - name: Build dev image
        if: needs.route.outputs.ci-image != 'true'
        run: just build-dev
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up dependencies (Hosted)
        if: needs.route.outputs.ci-image != 'true'
        run: |
          if [ "$CI_PLATFORM" = macos ]; then
            if [ -f Gemfile ]; then
              just exec bin/setup.sh
            fi
          else
            just setup
          fi
        env:
          CI_PLATFORM: ${{ needs.route.outputs.platform }}
          GH_TOKEN: ${{ github.token }}

      - id: check-hosted
        name: Every Check on every file (Hosted)
        if: needs.route.outputs.ci-image != 'true'
        run: |
          if [ "$CI_PLATFORM" = macos ]; then
            just exec standards check
          else
            just check
          fi
        env:
          CI_PLATFORM: ${{ needs.route.outputs.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

      - name: Summarize what the Checks rewrote
        if: ${{ failure() && (steps['check-ci'].outcome == 'failure' || steps['check-hosted'].outcome == 'failure') }}
        run: |
          { echo '```'; git status --short; git diff --stat; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::the Checks failed or a Fixer rewrote files; run 'just check' locally and commit the result"

  standards-macos:
    name: standards-macos
    needs: route
    if: needs.route.outputs.platform == 'macos'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').macos || fromJSON('["macos-26"]') }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install just
        uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Check out central macOS tools action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: main
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: |
            actions/macos-tools
            actions/release-asset
      - name: Restore macOS tool downloads
        id: macos-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/macos-tools/cache/downloads-cas
          key: macos-tools-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('image/mise.lock') }}
      - name: Install mise if missing on macOS
        uses: ./.cache/central-test-gate/actions/macos-tools # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
        with:
          provision: "false"
      - name: Remove central macOS tools checkout
        run: |
          cp .cache/central-test-gate/actions/macos-tools/run-recipe.sh "$RUNNER_TEMP/macos-recipe.sh"
          rm -rf .cache/central-test-gate
      - name: Set up native Checks
        run: bash "$RUNNER_TEMP/macos-recipe.sh" setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save macOS tool downloads
        if: steps.macos-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/macos-tools/cache/downloads-cas
          key: ${{ steps.macos-downloads.outputs.cache-primary-key }}
      - name: Native Checks
        run: bash "$RUNNER_TEMP/macos-recipe.sh" check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  standards-main:
    name: standards-main
    needs: [evidence, route, standards-linux, standards-macos]
    if: >-
      ${{ always() && (needs.evidence.result != 'success' ||
      needs.evidence.outputs.runs == '{}' || needs.evidence.outputs.runs == '') }}
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require all applicable Checks to succeed
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          PLATFORM: ${{ needs.route.outputs.platform }}
          LINUX_RESULT: ${{ needs.standards-linux.result }}
          MACOS_RESULT: ${{ needs.standards-macos.result }}
        run: |
          test "$ROUTE_RESULT" = success && test "$LINUX_RESULT" = success &&
            { { test "$PLATFORM" = macos && test "$MACOS_RESULT" = success; } ||
              { test "$PLATFORM" = linux && test "$MACOS_RESULT" = skipped; }; }

  test-gate-execution:
    needs: evidence
    if: >-
      ${{ !cancelled() && (needs.evidence.result != 'success' ||
      needs.evidence.outputs.runs == '{}' || needs.evidence.outputs.runs == '') }}
    permissions:
      contents: read
      packages: read
    uses: Rubio-Enterprises/.github/.github/workflows/test-gate.yml@main
  test-gate-main:
    name: test-gate-main / test-gate
    needs: [evidence, test-gate-execution]
    if: >-
      ${{ always() && (needs.evidence.result != 'success' ||
      needs.evidence.outputs.runs == '{}' || needs.evidence.outputs.runs == '') }}
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require Test Gate execution to succeed
        env:
          EXECUTION: ${{ needs.test-gate-execution.result }}
        run: test "$EXECUTION" = success
