name: secret scan (reusable)
# Scheduled / dispatched full-history TruffleHog scan, thin-called from a
# consumer's rendered standards.yml with `mode: trufflehog`. The PR-time
# gitleaks scan it once carried as the gate-secret-scan Gate Family now runs in
# standards-gates.yml (.github-private ADR 0002).
"on":
  workflow_call:
    inputs:
      mode:
        description: "trufflehog (scheduled full-history scan)"
        type: string
        required: false
        default: trufflehog
permissions: { contents: read }
concurrency:
  # Prefixed with this workflow's own file name, NOT bare `github.workflow`: in
  # a `workflow_call` context `github.workflow` resolves to the CALLER's name,
  # so a bare group would collide with the caller's own group (a consumer's
  # `standards.yml` uses exactly `github.workflow`-`github.ref`) — the caller
  # holds that group while waiting for this job, which waits for the group:
  # deadlock.
  #
  # Keyed by `github.run_id` so every call gets a group of its own. A shared
  # ref-keyed group would serialize a scheduled weekly scan and an
  # incident-response `workflow_dispatch` scan, and GitHub keeps at most one
  # PENDING run per group, so a third trigger would silently drop the queued
  # one. A security scan must never be dropped or made to wait on another scan.
  group: secret-scan-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  # A caller pinned to this SHA with the retired `mode: gitleaks` would
  # otherwise run nothing and pass; make that loud instead.
  unsupported-mode:
    if: inputs.mode != 'trufflehog'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').light || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 5
    steps:
      - name: Reject an unsupported mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "::error::secret-scan.yml supports only mode 'trufflehog' (got '$MODE'); the PR-time gitleaks scan runs in the standards-gates Required Governance Workflow"
          exit 1
  trufflehog:
    if: inputs.mode == 'trufflehog'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').light || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # The trufflehog CLI binary (not the trufflesecurity/trufflehog Docker
      # container action): the action mounts /var/run/docker.sock, which
      # neither the self-hosted `glue` container nor the hosted `ubuntu-slim`
      # image provides — no Docker daemon, so the action failed on every
      # scheduled run. The binary runs on any runner, so routing stays on
      # RUNNERS.light/ubuntu-slim (self-hosted for private, hosted for public).
      # The download resolves OS/arch itself, so the step is arch-agnostic.
      #
      # Download the pinned release asset directly rather than through upstream's
      # install.sh. The script first resolves the tag with an unauthenticated
      # `github.com/<repo>/releases/<tag>` JSON lookup, which every self-hosted
      # runner makes from the same home address; GitHub's per-IP limit answered it
      # with 403 for karakeep and SaneBar on 2026-10-12. The version is already
      # pinned, so the lookup adds nothing. Verification is unchanged: the tarball
      # is checked against the release's own checksums file, as the script did.
      - name: Install trufflehog
        env:
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
          TRUFFLEHOG_VERSION: v3.95.5
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          version="${TRUFFLEHOG_VERSION#v}"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/${TRUFFLEHOG_VERSION}"
          tarball="trufflehog_${version}_${os}_${arch}.tar.gz"
          checksums="trufflehog_${version}_checksums.txt"
          work=$(mktemp -d)
          curl -sSfL -o "$work/$tarball" "$base/$tarball"
          curl -sSfL -o "$work/$checksums" "$base/$checksums"
          (cd "$work" && grep " ${tarball}\$" "$checksums" | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$work/$tarball" -C "$RUNNER_TEMP/bin" trufflehog
          rm -rf "$work"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # `--results=verified`: fail only on findings trufflehog confirmed live, not
      # unverifiable format-matches. The `unknown` tier (and the `.trufflehogignore`
      # path-suppression opt-out that existed to silence its noise) were removed
      # because across these fork-heavy consumers that tier surfaced placeholder/example
      # creds, not real secrets; PR-time gitleaks still gates new format-matches.
      # `--fail` makes a finding exit non-zero rather than only print.
      - name: Run trufflehog
        run: trufflehog git file://. --results=verified --fail
