name: bump-homebrew-git (reusable)
# Bump a :git-strategy Homebrew formula in the tap to the tag that triggered the
# caller. These formulae build from source — `url "git@…", using: :git, tag:,
# revision:` — so there is no release tarball or sha256 to update. The workflow
# updates the tag and the commit it points at, plus an explicit Homebrew `version`
# line where one already exists (needed only when Homebrew cannot scan the version
# out of the tag, e.g. a PEP 440 `v0.4.4.post2`, so that `brew outdated` still
# detects post-release tag bumps). This replaces
# mislav/bump-homebrew-formula-action, which
# only rewrites url+sha256 tarball formulae and 404s on a private repo's archive.
#
# `on:` is quoted to satisfy yaml[truthy] (YAML 1.1 folds bare `on` into `On`).
"on":
  workflow_call:
    inputs:
      formula-name:
        description: Formula basename in the tap, i.e. Formula/<formula-name>.rb
        type: string
        required: true
      tap:
        description: owner/repo of the Homebrew tap to update
        type: string
        default: Rubio-Enterprises/homebrew-tap
    secrets:
      TAP_PUSH_APP_ID:
        description: >-
          rubio-tap-push App id (org secret; reaches this reusable via
          `secrets: inherit`). Preferred: mints a per-run token scoped to the
          tap, contents:write, expiring with the job.
        required: false
      TAP_PUSH_APP_PRIVATE_KEY:
        description: rubio-tap-push App private key (org secret)
        required: false
permissions:
  contents: read
jobs:
  bump:
    # NOT RUNNER_GLUE. The glue pool is a rootless, locked-down container with no
    # build toolchain and no ruby — it never had ruby — so the ruby heredoc below
    # fails there with `ruby: command not found`, exit 127.
    #
    # The regression was THIS workflow's own sed → ruby swap (54f84651,
    # 2026-06-26T02:45Z, "fix: scope homebrew formula revision bumps" #67), first
    # released in v1.5.0 — not a runner change. Do not re-derive it as one: omlx
    # bumped successfully ON glue 24 minutes earlier (run 28213030752, 02:21Z)
    # using v1.4.1, whose rewrite step was sed. v1.4.6 and earlier work on glue;
    # v1.5.0 and later do not, so the break reached each caller silently when
    # Renovate advanced its pin past v1.4.6 — gmaps-sync 2026-08-09, clipssh
    # 2026-08-14 (v1.4.0). Tap bumps only fire on release tags, and the failure
    # never surfaces on the release PR, which is why it stayed invisible for two
    # months. Reverting to sed is not the fix: #67 swapped it in to scope the
    # rewrite to the top-level :git stanza, which sed could not do safely.
    #
    # VM-class it is: both RUNNER_LINUX_ARM routes (the self-hosted linux-arm64
    # Tart VMs and the hosted ubuntu-24.04-arm fallback) have passwordless sudo,
    # which the ruby preflight below needs. Same reasoning as the kcov coverage
    # job in clipssh — the glue pool cannot host a job with toolchain needs.
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_ARM || '["ubuntu-24.04-arm"]') }}
    env:
      TAP_APP_CONFIGURED: ${{ secrets.TAP_PUSH_APP_ID != '' && secrets.TAP_PUSH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Require a push credential
        if: env.TAP_APP_CONFIGURED != 'true'
        run: |
          echo "::error::no tap push credential: pass the TAP_PUSH_APP_* org secrets via \`secrets: inherit\`" >&2
          exit 1
      - name: Derive tap repo name
        id: tap-repo
        env:
          TAP: ${{ inputs.tap }}
        run: echo "name=${TAP##*/}" >> "$GITHUB_OUTPUT"
      # Scoped per-run mint: token is contents:write on the tap repo ONLY and
      # expires with the job — replaces the long-lived tap-push PAT.
      - name: Mint tap-push App token
        id: tap-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAP_PUSH_APP_ID }}
          private-key: ${{ secrets.TAP_PUSH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.tap-repo.outputs.name }}
          permission-contents: write
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.tap }}
          token: ${{ steps.tap-app.outputs.token }}
      # The rewrite below is a ruby script. Ruby ships on GitHub's hosted images
      # but is NOT guaranteed on the self-hosted linux-arm64 Tart VM template
      # (an externally baked playwright image), so install it when absent instead
      # of assuming. No-op when already present.
      - name: Ensure ruby is available
        run: |
          set -euo pipefail
          if ! command -v ruby >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ruby
          fi
          ruby --version
      - name: Rewrite formula tag + revision
        env:
          FORMULA: ${{ inputs.formula-name }}
          TAP: ${{ inputs.tap }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+~_-]*$ ]] || { echo "::error::unexpected tag '${TAG}'"; exit 1; }
          f="Formula/${FORMULA}.rb"
          test -f "$f" || { echo "::error::${f} not found in ${TAP}"; exit 1; }
          grep -q 'using: :git' "$f" || { echo "::error::${f} is not a :git formula"; exit 1; }
          ruby - "$f" "$TAG" "$SHA" "${TAG#v}" <<'RUBY'
          formula_path, tag, sha, version = ARGV
          lines = File.readlines(formula_path)

          url_stanzas = []
          lines.each_with_index do |line, index|
            next unless line.match?(/^  url\s+/)

            finish = index
            while finish + 1 < lines.length && lines[finish].rstrip.end_with?(",")
              finish += 1
            end

            stanza = lines[index..finish].join
            url_stanzas << [index, finish, stanza] if stanza.include?("using: :git")
          end

          if url_stanzas.empty?
            warn "::error::#{formula_path} does not have a top-level :git url stanza"
            exit 1
          end

          if url_stanzas.length > 1
            warn "::error::#{formula_path} has multiple top-level :git url stanzas"
            exit 1
          end

          start_index, finish_index, stanza = url_stanzas.first

          tag_count = stanza.scan(/tag:\s*"[^"]*"/).length
          revision_count = stanza.scan(/revision:\s*"[0-9a-f]*"/).length
          unless tag_count == 1 && revision_count == 1
            warn "::error::expected one tag: and one revision: in #{formula_path}'s top-level :git url stanza"
            exit 1
          end

          stanza = stanza.sub(/tag:\s*"[^"]*"/, %(tag: "#{tag}"))
          stanza = stanza.sub(/revision:\s*"[0-9a-f]*"/, %(revision: "#{sha}"))
          lines[start_index..finish_index] = stanza.lines

          version_line_indexes = lines.each_index.select do |index|
            lines[index].match?(/^  version\s+"[^"]*"\s*$/)
          end

          # Update an existing version line; never insert one. `brew audit` fails
          # with "`version X` is redundant with version scanned from URL" whenever
          # Homebrew can derive the version from the tag itself, which is every
          # plain vX.Y.Z tag — so inserting a line broke the tap's own lint gate on
          # exactly the formulae that did not need it (caught on
          # homebrew-tap#135). A formula whose tag Homebrew cannot parse — omlx's
          # PEP 440 `v0.4.4.post2` is the live example — carries the line already,
          # and that one keeps being maintained here. Adding the first line for a
          # new unparseable-tag formula stays a human, one-time act.
          if version_line_indexes.length > 1
            warn "::error::#{formula_path} has multiple top-level version lines"
            exit 1
          elsif version_line_indexes.one?
            lines[version_line_indexes.first] = %(  version "#{version}"\n)
          end

          File.write(formula_path, lines.join)
          RUBY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$f"
          if git diff --cached --quiet; then
            echo "::notice::${FORMULA} already at ${TAG}; nothing to bump"
          else
            git commit -m "chore(${FORMULA}): bump to ${TAG}"
            git push
          fi
