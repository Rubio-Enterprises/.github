name: Copilot Setup Steps

# Public-repo override for this bootstrap repo (.github is the org community-health
# + reusable-workflow repo, not standards-onboarded). GitHub blocks self-hosted runners on public repos, so the org-default Copilot
# runner (labeled `code-quality`, self-hosted) would queue this repo's reviews ~24h
# and cancel them. Pin Copilot code review + coding agent to a GitHub-hosted Ubuntu
# x64 runner (free for public repos) by declaring the job's `runs-on`.
#
# `"on":` is quoted to satisfy `yaml[truthy]` (yamllint + ansible-lint): YAML 1.1
# folds bare `on` into the boolean `On`. GitHub Actions and actionlint accept both.
"on": workflow_dispatch

permissions:
  contents: read
  packages: read

# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest # Public bootstrap repository needs Docker
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out central Docker preparation action
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ github.sha }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: actions/prepare-hosted-docker
      - name: Prepare hosted Docker disk
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: ./.cache/central-test-gate/actions/prepare-hosted-docker # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
      - name: Remove central Docker preparation checkout
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: rm -rf .cache/central-test-gate
      - name: Install just
        uses: Rubio-Enterprises/.github/actions/setup-just@main

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dev image
        run: just build
