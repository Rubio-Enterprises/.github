name: e2e (reusable)
# The repository's bin/e2e.sh owns starting its server and writing reports/e2e/junit.xml
"on":
  workflow_call:
    inputs:
      retries: {type: number, default: 2}
      shard: {type: string, default: ''}
      timeout-minutes: {type: number, default: 30}
permissions:
  contents: read
  packages: read
jobs:
  route:
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
  e2e:
    needs: route
    permissions:
      contents: read
      checks: write
      packages: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install just
        if: needs.route.outputs.ci-image != 'true'
        uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Log in to GHCR
        if: needs.route.outputs.ci-image != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install repository dependencies
        env:
          CI_IMAGE: ${{ needs.route.outputs.ci-image }}
        run: |
          test -x bin/e2e.sh
          if [ "$CI_IMAGE" = true ]; then
            if [ -x bin/setup.sh ]; then bin/setup.sh; fi
          else
            just build
            just setup
          fi
      - name: Run E2E suite
        id: suite
        env:
          CI_IMAGE: ${{ needs.route.outputs.ci-image }}
          PW_RETRIES: ${{ inputs.retries }}
          PW_SHARD: ${{ inputs.shard }}
        run: |
          rm -rf reports/e2e
          mkdir -p reports/e2e
          if [ "$CI_IMAGE" = true ]; then bin/e2e.sh; else just e2e; fi
        timeout-minutes: ${{ inputs.timeout-minutes }}
      - name: Require executed E2E tests
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("reports/e2e/junit.xml")
          try:
              root = ET.parse(report).getroot()
          except (OSError, ET.ParseError) as error:
              sys.exit(f"::error::missing or invalid E2E JUnit report: {error}")
          if root.tag not in ("testsuites", "testsuite"):
              sys.exit(f"::error::unexpected E2E JUnit root: {root.tag}")
          tests = root.findall(".//testcase")
          runnable = [test for test in tests if test.find("skipped") is None]
          failed = [test for test in tests if test.find("failure") is not None or test.find("error") is not None]
          if not runnable:
              sys.exit("::error::E2E JUnit report contains zero executed tests")
          if failed:
              sys.exit(f"::error::E2E JUnit report contains {len(failed)} failed tests")
          if os.environ["SUITE_OUTCOME"] != "success":
              sys.exit(f"::error::E2E suite did not succeed: {os.environ['SUITE_OUTCOME']}")
          print(f"Verified {len(runnable)} executed E2E tests")
          PY
        shell: bash
      - if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          report_paths: 'reports/e2e/junit.xml'
          # GitHub keeps fork/Dependabot tokens read-only; preserve their
          # annotations and job summary without attempting a Checks API write.
          annotate_only: >-
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
                || github.actor == 'dependabot[bot]' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-reports-${{ github.run_id }}
          path: reports/e2e/
          retention-days: 14
          if-no-files-found: error
