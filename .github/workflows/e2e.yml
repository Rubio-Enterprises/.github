# Reusable e2e workflow. A caller provides either an apex scripts.e2e or a
# repo-owned mise e2e task (for nested/non-Node roots). Require a nonempty
# Playwright JUnit report at reports/e2e/junit.xml; the consumer config owns
# the reporter path. Optional scripts.e2e:setup installs the pinned browser.
#
# DEV-SERVER CONTRACT
# -------------------
# This workflow does NOT start a dev server before invoking `playwright test`.
# Consumers must EITHER:
#   (a) Wire `playwright.config.ts::webServer` to self-start the app under
#       test (Playwright runs the command and waits on the URL before the
#       first test runs). Single-process projects (Next.js dev, Vite dev, a
#       static-site preview) fit cleanly here.
#   (b) Skip this reusable entirely and call Playwright from the consumer's
#       own `ci.yml`, with explicit prior steps for multi-process boots
#       (e.g. `ng build` → `ng serve &` → `wait-on http://localhost:4200`
#       → `playwright test` for Angular + Electron + Playwright shapes).
# Option (b) is the expected path for any project where `config.webServer`
# would have to orchestrate more than one long-running process. Don't try to
# add `jobs.e2e.needs: <build-job>` to retrofit this reusable into multi-step
# starts — the dev-server step must run *in the same job* as `playwright
# test` because Playwright connects to localhost on the same runner.
#
# See also: rubio-standards README.md "Reusable e2e.yml contract" section.
name: e2e (reusable)
"on":
  workflow_call:
    inputs:
      retries: {type: number, default: 2}
      shard: {type: string, default: ''}
      timeout-minutes: {type: number, default: 30}
permissions:
  contents: read
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  e2e:
    # Publishing the JUnit Check needs this grant from the calling job too.
    permissions:
      contents: read
      checks: write
    # The e2e route targets the multi-GiB linux-arm64 Tart pool; measured
    # consumer installs and suites fit its slots. Public callers use hosted
    # Ubuntu when the private org route is unavailable.
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').e2e || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # uv on PATH routes mise's pipx-backend installs through uvx (pipx.uvx
      # defaults true), enforcing minimum_release_age via uv's --exclude-newer.
      # Without uv, mise >= 2026.6.2 falls back to pip's --uploaded-prior-to,
      # which cold runners' bootstrap pip (< 26) rejects — install hard-fails.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.17"
      # Fingerprint the uv-resolved python into the mise cache key (standards#331).
      # mise routes pipx installs through uvx, whose venvs carry a shebang pointing
      # at the uv-MANAGED python under ~/.local/share/uv/python — OUTSIDE the
      # ~/.local/share/mise tree jdx/mise-action caches. When uv's default python
      # bumps (e.g. 3.14.3 → 3.14.4), a cache restored onto a fresh runner VM hands
      # back pipx venvs whose shebang points at an interpreter that VM lacks, so
      # every tool dies with "couldn't exec process" — a permanently poisoned cache
      # no re-run fixes. Folding the version into cache_key_prefix makes a python
      # bump INVALIDATE the cache instead of poisoning it. `uv python find` never
      # downloads and can fall back to a system python, so install first
      # (idempotent — the same managed interpreter uvx would provision anyway),
      # then read the managed version.
      - name: Fingerprint the uv-resolved python for the mise cache key
        id: uv-python
        shell: bash
        run: |
          set -euo pipefail
          uv python install
          version="$(uv python find --managed-python --show-version)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve the uv-managed python version for the mise cache key" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "uv-resolved python for mise cache key: $version"
      - name: Resolve installed mise version
        id: mise-version
        env:
          # renovate: datasource=github-releases depName=jdx/mise
          MISE_VERSION: "2026.10.0"
        shell: bash
        run: |
          set -euo pipefail
          binary="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin/mise"
          version="$MISE_VERSION"
          if [ -e "$binary" ]; then
            [ -x "$binary" ] || { echo "::error::installed mise is not executable: $binary" >&2; exit 1; }
            reported="$("$binary" version --json)"
            version="$(jq -er '.version | strings | capture("^(?<number>[0-9]{4}[.][0-9]+[.][0-9]+)( |$)").number' <<<"$reported")"
          fi
          [[ "$version" =~ ^[0-9]{4}[.][0-9]+[.][0-9]+$ ]] || exit 1
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "mise action version: $version"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          # Key the mise cache to the uv-resolved python (standards#331): a python
          # bump changes the prefix and invalidates rather than poisons the cache.
          cache_key_prefix: mise-v1-uvpy${{ steps.uv-python.outputs.version }}
          version: ${{ steps.mise-version.outputs.version }}
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if mise tasks ls --json 2>/dev/null | jq -e '.[] | select(.name=="e2e")' >/dev/null; then
            echo "cmd=mise run e2e" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ] && jq -e '.scripts.e2e | strings | select(length > 0)' package.json >/dev/null; then
            echo "cmd=npm run e2e" >> "$GITHUB_OUTPUT"
          else
            echo "::error::reusable e2e requires an apex scripts.e2e or repo-owned mise e2e task" >&2
            exit 1
          fi
          if [ -f package.json ] && jq -e '.scripts["e2e:setup"] | strings | select(length > 0)' package.json >/dev/null; then
            echo "setup=script" >> "$GITHUB_OUTPUT"
          else
            echo "setup=mise" >> "$GITHUB_OUTPUT"
          fi
      # Stand up pnpm via the first-party `pnpm/action-setup` action rather
      # than `corepack pnpm install`. Corepack ≤ 0.29 (bundled with Node
      # 22.0–22.12) ships a stale pnpm signing-key trust store and crashes
      # with `Cannot find matching keyid` when it tries to fetch the latest
      # stable version. `pnpm/action-setup@v4` reads the consumer's
      # `packageManager` field in package.json and installs exactly that
      # version without going through corepack. The step is a no-op when
      # `pnpm-lock.yaml` is absent.
      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install JS deps (lockfile-aware)
        if: success()
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if   [ -f pnpm-lock.yaml ];      then pnpm install --frozen-lockfile
            elif [ -f yarn.lock ];           then corepack yarn install --frozen-lockfile
            elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
            elif [ -f package-lock.json ];   then npm ci
            else echo "::error::package.json without lockfile"; exit 1
            fi
          fi
        shell: bash
      - name: e2e-setup (package-pinned browser install, fixtures, etc.)
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.setup }}" = script ]; then
            npm run e2e:setup
          elif mise tasks ls --json 2>/dev/null | jq -e '.[] | select(.name=="e2e-setup")' >/dev/null; then
            mise run e2e-setup
          fi
        shell: bash
      - name: Run E2E suite
        id: suite
        env:
          PW_RETRIES: ${{ inputs.retries }}
          PW_SHARD: ${{ inputs.shard }}
        run: |
          mkdir -p reports/e2e
          ${{ steps.detect.outputs.cmd }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
      - name: Require executed E2E tests
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("reports/e2e/junit.xml")
          try:
              root = ET.parse(report).getroot()
          except (OSError, ET.ParseError) as error:
              sys.exit(f"::error::missing or invalid E2E JUnit report: {error}")
          if root.tag not in ("testsuites", "testsuite"):
              sys.exit(f"::error::unexpected E2E JUnit root: {root.tag}")
          tests = root.findall(".//testcase")
          runnable = [test for test in tests if test.find("skipped") is None]
          failed = [test for test in tests if test.find("failure") is not None or test.find("error") is not None]
          if not runnable:
              sys.exit("::error::E2E JUnit report contains zero executed tests")
          if failed:
              sys.exit(f"::error::E2E JUnit report contains {len(failed)} failed tests")
          if os.environ["SUITE_OUTCOME"] != "success":
              sys.exit(f"::error::E2E suite did not succeed: {os.environ['SUITE_OUTCOME']}")
          print(f"Verified {len(runnable)} executed E2E tests")
          PY
        shell: bash
      - if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          report_paths: 'reports/e2e/junit.xml'
          # GitHub keeps fork/Dependabot tokens read-only; preserve their
          # annotations and job summary without attempting a Checks API write.
          annotate_only: >-
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
                || github.actor == 'dependabot[bot]' }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-reports-${{ github.run_id }}
          path: reports/e2e/
          retention-days: 14
          if-no-files-found: error
