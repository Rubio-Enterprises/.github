name: test-gate
# Repository-local test gate for THIS repo's own contract tests under tests/
# (the ones that pin the hosted workflows' shape). It proves the suite actually
# EXECUTED (non-zero test count), not merely that a command exited 0. It is not
# a reusable: repositories run their own starter test-gate.yml.
# workflow-validation.yml keeps actionlint
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  canonical-tests:
    name: canonical tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.5"

      - name: Install pytest
        # The suite is stdlib-only unittest, so an isolated uv tool install is
        # the whole dependency set. Pinning the bin dir under RUNNER_TEMP keeps
        # the PATH edit explicit instead of depending on ~/.local/bin.
        run: |
          set -euo pipefail
          uv python install
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/bin" uv tool install pytest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - id: test
        name: Run canonical non-E2E tests
        env:
          RUBIO_TEST_GATE_COUNT_OUTPUT: ${{ runner.temp }}/test-gate-count
        run: |
          set -euo pipefail
          rm -f "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          pytest tests/ --junitxml="$RUNNER_TEMP/junit.xml"
          awk '/<testsuite /{match($0,/tests="[0-9]+"/);n+=substr($0,RSTART+7,RLENGTH-8)}END{print n+0}' "$RUNNER_TEMP/junit.xml" > "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test -s "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test "$(cat "$RUBIO_TEST_GATE_COUNT_OUTPUT")" -gt 0
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"

  source-permissions-arm:
    name: native ARM source permissions
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').arm || fromJSON('["ubuntu-24.04-arm"]') }}
    timeout-minutes: 15
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - id: test
        name: Exercise named-user nested source writes
        working-directory: tests
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = aarch64
          python3 -m unittest -v test_image_v2.ImageV2.test_native_source_directories_are_writable_for_vscode
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"

  aggregate:
    name: test-gate
    if: ${{ always() }}
    needs: [canonical-tests, source-permissions-arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require successful non-empty test execution
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success" and
          .outputs.tests_ran == "true")' <<<"$NEEDS_JSON"
