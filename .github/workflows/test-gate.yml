name: test-gate
# Repository-local test gate for THIS repo's own contract tests under tests/
# (the ones that pin the hosted workflows' shape). It proves the suite actually
# EXECUTED (non-zero test count), not merely that a command exited 0. It is not
# a reusable: repositories run their own starter test-gate.yml.
# workflow-validation.yml keeps actionlint
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
  canonical-tests:
    name: canonical tests
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').docker || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 120
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false
      - uses: $/actions/setup-just # self-repository reference: the action lands with the same commit
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: just build && just setup
      - id: test
        name: Run canonical non-E2E tests
        env:
          RUBIO_TEST_GATE_COUNT_OUTPUT: ${{ runner.temp }}/test-gate-count
        run: |
          set -euo pipefail
          rm -f "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          just test
          awk '/<testsuite /{match($0,/tests="[0-9]+"/);n+=substr($0,RSTART+7,RLENGTH-8)}END{print n+0}' reports/test/junit.xml > "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test -s "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test "$(cat "$RUBIO_TEST_GATE_COUNT_OUTPUT")" -gt 0
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"

  aggregate:
    name: test-gate
    if: ${{ always() }}
    needs: [canonical-tests]
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 120
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require successful non-empty test execution
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success" and
          .outputs.tests_ran == "true")' <<<"$NEEDS_JSON"
