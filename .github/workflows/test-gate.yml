name: test-gate
# Repository-local test gate (standards ADR 0020) for THIS repo's own contract
# tests under tests/ — the ones that pin the gate workflows' shape. It proves
# the suite actually EXECUTED (non-zero test count), not merely that a command
# exited 0.
#
# Scope note: the gate workflows this repo *hosts* (audit.yml, lint-format.yml,
# …) are what other repos run; they are not touched here.
# workflow-validation.yml no longer runs this suite (its unittest step was
# retired in favor of this gate); it keeps actionlint and the retired-rollback
# guard.
#
# Runner: `ubuntu-24.04`, matching this repo's OWN CI (workflow-validation.yml,
# plumbing-ref-publish.yml). The `vars.RUNNER_GLUE` route belongs to the gate
# workflows, which execute in consumer repos, not here.
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  canonical-tests:
    name: canonical tests
    runs-on: ubuntu-24.04
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.7"

      - name: Install pytest
        # The suite is stdlib-only unittest, so an isolated uv tool install is
        # the whole dependency set. Pinning the bin dir under RUNNER_TEMP keeps
        # the PATH edit explicit instead of depending on ~/.local/bin.
        run: |
          set -euo pipefail
          uv python install
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/bin" uv tool install pytest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - id: test
        name: Run canonical non-E2E tests
        env:
          RUBIO_TEST_GATE_COUNT_OUTPUT: ${{ runner.temp }}/test-gate-count
        run: |
          set -euo pipefail
          rm -f "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          pytest tests/ --junitxml="$RUNNER_TEMP/junit.xml"
          awk '/<testsuite /{match($0,/tests="[0-9]+"/);n+=substr($0,RSTART+7,RLENGTH-8)}END{print n+0}' "$RUNNER_TEMP/junit.xml" > "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test -s "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test "$(cat "$RUBIO_TEST_GATE_COUNT_OUTPUT")" -gt 0
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"

  aggregate:
    name: test-gate
    if: ${{ always() }}
    needs: [canonical-tests]
    runs-on: ubuntu-24.04
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require successful non-empty test execution
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success" and
          .outputs.tests_ran == "true")' <<<"$NEEDS_JSON"
