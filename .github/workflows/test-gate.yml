name: Test Gate

"on":
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      qualification-repository:
        description: "Release Check only: representative basename in Rubio-Enterprises"
        type: string
        default: ''
      qualification-ref:
        type: string
        default: ''
      qualification-runner:
        description: "Release Check only: explicit runs-on JSON for the representative kind"
        type: string
        default: ''
      qualification-platform:
        description: "Release Check only: linux or macos; empty infers from qualification-runner"
        type: string
        default: ''
      qualification-macos-concerns:
        description: "Release Check only: declared concerns; empty preserves macOS shape mode"
        type: string
        default: ''
      qualification-ci-image:
        type: boolean
        default: false
      qualification-central-ref:
        description: "Candidate central source ref for the qualification's local actions"
        type: string
        default: main
      candidate-base-artifact:
        description: "Optional Release Check artifact containing base-candidate.tar.gz and source.tar.gz"
        type: string
        default: ''
    secrets:
      STANDARDS_READER_APP_ID:
        required: false
      STANDARDS_READER_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: test-gate-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.qualification-repository }}-${{ inputs.qualification-runner }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.repository != 'Rubio-Enterprises/.github' && inputs.qualification-repository == '' && github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  route:
    if: github.repository != 'Rubio-Enterprises/.github' && inputs.qualification-repository == ''
    permissions:
      contents: read
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
    with:
      route: test
      inspect-image-inputs: true

  qualification:
    if: github.repository != 'Rubio-Enterprises/.github' && inputs.qualification-repository != ''
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    permissions: {}
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.select.outputs.platform }}
    steps:
      - id: select
        name: Select qualification platform
        env:
          QUALIFICATION_PLATFORM: ${{ inputs.qualification-platform }}
          QUALIFICATION_RUNNER: ${{ inputs.qualification-runner }}
          MACOS_CONCERNS: ${{ inputs.qualification-macos-concerns }}
        run: |
          test "$GITHUB_REPOSITORY" = Rubio-Enterprises/standards
          platform="$QUALIFICATION_PLATFORM"
          if [ -z "$platform" ]; then
            case "$QUALIFICATION_RUNNER" in *macos*) platform=macos ;; *) platform=linux ;; esac
          fi
          case "$platform" in linux|macos) ;; *) echo '::error::invalid qualification platform'; exit 1 ;; esac
          if [ -n "$MACOS_CONCERNS" ]; then
            test "$platform" = macos
            for concern in $MACOS_CONCERNS; do
              case "$concern" in test|typecheck|e2e|package) ;; *) echo '::error::invalid macOS concern'; exit 1 ;; esac
            done
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

  test-gate-linux:
    name: test-gate-linux
    needs: [route, qualification]
    if: ${{ always() && github.repository != 'Rubio-Enterprises/.github' && (inputs.qualification-repository != '' && needs.qualification.outputs.platform != 'macos' || inputs.qualification-repository == '' && needs.route.outputs.platform != 'macos') }}
    runs-on: >-
      ${{ inputs.qualification-repository != '' && fromJSON(inputs.qualification-runner)
          || needs.route.result == 'success' && fromJSON(needs.route.outputs.runner)
          || fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 120
    env:
      CI_IMAGE: ${{ inputs.qualification-repository != '' && inputs.qualification-ci-image || needs.route.outputs.ci-image == 'true' }}
    steps:
      - name: Require successful project routing or an authorized Release Check
        env:
          QUALIFICATION_REPOSITORY: ${{ inputs.qualification-repository }}
          ROUTE_RESULT: ${{ needs.route.result }}
        run: |
          if [ -n "$QUALIFICATION_REPOSITORY" ]; then
            test "$GITHUB_REPOSITORY" = Rubio-Enterprises/standards
            [[ "$QUALIFICATION_REPOSITORY" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          elif [ "$ROUTE_RESULT" != success ]; then
            echo '::error::project runner routing did not succeed'
            exit 1
          fi
      - id: reader
        if: inputs.qualification-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.STANDARDS_READER_APP_ID }}
          private-key: ${{ secrets.STANDARDS_READER_APP_PRIVATE_KEY }}
          owner: Rubio-Enterprises
          repositories: ${{ inputs.qualification-repository }}
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.qualification-repository != '' && format('Rubio-Enterprises/{0}', inputs.qualification-repository) || github.repository }}
          ref: ${{ inputs.qualification-ref }}
          token: ${{ steps.reader.outputs.token || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out central Test Gate policy reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ inputs.qualification-central-ref || 'main' }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/test-gate-policy.py
            actions/lifecycle
            actions/macos-tools
            actions/release-asset
          sparse-checkout-cone-mode: false
      - name: Stage Lifecycle dispatcher
        uses: ./.cache/central-test-gate/actions/lifecycle # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
      - name: Stage Test Gate policy reader
        run: |
          cp .cache/central-test-gate/scripts/test-gate-policy.py "$RUNNER_TEMP/test-gate-policy.py"
          rm -rf .cache/central-test-gate
      - name: Check Test Gate policy
        id: policy
        shell: bash
        run: |
          if [ "${CI_IMAGE:-false}" = true ]; then
            export MISE_OVERRIDE_CONFIG_FILENAMES=/opt/standards/mise/standards.toml
          fi
          python3 "$RUNNER_TEMP/test-gate-policy.py"
      - name: Check out central Docker preparation action
        if: steps.policy.outputs.opted-out != 'true' && env.CI_IMAGE != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ inputs.qualification-repository != '' && inputs.qualification-central-ref || 'main' }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: actions/prepare-hosted-docker
      - name: Prepare hosted Docker disk
        if: steps.policy.outputs.opted-out != 'true' && env.CI_IMAGE != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: ./.cache/central-test-gate/actions/prepare-hosted-docker # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
      - name: Remove central Docker preparation checkout
        if: steps.policy.outputs.opted-out != 'true' && env.CI_IMAGE != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: rm -rf .cache/central-test-gate
      - name: Install just
        if: steps.policy.outputs.opted-out != 'true' && env.CI_IMAGE != 'true'
        uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Log in to GHCR for dev image builds
        if: steps.policy.outputs.opted-out != 'true' && env.CI_IMAGE != 'true' && runner.os == 'Linux'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare container-writable hosted checkout
        if: steps.policy.outputs.opted-out != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
      - name: Download candidate base and source for qualification
        if: steps.policy.outputs.opted-out != 'true' && inputs.qualification-repository != '' && inputs.candidate-base-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate-base-artifact }}
          path: ${{ runner.temp }}/gate-candidate
      - name: Select candidate base or native config
        if: steps.policy.outputs.opted-out != 'true' && inputs.qualification-repository != '' && inputs.candidate-base-artifact != ''
        run: |
          test "$CI_IMAGE" != true
          test "$(uname -m)" = x86_64
          docker load < "$RUNNER_TEMP/gate-candidate/base-candidate.tar.gz"
          perl -pi -e 's{^FROM ghcr.io/rubio-enterprises/base:\S+ AS dev.*}
            {FROM ghcr.io/rubio-enterprises/base:candidate AS dev}' Dockerfile
          # just build --pull must not replace the unpublished candidate
          perl -pi -e 's/docker compose build --pull dev/docker compose build dev/' justfile
      - name: Set up dependencies
        if: steps.policy.outputs.opted-out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          test ! -e .cache/central-test-gate
          test ! -L .cache/central-test-gate
          echo 'Central checkout absent before repository setup: .cache/central-test-gate'
          mode=compose
          if [ "$CI_IMAGE" = true ]; then mode=image; fi
          bash "$RUNNER_TEMP/lifecycle/run.sh" "$mode" setup
      - name: Report hosted Docker disk use
        if: ${{ always() && steps.policy.outputs.opted-out == 'false' && env.CI_IMAGE != 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          df -B1 /
          docker system df
      - name: Run Lifecycle Scripts
        id: lifecycle
        if: steps.policy.outputs.opted-out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          selected="$(
            if [ "${CI_IMAGE:-false}" = true ]; then
              export MISE_OVERRIDE_CONFIG_FILENAMES=/opt/standards/mise/standards.toml
            fi
            python3 "$RUNNER_TEMP/test-gate-policy.py" --select linux
          )"
          for step in $selected; do
            script="bin/$step.sh"
            test -f "$script" && test -x "$script"
            case "$step" in test|e2e) rm -rf "reports/$step" ;; esac
            if [ "$step" = package ]; then echo 'package=true' >> "$GITHUB_OUTPUT"; fi
            echo "::group::$script"
            mode=compose
            if [ "$CI_IMAGE" = true ]; then mode=image; fi
            bash "$RUNNER_TEMP/lifecycle/run.sh" "$mode" "$step"
            echo '::endgroup::'
          done
      # Local actions let Release Check qualify a candidate absent from main
      - name: Check out central JUnit action
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ inputs.qualification-repository != '' && inputs.qualification-central-ref || 'main' }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: |
            actions/junit-gate
            actions/gate-artifacts
      - name: Upload Lifecycle artifacts
        id: artifacts
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.cache/central-test-gate/actions/gate-artifacts # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
        with:
          name: ${{ github.job }}-${{ steps.lifecycle.outputs.artifact-concerns || 'none' }}
          representative: ${{ inputs.qualification-repository }}
          package: ${{ steps.lifecycle.outputs.package }}
      - name: Report a failed artifact upload
        if: ${{ !cancelled() && steps.artifacts.outcome == 'failure' }}
        run: echo "::warning::Test Gate artifact preparation or upload failed or exceeded 10 minutes for ${GATE_ARTIFACT_SIZES:-reports/ and dist/ (size unavailable before inventory completed)}; the gate result is not affected"
      - name: Clean up Lifecycle artifacts
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/gate-artifacts"
      - name: Require JUnit evidence
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        uses: ./.cache/central-test-gate/actions/junit-gate # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
        with:
          concerns: ${{ steps.lifecycle.outputs.concerns }}
          suite-outcome: ${{ steps.lifecycle.outcome }}
      - name: Clean up dependency volumes and services
        if: ${{ always() && steps.policy.outputs.opted-out == 'false' && env.CI_IMAGE != 'true' && runner.os == 'Linux' }}
        run: |
          export REPO_DIR="$GITHUB_WORKSPACE"
          GIT_COMMON_DIR=$(git rev-parse --path-format=absolute --git-common-dir)
          export GIT_COMMON_DIR
          docker compose down --volumes --remove-orphans

  test-gate-macos:
    name: test-gate-macos
    needs: [route, qualification]
    if: ${{ always() && github.repository != 'Rubio-Enterprises/.github' && (inputs.qualification-repository != '' && needs.qualification.result == 'success' && needs.qualification.outputs.platform == 'macos' || inputs.qualification-repository == '' && needs.route.result == 'success' && (needs.route.outputs.platform == 'macos' || needs.route.outputs.macos-concerns != '')) }}
    runs-on: ${{ inputs.qualification-repository != '' && fromJSON(inputs.qualification-runner) || fromJSON(needs.route.outputs.macos-runner) }}
    timeout-minutes: 60
    env:
      MACOS_CONCERNS: ${{ inputs.qualification-repository != '' && inputs.qualification-macos-concerns || needs.route.outputs.macos-concerns }}
    steps:
      - name: Require successful project routing or an authorized Release Check
        env:
          QUALIFICATION_REPOSITORY: ${{ inputs.qualification-repository }}
          ROUTE_RESULT: ${{ needs.route.result }}
        run: |
          if [ -n "$QUALIFICATION_REPOSITORY" ]; then
            test "$GITHUB_REPOSITORY" = Rubio-Enterprises/standards
            [[ "$QUALIFICATION_REPOSITORY" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          elif [ "$ROUTE_RESULT" != success ]; then
            echo '::error::project runner routing did not succeed'
            exit 1
          fi
      - id: reader
        if: inputs.qualification-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.STANDARDS_READER_APP_ID }}
          private-key: ${{ secrets.STANDARDS_READER_APP_PRIVATE_KEY }}
          owner: Rubio-Enterprises
          repositories: ${{ inputs.qualification-repository }}
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.qualification-repository != '' && format('Rubio-Enterprises/{0}', inputs.qualification-repository) || github.repository }}
          ref: ${{ inputs.qualification-ref }}
          token: ${{ steps.reader.outputs.token || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out central Test Gate policy reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ inputs.qualification-central-ref || 'main' }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/test-gate-policy.py
            actions/lifecycle
            actions/macos-tools
            actions/release-asset
          sparse-checkout-cone-mode: false
      - name: Stage Lifecycle dispatcher
        uses: ./.cache/central-test-gate/actions/lifecycle # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
      - name: Stage Test Gate policy reader
        run: |
          cp .cache/central-test-gate/scripts/test-gate-policy.py "$RUNNER_TEMP/test-gate-policy.py"
          rm -rf .cache/central-test-gate
      - name: Set up policy Python
        id: policy-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          update-environment: false
      - name: Check Test Gate policy
        id: policy
        shell: bash
        env:
          POLICY_PYTHON: ${{ steps.policy-python.outputs.python-path }}
        run: |
          "$POLICY_PYTHON" "$RUNNER_TEMP/test-gate-policy.py"
      - name: Download candidate base and source for qualification
        if: steps.policy.outputs.opted-out != 'true' && inputs.qualification-repository != '' && inputs.candidate-base-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate-base-artifact }}
          path: ${{ runner.temp }}/gate-candidate
      - name: Select candidate base or native config
        if: steps.policy.outputs.opted-out != 'true' && inputs.qualification-repository != '' && inputs.candidate-base-artifact != ''
        run: |
          mkdir -p "$RUNNER_TEMP/gate-source"
          tar -xzf "$RUNNER_TEMP/gate-candidate/source.tar.gz" -C "$RUNNER_TEMP/gate-source"
          echo "STANDARDS_NATIVE_CONFIG=$RUNNER_TEMP/gate-source/config" >> "$GITHUB_ENV"
      - name: Install just
        if: steps.policy.outputs.opted-out != 'true'
        uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Check out central macOS tools action
        if: steps.policy.outputs.opted-out != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ inputs.qualification-repository != '' && inputs.qualification-central-ref || 'main' }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: |
            actions/macos-tools
            actions/release-asset
            actions/junit-gate
      - name: Restore macOS tool downloads
        id: macos-downloads
        if: steps.policy.outputs.opted-out != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/macos-tools/cache/downloads-cas
          key: macos-tools-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('image/mise.lock') }}
      - name: Install mise if missing on macOS
        if: steps.policy.outputs.opted-out != 'true'
        uses: ./.cache/central-test-gate/actions/macos-tools # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
        with:
          provision: ${{ env.MACOS_CONCERNS != '' && 'true' || 'false' }}
          standards-source: ${{ inputs.candidate-base-artifact != '' && format('{0}/gate-source', runner.temp) || '' }}
      - name: Remove central macOS tools checkout
        if: steps.policy.outputs.opted-out != 'true'
        run: |
          cp .cache/central-test-gate/actions/macos-tools/run-recipe.sh "$RUNNER_TEMP/macos-recipe.sh"
          rm -rf .cache/central-test-gate
      - name: Set up dependencies
        if: steps.policy.outputs.opted-out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          test ! -e .cache/central-test-gate
          test ! -L .cache/central-test-gate
          echo 'Central checkout absent before repository setup: .cache/central-test-gate'
          mode=macos
          if [ -n "$MACOS_CONCERNS" ]; then mode=image; fi
          bash "$RUNNER_TEMP/lifecycle/run.sh" "$mode" setup
      - name: Save macOS tool downloads
        if: steps.policy.outputs.opted-out != 'true' && steps.macos-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/macos-tools/cache/downloads-cas
          key: ${{ steps.macos-downloads.outputs.cache-primary-key }}
      - name: Run Lifecycle Scripts
        id: lifecycle
        if: steps.policy.outputs.opted-out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          POLICY_PYTHON: ${{ steps.policy-python.outputs.python-path }}
        run: |
          selected="$(
            "$POLICY_PYTHON" "$RUNNER_TEMP/test-gate-policy.py" --select macos
          )"
          for step in $selected; do
            script="bin/$step.sh"
            if [ ! -f "$script" ] || [ ! -x "$script" ]; then
              echo "::error::macOS concern $step requires executable $script"
              exit 1
            fi
            case "$step" in test|e2e) rm -rf "reports/$step" ;; esac
            if [ "$step" = package ]; then echo 'package=true' >> "$GITHUB_OUTPUT"; fi
            echo "::group::$script"
            mode=macos
            if [ -n "$MACOS_CONCERNS" ]; then mode=image; fi
            bash "$RUNNER_TEMP/lifecycle/run.sh" "$mode" "$step"
            echo '::endgroup::'
          done
      # Local actions let Release Check qualify a candidate absent from main
      - name: Check out central JUnit action
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ inputs.qualification-repository != '' && inputs.qualification-central-ref || 'main' }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: |
            actions/junit-gate
            actions/gate-artifacts
      - name: Upload Lifecycle artifacts
        id: artifacts
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.cache/central-test-gate/actions/gate-artifacts # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
        with:
          name: ${{ github.job }}-${{ steps.lifecycle.outputs.artifact-concerns || 'none' }}
          representative: ${{ inputs.qualification-repository }}
          package: ${{ steps.lifecycle.outputs.package }}
      - name: Report a failed artifact upload
        if: ${{ !cancelled() && steps.artifacts.outcome == 'failure' }}
        run: echo "::warning::Test Gate artifact preparation or upload failed or exceeded 10 minutes for ${GATE_ARTIFACT_SIZES:-reports/ and dist/ (size unavailable before inventory completed)}; the gate result is not affected"
      - name: Clean up Lifecycle artifacts
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/gate-artifacts"
      - name: Require JUnit evidence
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        uses: ./.cache/central-test-gate/actions/junit-gate # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
        with:
          concerns: ${{ steps.lifecycle.outputs.concerns }}
          suite-outcome: ${{ steps.lifecycle.outcome }}

  test-gate:
    name: test-gate
    needs: [route, qualification, test-gate-linux, test-gate-macos]
    if: ${{ always() && github.repository != 'Rubio-Enterprises/.github' }}
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require all applicable Test Gate legs to succeed
        env:
          QUALIFICATION: ${{ inputs.qualification-repository != '' }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          QUALIFICATION_PLATFORM: ${{ needs.qualification.outputs.platform }}
          ROUTE_RESULT: ${{ needs.route.result }}
          PLATFORM: ${{ needs.route.outputs.platform }}
          MACOS_CONCERNS: ${{ needs.route.outputs.macos-concerns }}
          LINUX_RESULT: ${{ needs.test-gate-linux.result }}
          MACOS_RESULT: ${{ needs.test-gate-macos.result }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          want_linux=false; want_macos=false
          if [ "$QUALIFICATION" = true ]; then
            [ "$QUALIFICATION_RESULT" = success ] || fail "qualification selection did not succeed ($QUALIFICATION_RESULT)"
            if [ "$QUALIFICATION_PLATFORM" = macos ]; then want_macos=true; else want_linux=true; fi
          else
            [ "$ROUTE_RESULT" = success ] || fail "project runner routing did not succeed ($ROUTE_RESULT)"
            if [ "$PLATFORM" = macos ]; then want_macos=true; else want_linux=true; fi
            if [ -n "$MACOS_CONCERNS" ]; then want_macos=true; fi
          fi
          leg() {
            if [ "$2" = true ]; then [ "$3" = success ] || fail "$1 leg is expected and its result is $3"
            else [ "$3" = skipped ] || fail "$1 leg is not expected and its result is $3"; fi
          }
          leg linux "$want_linux" "$LINUX_RESULT"
          leg macos "$want_macos" "$MACOS_RESULT"
