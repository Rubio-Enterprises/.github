name: lint-hooks
# CI gate that runs the consumer's lefthook commands. Normal repos check all
# files; forks check the PR's changed files so inherited upstream debt stays
# outside the PR. Both paths fail when a hook fails or rewrites a tracked file.
# Write-mode formatters (prettier, shfmt, gofmt, rustfmt, ruff format, biome)
# exit 0 after rewriting, so the tracked-file check is part of the gate.
#
# Runner routing: a cheap `detect` job reads the consumer's `.copier-answers.yml`
# and picks the tier. CAPABILITY outranks resource: `has_swift` /
# `has_homebrew_formulae` stay on macOS even in a mixed-language repo because
# sourcekitd and Homebrew are platform requirements. Other `has_ruby` repos use
# the dedicated hosted Linux route because glue cannot provide the
# `.ruby-version` selected runtime or its native-extension build toolchain.
#
# `has_swift` / `has_homebrew_formulae` go to macOS because swiftformat/
# swiftlint need sourcekitd and `brew style` needs Homebrew, none of which the
# Linux glue runner has — there they die with `swiftformat_linux: not found` /
# `Loading libsourcekitdInProc.so failed`. Run these lint passes through
# RUNNERS.macos to avoid hosted macOS cost; macos-26 is only the fallback
# for public consumers and a missing route key.
#
# Everything else takes the Linux route, whose tier is the consumer's DECLARED
# `lint_hooks_workload_class` (standards ADR-0030): `medium` for memory-heavy
# work, `small` by default. Legacy answers remain valid during rollout.
# A capability-routed repo's declared class is ignored: a resource tier cannot
# satisfy a runtime or platform requirement it does not provide.
#
# Config model (standards ADR-0033): a repository answering
# `config_model: native` inherits its lint configs, hooks and lint-tool pins
# from a gitignored Shared Config Checkout at `.standards-config/`. Its setup
# is the shared `standards-bootstrap` action: `mise bootstrap --only
# repos,tools` clones that checkout through the standards-reader route and
# installs the pinned tools, and a missing checkout fails the job.
#
# Delivery: the `gate-lint-hooks` org ruleset injects this file as a Required
# Governance Workflow (published at `gates/wf-v1`) into every repository whose
# `gate-lint-hooks` property is true, on `pull_request` and `merge_group`. A
# repository cannot edit or skip it (standards#627). It is no longer callable
# via `workflow_call`; any remaining rendered caller pins an older SHA and
# drops on its next re-render (standards#642). On PRs against `.github` itself
# the pull_request path is a no-op — enforced by the job-level `if:` guards
# below, since the `.github` repo doesn't ship a `.mise.toml` or `lefthook.yml`
# and would fail the `mise exec -- lefthook` invocation otherwise.
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  detect:
    # Resolve the runner from the consumer's answers: has_ruby needs hosted
    # x64 Linux; Swift/Homebrew needs RUNNERS.macos. Everything
    # else takes the Linux tier its declared lint_hooks_workload_class names.
    # Reading .copier-answers.yml tracks the authoritative declaration.
    if: >-
      github.event_name != 'pull_request' ||
      github.repository != 'Rubio-Enterprises/.github'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON(vars.RUNNERS || '{}').light || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 120
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      is_fork: ${{ steps.pick.outputs.is_fork }}
      has_ruby: ${{ steps.pick.outputs.has_ruby }}
      has_knowledgebase: ${{ steps.pick.outputs.has_knowledgebase }}
      config_model: ${{ steps.pick.outputs.config_model }}
    steps:
      - name: Sparse-checkout the consumer's .copier-answers.yml
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .copier-answers.yml
          sparse-checkout-cone-mode: false
      - name: Pick runner from the language facets
        id: pick
        env:
          RUBY_RUNNER: '["ubuntu-24.04"]'
          MACOS_RUNNER: ${{ toJSON(fromJSON(vars.RUNNERS || '{}').macos || fromJSON('["macos-26"]')) }}
          LIGHT_RUNNER: ${{ toJSON(fromJSON(vars.RUNNERS || '{}').small || fromJSON(vars.RUNNERS || '{}').light || fromJSON('["ubuntu-slim"]')) }}
          # Heavy work must not degrade to the undersized light route.
          # Public consumers cannot read private org variables; hosted
          # ubuntu-latest provides the required memory when RUNNERS is absent.
          HEAVY_RUNNER: ${{ toJSON(fromJSON(vars.RUNNERS || '{}').medium || fromJSON(vars.RUNNERS || '{}').heavy || fromJSON('["ubuntu-latest"]')) }}
        shell: bash
        run: |
          # Only an explicit true enables the facet, so transitional answers
          # files with no has_ruby key retain their existing route. Emit this
          # independently from runner selection: a Ruby+Swift repo needs Ruby
          # setup on the macOS capability route, not a Linux route that cannot
          # run the Swift hooks.
          has_ruby=false
          if grep -qE '^has_ruby:[[:space:]]*true[[:space:]]*$' .copier-answers.yml 2>/dev/null; then
            has_ruby=true
          fi
          printf 'has_ruby=%s\n' "$has_ruby" >> "$GITHUB_OUTPUT"

          has_knowledgebase=false
          if grep -qE '^has_knowledgebase:[[:space:]]*true[[:space:]]*$' .copier-answers.yml 2>/dev/null; then
            has_knowledgebase=true
          fi
          printf 'has_knowledgebase=%s\n' "$has_knowledgebase" >> "$GITHUB_OUTPUT"

          # Copier removes the transition answer in Phase 4; absence stays native.
          config_model="$(awk '/^config_model:/ { sub(/^config_model:[[:space:]]*/, ""); gsub(/["\047[:space:]]/, ""); print; exit }' .copier-answers.yml 2>/dev/null || true)"
          case "${config_model:=native}" in
            native) ;;
            *) echo "::error::unsupported config_model answer: $config_model" >&2; exit 1 ;;
          esac
          printf 'config_model=%s\n' "$config_model" >> "$GITHUB_OUTPUT"

          # has_swift routes to the macOS runner (swiftlint needs sourcekitd),
          # as does has_homebrew_formulae (`brew style` needs Homebrew).
          # The archetype grep is the fallback
          # for answers files that predate the facet questions; re-rendered
          # repos no longer carry archetype. This platform requirement outranks
          # Ruby's Linux route in a mixed-language repository.
          if grep -qE '^has_swift:[[:space:]]*true' .copier-answers.yml 2>/dev/null ||
            grep -qE '^has_homebrew_formulae:[[:space:]]*true' .copier-answers.yml 2>/dev/null ||
            grep -qE '^archetype:[[:space:]]*swift' .copier-answers.yml 2>/dev/null; then
            runner="$MACOS_RUNNER"
          elif [ "$has_ruby" = true ]; then
            runner="$RUBY_RUNNER"
          # A repo that DECLARES the glue-heavy Workload Class goes to the
          # memory-bounded pool (`lint_hooks_workload_class`, standards
          # ADR-0022). This job's dependency install is the onboarded set's single
          # biggest OOM site: of 37 kodus-ai standards.yml runs on 2026-07-29,
          # 21 failed and EVERY one failed in lint-hooks — 16 of them in that
          # install (exit 137 kills and registry timeouts, roughly evenly
          # split). Zero were lint errors. glue is sized around a measured p90
          # of 0.74 GB per container; an install on a 9-importer workspace peaks
          # near 2 GB, so it does not belong in the same 24-slot pool as
          # seconds-long glue work.
          #
          # DECLARED, not derived from has_typescript. glue-heavy is only 3
          # slots, and has_typescript is a proxy for language rather than
          # memory — true for static-webpage-template and kodus-ai alike — so
          # keying on it put 15 repos onto those 3 slots, where a repo that does
          # not need the tier takes a slot from one that does.
          #
          # Still an answer rather than a pnpm-lock.yaml sniff: `detect`
          # sparse-checks out ONLY .copier-answers.yml, so the lockfile is not
          # on disk here, and widening the sparse-checkout would cost every
          # consumer a second fetch — to get a worse predictor of peak RSS than
          # a measured declaration.
          #
          # Anchored, quote-tolerant, case-insensitive: only a declared
          # medium/heavy/glue-heavy answers select the larger route. Absent
          # answers use small/light. Capability routes above take precedence.
          elif grep -qiE \
            "^lint_hooks_workload_class:[[:space:]]*[\"']?(medium|heavy|glue-heavy)[\"']?[[:space:]]*\$" \
            .copier-answers.yml 2>/dev/null; then
            runner="$HEAVY_RUNNER"
          else
            runner="$LIGHT_RUNNER"
          fi
          # GitHub's toJSON emits indented multiline JSON; job outputs require
          # one line. Reject invalid JSON rather than writing a broken output.
          runner="$(jq -ce . <<<"$runner")" || exit 1
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
          # Fork mode keys on repo_type (ADR-0013); the boolean `is_fork`
          # answer was retired in template v1.55.24, which silently flipped
          # forks to all-files mode while this grep still keyed on it. The
          # legacy grep stays as a fallback for consumers on a pre-retirement
          # render — identical behavior, removable once all onboarded consumers are
          # >= v1.55.24.
          if grep -qE '^repo_type:[[:space:]]*(extended_fork|pristine_fork)' .copier-answers.yml 2>/dev/null ||
            grep -qE '^is_fork:[[:space:]]*true' .copier-answers.yml 2>/dev/null; then
            printf 'is_fork=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'is_fork=false\n' >> "$GITHUB_OUTPUT"
          fi
  lint-hooks:
    needs: detect
    # Skip when running as the `pull_request` no-op on the `.github` repo
    # itself. Injected runs in consumer repositories (pull_request /
    # merge_group) pass this guard.
    if: >-
      github.event_name != 'pull_request' ||
      github.repository != 'Rubio-Enterprises/.github'
    runs-on: ${{ fromJSON(needs.detect.outputs.runner) }}
    # Backstop for hook-time hangs. Observed on the template/v1.55.2 wave: a
    # consumer branch carrying the new lefthook `remotes:` stub thin-called an
    # old pin of this workflow (no standards-reader token), and the anonymous
    # clone of the private standards repo left git-credential-manager waiting
    # on an interactive prompt — 65-83 min of silence per job, wedging the
    # whole macOS Tart pool until the 2h30m runner reaper fired. Hooks on the
    # largest repos finish well inside 30 minutes; an auth gap should fail in
    # minutes, not hours.
    timeout-minutes: 30
    steps:
      - name: Check out the consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fork-mode linting needs the PR merge commit's parents (or enough
          # history to merge-base against the base ref) to compute changed
          # files. Non-fork all-files mode is unaffected by the extra commit.
          fetch-depth: 2
      - name: Prepare macOS hook tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Tart's non-login shell does not inherit Homebrew's PATH
          for b in /opt/homebrew/bin/brew /usr/local/bin/brew; do
            if [ -x "$b" ]; then eval "$("$b" shellenv)"; break; fi
          done
          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::Homebrew is required for macOS hooks" >&2
            exit 1
          fi
          printf '%s\n' "$(brew --prefix)/bin" "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          if grep -qE '^has_homebrew_formulae:[[:space:]]*true[[:space:]]*$' .copier-answers.yml 2>/dev/null; then
            HOMEBREW_UPDATE_TO_TAG=1 brew update
          fi
          brew --version
          if grep -qE '^has_swift:[[:space:]]*true' .copier-answers.yml 2>/dev/null ||
            grep -qE '^archetype:[[:space:]]*swift' .copier-answers.yml 2>/dev/null; then
            # SwiftLint needs the selected Xcode toolchain's sourcekitd
            xcodebuild -version
            xcrun --find swift
          fi
      - name: Prepare macOS Ruby dependencies and tool cache
        if: runner.os == 'macOS' && needs.detect.outputs.has_ruby == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install openssl@3 libyaml gmp
          # setup-ruby's Darwin prebuilds embed this path, not RUNNER_TOOL_CACHE
          if [ ! -w /Users/runner/hostedtoolcache ]; then
            sudo mkdir -p /Users/runner/hostedtoolcache
            sudo chown "$(id -u):$(id -g)" /Users/runner/hostedtoolcache
          fi
      # ruby/setup-ruby reads the consumer-owned `.ruby-version` by default.
      # bundler-cache installs the exact Gemfile.lock dependency set before
      # lefthook can invoke any Ruby hook. Do not add ruby-version here: Ruby is
      # intentionally absent from rendered mise because glue cannot ruby-build.
      - name: Install Ruby and locked bundle
        if: needs.detect.outputs.has_ruby == 'true'
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true
      # uv on PATH routes mise's pipx-backend installs through uvx (pipx.uvx
      # defaults true), enforcing minimum_release_age via uv's --exclude-newer.
      # Without uv, mise >= 2026.6.2 falls back to pip's --uploaded-prior-to,
      # which cold runners' bootstrap pip (< 26) rejects — install hard-fails.
      - name: Install uv (routes mise pipx installs through uvx)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.17"
      # Fingerprint the uv-resolved python into the mise cache key (standards#331).
      # mise routes pipx installs through uvx, whose venvs carry a shebang pointing
      # at the uv-MANAGED python under ~/.local/share/uv/python — OUTSIDE the
      # ~/.local/share/mise tree jdx/mise-action caches. When uv's default python
      # bumps (e.g. 3.14.3 → 3.14.4), a cache restored onto a fresh runner VM hands
      # back pipx venvs whose shebang points at an interpreter that VM lacks, so
      # every tool dies with "couldn't exec process" — a permanently poisoned cache
      # no re-run fixes. Folding the version into cache_key_prefix makes a python
      # bump INVALIDATE the cache instead of poisoning it. `uv python find` never
      # downloads and can fall back to a system python, so install first
      # (idempotent — the same managed interpreter uvx would provision anyway),
      # then read the managed version.
      - name: Fingerprint the uv-resolved python for the mise cache key
        id: uv-python
        # Native cache seeds ignore consumer project bounds, matching uvx
        env:
          UV_NO_PROJECT: "true"
        shell: bash
        run: |
          set -euo pipefail
          uv python install
          version="$(uv python find --managed-python --show-version)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve the uv-managed python version for the mise cache key" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "uv-resolved python for mise cache key: $version"
      # Resolve the executable mise-action checks before it can self-update it.
      - name: Resolve installed mise version
        id: mise-version
        env:
          # renovate: datasource=github-releases depName=jdx/mise
          MISE_VERSION: "2026.10.19"
        shell: bash
        run: |
          set -euo pipefail
          binary="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin/mise"
          version="$MISE_VERSION"
          if [ -e "$binary" ]; then
            [ -x "$binary" ] || { echo "::error::installed mise is not executable: $binary" >&2; exit 1; }
            reported="$("$binary" version --json)"
            version="$(jq -er '.version | strings | capture("^(?<number>[0-9]{4}[.][0-9]+[.][0-9]+)( |$)").number' <<<"$reported")"
          fi
          [[ "$version" =~ ^[0-9]{4}[.][0-9]+[.][0-9]+$ ]] || exit 1
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "mise action version: $version"
      - name: Bootstrap the Shared Config Checkout (native config model)
        uses: Rubio-Enterprises/.github/actions/standards-bootstrap@792ecabfbb67a2d28f288c7c7c41bd8d24e4710a # v4
        with:
          config-model: ${{ needs.detect.outputs.config_model }}
          app-id: ${{ secrets.STANDARDS_READER_APP_ID }}
          private-key: ${{ secrets.STANDARDS_READER_APP_PRIVATE_KEY }}
          mise-version: ${{ steps.mise-version.outputs.version }}
          cache-key-prefix: mise-v1-uvpy${{ steps.uv-python.outputs.version }}
          keep-route: "true"
      # Consumers whose go.mod replaces a dependency with a private org fork
      # declare the fork repo name(s) in the repo variable
      # GO_PRIVATE_MODULE_REPOS (comma-separated, e.g. "scaleset").
      # golangci-lint's typecheck loads the full package graph, so `go` must
      # be able to fetch those modules; GITHUB_TOKEN is repo-scoped and can't.
      # Mint a short-lived read-only token via the org private-modules-reader
      # App, which is installed only on the private module repos and whose
      # secrets are visible only to their consumers. Never the standards-reader
      # App: every PR job can reach its key, so it stays installed on standards
      # + knowledgebase-framework only (.github-private ADR 0003). Both steps
      # are no-ops when the variable is unset.
      - name: Mint private-Go-module token (consumers setting GO_PRIVATE_MODULE_REPOS)
        if: vars.GO_PRIVATE_MODULE_REPOS != ''
        id: go-private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.PRIVATE_MODULES_READER_APP_ID }}
          private-key: ${{ secrets.PRIVATE_MODULES_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.GO_PRIVATE_MODULE_REPOS }}
          permission-contents: read
      - name: Route private Go module fetches through the App token
        if: vars.GO_PRIVATE_MODULE_REPOS != ''
        env:
          TOKEN: ${{ steps.go-private-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOS: ${{ vars.GO_PRIVATE_MODULE_REPOS }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$REPOS"
          for repo in "${repos[@]}"; do
            repo="${repo// /}"
            [ -n "$repo" ] || continue
            git config --global \
              url."https://x-access-token:${TOKEN}@github.com/${OWNER}/${repo}".insteadOf \
              "https://github.com/${OWNER}/${repo}"
          done
          echo "GOPRIVATE=github.com/${OWNER}/*" >> "$GITHUB_ENV"
      # Knowledgebases retain their independently versioned framework remote.
      - name: Detect the Knowledgebase Framework remote
        id: knowledgebase-remote
        shell: bash
        run: |
          set -euo pipefail
          if [ -f lefthook.yml ] && grep -qF 'github.com/Rubio-Enterprises/knowledgebase-framework.git' lefthook.yml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint knowledgebase-framework read token (lefthook remotes fetch)
        if: steps.knowledgebase-remote.outputs.present == 'true'
        id: knowledgebase-remote-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.STANDARDS_READER_APP_ID }}
          private-key: ${{ secrets.STANDARDS_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: knowledgebase-framework
          permission-contents: read
      - name: Route the Knowledgebase Framework remote through the App token
        if: steps.knowledgebase-remote.outputs.present == 'true'
        env:
          TOKEN: ${{ steps.knowledgebase-remote-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/${OWNER}/knowledgebase-framework".insteadOf \
            "https://github.com/${OWNER}/knowledgebase-framework"
      - name: Install pnpm (for lefthook.local.yml hooks invoking pnpm)
        # Mirrors the pattern in e2e.yml — gated on pnpm-lock.yaml presence
        # so python/swift consumers (no Node) get a free no-op. Reads
        # `packageManager` from package.json for version pinning, avoiding
        # the corepack keyring drift documented in e2e.yml's adjacent block.
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      # pnpm keeps registry metadata and lockfile-verification memos outside its store.
      # Both gates read the same cache; only typecheck's default-branch seeder writes it.
      - name: Locate the pnpm cacheDir
        id: pnpm-cache-dir
        if: hashFiles('pnpm-lock.yaml') != ''
        shell: bash
        run: |
          set -uo pipefail
          if ! cache_dir="$(pnpm config get cacheDir 2>/dev/null)"; then
            echo "::notice::could not resolve pnpm cacheDir — skipping the metadata cache"
            printf 'ok=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$cache_dir" in
            ""|undefined|null)
              if [ -n "${XDG_CACHE_HOME:-}" ]; then
                cache_dir="$XDG_CACHE_HOME/pnpm"
              elif [ "$RUNNER_OS" = macOS ]; then
                cache_dir="$HOME/Library/Caches/pnpm"
              elif [ "$RUNNER_OS" = Linux ]; then
                cache_dir="$HOME/.cache/pnpm"
              else
                printf 'ok=false\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          case "$cache_dir" in
            *$'\n'*|*$'\r'*)
              printf 'ok=false\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            \~/*) cache_dir="$HOME/${cache_dir#\~/}" ;;
            /*) ;;
            *) cache_dir="$PWD/$cache_dir" ;;
          esac
          printf 'ok=true\npath=%s\n' "$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm cacheDir
        if: steps.pnpm-cache-dir.outputs.ok == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.path }}
          key: pnpm-cache-dir-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-cache-dir-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install JS deps (so lefthook.local.yml pnpm hooks resolve workspace packages)
        # pnpm/action-setup@v4 installs the pnpm binary but does NOT populate
        # node_modules. Consumer lefthook.local.yml hooks like `pnpm exec sherif`
        # or `pnpm --filter @ws/x check` require the workspace to be installed.
        # Surfaced 2026-05-17 by karakeep PR #5 v1.1.16 re-run (Plan 3 Task 48):
        # `pnpm exec sherif` failed with ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL
        # because sherif (a devDep) wasn't in node_modules.
        #
        # Throttled for the same reason as typecheck-ts.yml's "Install JS deps"
        # step, and with the same two flags: pnpm's defaults (16 concurrent HTTP
        # requests, 5 concurrent build child-processes) each hold a decompressed
        # tarball in flight, so peak RSS scales with the concurrency, not with
        # the size of the dependency graph. Halving both caps the transient peak
        # while barely moving wall-clock, because the step is network-bound long
        # before it is CPU-bound. The glue containers are sized for ~0.75 GB
        # jobs, so the peak is the number that has to come down.
        #
        # The typecheck gate got these flags on 2026-07-28 and this gate did
        # not, which made this step THE failure mode of the next Renovate wave:
        # of 37 kodus-ai `standards.yml` runs on 2026-07-29, 21 failed and every
        # one failed in `lint-hooks` — 16 in this step (exit 137 OOM kills and
        # ERR_PNPM_BROKEN_METADATA_JSON registry timeouts, roughly evenly split),
        # 2 more installing pnpm itself. Zero were lint errors.
        #
        # Throttled, not skipped: the install exists for CONSUMER-owned
        # `lefthook-local.yml` hooks, which are arbitrary per repo — a hook that
        # shells out to a node script needing node_modules leaves no `pnpm` token
        # for a workflow-side grep to find — so there is no sound test here for
        # "no hook needs the workspace". Fork-ness is not that test either:
        # forks run the same pre-commit hooks as every other repo, just scoped to
        # the PR's changed files.
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile --network-concurrency=8 --child-concurrency=2
        shell: bash
      - name: Run lefthook pre-commit across all files
        if: needs.detect.outputs.is_fork != 'true'
        # MISE_ENV=ci is forwarded so any mise env-conditional config behaves
        # the same as the audit job. `--all-files` walks the repo tree rather
        # than the empty staged-diff set CI checkouts present.
        # `--no-stage-fixed`: CI never stages. The rewrite guard below compares
        # the worktree AND index against HEAD, so staging adds nothing, and
        # lefthook 2.1.12 fails staging for a NUL-terminated stdin list (the
        # fork path) with `git add` exit 128.
        env:
          MISE_ENV: ci
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- lefthook run pre-commit --all-files --no-stage-fixed
      - name: Run lefthook pre-commit on changed fork files
        if: needs.detect.outputs.is_fork == 'true'
        env:
          MISE_ENV: ci
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=/tmp/lefthook-changed-files.txt
          : > "$files"

          # EVERY producer below must be `-z` (NUL-separated). lefthook's
          # `--files-from-stdin` parses NUL, not newlines — verified against the
          # pinned lefthook 2.1.10. Fed a newline-separated list it resolves ZERO
          # paths, so every `glob:`-scoped hook reports
          # `(skip) no files for inspection` and the job exits 0 while checking
          # nothing. Only hooks with no `glob:` (gitleaks, and consumer hooks like
          # karakeep's `sherif`) ran, which is why the gate looked healthy:
          # karakeep run 30479210039 logged `markdownlint`, `yamllint`,
          # `yaml-prettier`, `shellcheck` and `shfmt` all skipping while `gitleaks`
          # and `sherif` passed. `-z` is therefore load-bearing, not a nicety, and
          # it also removes git's path-quoting of names with spaces or non-ASCII
          # bytes, which the newline form would have mangled anyway.
          if git rev-parse --verify --quiet HEAD^1 >/dev/null && git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            # GitHub checks out pull_request runs at a synthetic
            # merge commit. Diff the merge result against the base parent; this
            # needs only fetch-depth: 2 and avoids an unfetched merge base.
            git diff -z --name-only --diff-filter=ACMR HEAD^1 HEAD > "$files"
          elif [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=50 origin "refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            if git merge-base "origin/${GITHUB_BASE_REF}" HEAD >/dev/null; then
              git diff -z --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF}...HEAD" > "$files"
            elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
              git diff -z --name-only --diff-filter=ACMR HEAD^ HEAD > "$files"
            else
              git ls-files -z > "$files"
            fi
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff -z --name-only --diff-filter=ACMR HEAD^ HEAD > "$files"
          else
            # Last-resort fallback for an unusual single-commit checkout: check
            # tracked files rather than silently skipping hook coverage.
            git ls-files -z > "$files"
          fi

          if [ ! -s "$files" ]; then
            echo "::notice::fork PR has no added/copied/modified/renamed files for lefthook to check"
            exit 0
          fi

          # The list is NUL-separated now, so render it for the log rather than
          # cat-ing one unreadable blob.
          echo "Fork-mode lefthook file list:"
          tr '\0' '\n' < "$files" | sed 's/^/  /'

          # --no-stage-fixed: see the all-files step. With staging on, lefthook
          # 2.1.12 passes the empty entry after the list's final NUL to
          # `git add` and fails every changed-file run (exit 128).
          if ! mise exec -- lefthook run pre-commit --no-stage-fixed --files-from-stdin < "$files"; then
            echo "::error::fork-mode lefthook hooks failed" >&2
            exit 1
          fi
          echo "fork-mode lefthook hooks passed"
        shell: bash
      - name: Run the full knowledgebase check
        # KB-01: the framework's pre-commit job checks only knowledgebases with
        # staged changes, so a clean CI checkout skips them all. Its `kb-check`
        # event checks every knowledgebase without staging. It is defined only
        # in the framework's remote hooks, so a remote Lefthook could not fetch
        # fails here with "hook kb-check doesn't exist" instead of passing.
        # Runs before the rewrite guard so a rewrite it makes fails the job.
        if: >-
          needs.detect.outputs.has_knowledgebase == 'true'
        env:
          MISE_ENV: ci
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- lefthook run kb-check
      - name: Fail if a hook rewrote a tracked file
        # Both execution paths above run write-mode Fixers. Check their
        # rewrites afterward, including stage_fixed changes on fork PRs.
        # lint-config verifies configuration only; this is the formatting gate.
        #
        # `git diff HEAD` covers staged AND unstaged edits to tracked files
        # (`stage_fixed` hooks `git add` their rewrites, so a plain `git diff`
        # would miss them) and ignores untracked output such as tool caches.
        # Remediation runs the same hook stage over the affected files locally.
        env:
          IS_FORK: ${{ needs.detect.outputs.is_fork }}
        run: |
          if git diff --quiet HEAD --; then
            echo "no hook rewrote a tracked file"
            exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            fix="run 'mise exec -- lefthook run pre-commit' on the changed files"
          else
            fix="run 'mise exec -- lefthook run pre-commit --all-files'"
          fi
          fix="${fix} locally and commit the result"
          echo "::error title=lint-hooks::hooks rewrote tracked files — ${fix}"
          git --no-pager diff --stat HEAD --
          git --no-pager diff HEAD -- | head -n 400
          exit 1
        shell: bash
