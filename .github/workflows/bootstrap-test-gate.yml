name: bootstrap tests
# Independent bootstrap qualification for the central workflows and actions
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
# Job timeouts cap execution only, never queue time. The 120-minute ceiling bounds
# a wedged self-hosted runner (mac-dev-playbook#917) above the measured 47-minute
# org maximum; any tighter timeout in this file is deliberate.
jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
  canonical-tests:
    name: canonical tests
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').docker || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 120
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false
      - name: Check out central Docker preparation action
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Rubio-Enterprises/.github
          ref: ${{ github.sha }}
          path: .cache/central-test-gate
          persist-credentials: false
          sparse-checkout: actions/prepare-hosted-docker
      - name: Prepare hosted Docker disk
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: ./.cache/central-test-gate/actions/prepare-hosted-docker # zizmor: ignore[untrusted-checkout,self-repository] central main or reviewed central candidate, not representative code
      - name: Remove central Docker preparation checkout
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: rm -rf .cache/central-test-gate
      - uses: ./actions/setup-just # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form; the action lands with this commit
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare container-writable hosted checkout
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
      - run: just build && just setup
      - id: suite
        name: Run canonical non-E2E tests
        run: |
          rm -rf reports/test
          just test
      - name: Require canonical JUnit evidence
        if: ${{ !cancelled() }}
        uses: ./actions/junit-gate # zizmor: ignore[self-repository] qualify the candidate parser, not main
        with:
          concerns: test
          suite-outcome: ${{ steps.suite.outcome }}
      - id: test
        run: echo "tests_ran=true" >> "$GITHUB_OUTPUT"

  artifact-timeout-probe:
    runs-on: ${{ fromJSON('["linux-x64-small"]') }} # temporary canary on the pinned self-hosted runner
    timeout-minutes: 5
    strategy:
      matrix:
        upload: [failure, timeout]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare real staging with an upload process boundary
        env:
          PROBE_UPLOAD: ${{ matrix.upload }}
        run: |
          mkdir -p .cache reports/test dist
          cp tests/fixtures/junit-gate/passed.xml reports/test/junit.xml
          printf 'packaged output' > dist/app.zip
          cp -R actions/gate-artifacts .cache/artifact-timeout
          python3 - <<'PY'
          import os
          from pathlib import Path
          action = Path('.cache/artifact-timeout/action.yml')
          content = action.read_text()
          upload = 'sleep 120' if os.environ['PROBE_UPLOAD'] == 'timeout' else 'exit 23'
          content = content[:content.index('    - name: Upload reports')] + (
              '    - name: Upload process boundary\n      shell: bash\n      run: ' + upload + '\n'
          ) + content[content.index('    - name: Clean up staged evidence'):]
          action.write_text(content)
          PY
      - name: Upload Lifecycle artifacts
        id: artifacts
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.cache/artifact-timeout # zizmor: ignore[self-repository] temporary real-runner timeout probe
        with:
          name: probe
          package: 'true'
      - name: Report a failed artifact upload
        if: ${{ !cancelled() && steps.artifacts.outcome == 'failure' }}
        run: echo "::warning::Test Gate artifact preparation or upload failed or exceeded 1 minute for ${GATE_ARTIFACT_SIZES:-reports/ and dist/ (size unavailable before inventory completed)}; the gate result is not affected"
      - name: Clean up Lifecycle artifacts
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/gate-artifacts"
      - name: Require failed upload and reclaimed staging
        env:
          UPLOAD_OUTCOME: ${{ steps.artifacts.outcome }}
          UPLOAD_CONCLUSION: ${{ steps.artifacts.conclusion }}
        run: |
          test "$UPLOAD_OUTCOME" = failure
          test "$UPLOAD_CONCLUSION" = success
          test ! -e "$RUNNER_TEMP/gate-artifacts"
          test -s reports/test/junit.xml
          test -s dist/app.zip
      - name: Require JUnit evidence after upload failure or timeout
        uses: ./actions/junit-gate # zizmor: ignore[self-repository] qualify the real parser after upload failure
        with:
          concerns: test
          suite-outcome: success

  aggregate:
    name: test-gate
    if: ${{ always() }}
    needs: [canonical-tests]
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 120
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require successful non-empty test execution
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success" and
          .outputs.tests_ran == "true")' <<<"$NEEDS_JSON"
