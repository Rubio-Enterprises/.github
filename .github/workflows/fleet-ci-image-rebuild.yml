name: fleet CI image rebuild
"on":
  repository_dispatch:
    types: [base-image-updated]
  workflow_dispatch:
    inputs:
      base-digest:
        description: Optional expected linux/amd64 base digest (empty resolves current main)
        type: string
        default: ''
permissions:
  contents: read
  packages: read
concurrency:
  group: fleet-ci-image-rebuild
  cancel-in-progress: true
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    # The paced fleet loop can exceed ubuntu-slim's execution limit
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').medium || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Mint dispatch token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] Fleet inventory spans the org
          permission-contents: read
          permission-actions: write
      - name: Coalesce and dispatch admitted repositories at a paced rate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          FLEET_ACTOR: ${{ steps.app.outputs.app-slug }}[bot]
          BASE_DIGEST: ${{ github.event.client_payload['base-digest'] || github.event.inputs['base-digest'] || '' }}
        run: node scripts/fleet-ci-image-rebuild.mjs
      - name: Preserve exact fleet dispatch attribution even on cancellation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleet-dispatches
          path: ${{ runner.temp }}/fleet-dispatches.json
          retention-days: 30
          if-no-files-found: ignore
