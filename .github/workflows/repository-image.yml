name: repository image (reusable)
"on":
  workflow_call:
    inputs:
      config:
        description: Repository-relative extra-Features definition
        type: string
        default: .github/.devcontainer/devcontainer.json
      image-name:
        description: GHCR image without a tag; defaults to ghcr.io/<owner>/<repo>/devcontainer
        type: string
        default: ""
      base:
        description: Public base tag or resolved multiarch index reference
        type: string
        default: ghcr.io/rubio-enterprises/devcontainers/base:latest
      base-ci:
        description: Matching runner base tag or resolved multiarch index reference
        type: string
        default: ghcr.io/rubio-enterprises/devcontainers/base-ci:latest
    secrets:
      STANDARDS_READER_APP_ID:
        description: Standards-reader App ID; required for shared config bootstrap
        required: false
      STANDARDS_READER_APP_PRIVATE_KEY:
        description: Standards-reader App key; required for shared config bootstrap
        required: false
permissions: {}
concurrency:
  group: repository-image-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Resolve publication and base pair
    if: >-
      github.event_name == 'pull_request' ||
      (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      shape: ${{ steps.standards.outputs.shape }}
      version: ${{ steps.release.outputs.version }}
      integrity: ${{ steps.release.outputs.integrity }}
      image: ${{ steps.image.outputs.image }}
      package: ${{ steps.image.outputs.package }}
      publish: ${{ steps.image.outputs.publish }}
      ci-image: ${{ steps.image.outputs.image }}-ci
      ci-package: ${{ steps.image.outputs.package }}-ci
      base: ${{ steps.bases.outputs.base }}
      base-ci: ${{ steps.bases.outputs.base-ci }}
      input-key: ${{ steps.key.outputs.input-key }}
      skip: ${{ steps.key.outputs.skip }}
      dev-index: ${{ steps.key.outputs.dev-index }}
      dev-child: ${{ steps.key.outputs.dev-child }}
      ci-index: ${{ steps.key.outputs.ci-index }}
      ci-child: ${{ steps.key.outputs.ci-child }}
    steps:
      - name: Resolve image and publication policy
        id: image
        shell: bash
        env:
          IMAGE_INPUT: ${{ inputs.image-name }}
          CONFIG: ${{ inputs.config }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          case "$CONFIG" in
            ""|/*|..|../*|*/../*|*/..) echo "::error::config must be repository-relative without parent traversal"; exit 1 ;;
          esac
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${IMAGE_INPUT:-ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer}"
          image="${image,,}"
          prefix="ghcr.io/$owner/"
          package="${image#"$prefix"}"
          if [[ "$image" != "$prefix"* || ! "$package" =~ ^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$ ]]; then
            echo "::error::image-name must be an untagged GHCR image in the caller's owner namespace"
            exit 1
          fi
          printf 'image=%s\npackage=%s\npublish=%s\n' "$image" "$package" "$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check out standards wiring
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect standards shape
        id: standards
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        with:
          operation: inspect
      - name: Resolve the Standards Release
        id: release
        if: steps.standards.outputs.shape == 'v2'
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        env:
          STANDARDS_RELEASE: ${{ steps.standards.outputs.release }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          npm_config_cache: ${{ runner.temp }}/standards-registry-cache
          npm_config_userconfig: ${{ runner.temp }}/standards-registry-user.npmrc
          npm_config_globalconfig: ${{ runner.temp }}/standards-registry-global.npmrc
        with:
          operation: release
      - name: Resolve and validate the public base pair
        id: bases
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        with:
          operation: resolve
          base: ${{ inputs.base }}
          base-ci: ${{ inputs.base-ci }}
      # A manual run always rebuilds; pushes alias the published pair when its inputs match
      - name: Compare image inputs with the published pair
        id: key
        if: steps.image.outputs.publish == 'true' && steps.standards.outputs.shape == 'v2'
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          STANDARDS_VERSION: ${{ steps.release.outputs.version }}
          STANDARDS_INTEGRITY: ${{ steps.release.outputs.integrity }}
          DEVCONTAINER_CLI_VERSION: 0.89.0
          FORCE: ${{ github.event_name != 'push' }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          npm_config_cache: ${{ runner.temp }}/standards-registry-cache
          npm_config_userconfig: ${{ runner.temp }}/standards-registry-user.npmrc
          npm_config_globalconfig: ${{ runner.temp }}/standards-registry-global.npmrc
        with:
          operation: key
          config: ${{ inputs.config }}
          base: ${{ steps.bases.outputs.base }}
          base-ci: ${{ steps.bases.outputs.base-ci }}
      - name: Remove registry cache and logs
        if: always()
        run: rm -rf "$RUNNER_TEMP/standards-registry-cache"

  validate:
    name: Validate (amd64)
    needs: prepare
    if: needs.prepare.outputs.publish == 'false'
    permissions:
      contents: read
      packages: read
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').docker || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 120
    # Keep pruning from deleting untagged attestation manifests referenced by an index
    env: &build-env
      ARCH: amd64
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps: &build-steps
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision native shared config
        if: needs.prepare.outputs.shape != 'v2'
        uses: Rubio-Enterprises/.github/actions/standards-bootstrap@main
        with:
          app-id: ${{ secrets.STANDARDS_READER_APP_ID }}
          private-key: ${{ secrets.STANDARDS_READER_APP_PRIVATE_KEY }}
          bootstrap-parts: repos
      - name: Require the image build pin
        if: needs.prepare.outputs.shape != 'v2'
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${STANDARDS_PIN:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::standards-bootstrap must export a full lowercase STANDARDS_PIN before building" >&2
            exit 1
          fi
      - name: Verify native Docker architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker info --format '{{.Architecture}}')"
          case "$ARCH:$actual" in
            amd64:x86_64|amd64:amd64) ;;
            *) echo "::error::Docker architecture does not match linux/$ARCH"; exit 1 ;;
          esac
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the Dev Container CLI
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/devcontainer-cli" --ignore-scripts --no-audit --no-fund @devcontainers/cli@0.89.0
      - name: Log in to GHCR
        if: >-
          needs.prepare.outputs.publish == 'true' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare central generic build inputs
        id: inputs
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        env:
          DEVCONTAINER: ${{ runner.temp }}/devcontainer-cli/node_modules/.bin/devcontainer
          STANDARDS_SHAPE: ${{ needs.prepare.outputs.shape }}
          STANDARDS_VERSION: ${{ needs.prepare.outputs.version }}
          STANDARDS_INTEGRITY: ${{ needs.prepare.outputs.integrity }}
        with:
          operation: prepare
          config: ${{ inputs.config }}
          base: ${{ needs.prepare.outputs.base }}
      - name: Fetch the verified Standards Package
        if: needs.prepare.outputs.shape == 'v2'
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        env:
          CONTEXT: ${{ steps.inputs.outputs.context }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          npm_config_cache: ${{ runner.temp }}/standards-registry-cache
          npm_config_userconfig: ${{ runner.temp }}/standards-registry-user.npmrc
          npm_config_globalconfig: ${{ runner.temp }}/standards-registry-global.npmrc
        with:
          operation: pack
      - name: Install checksum-pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          version=0.76.1
          checksum=c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v$version/trivy_${version}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trivy" trivy
      - name: Build, audit and verify the image pair
        shell: bash
        env:
          ASSETS: ${{ steps.inputs.outputs.assets }}
          CONTEXT: ${{ steps.inputs.outputs.context }}
          BASE: ${{ needs.prepare.outputs.base }}
          BASE_CI: ${{ needs.prepare.outputs.base-ci }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          CI_IMAGE: ${{ needs.prepare.outputs.ci-image }}
          DEVCONTAINER: ${{ runner.temp }}/devcontainer-cli/node_modules/.bin/devcontainer
          INPUT_KEY: ${{ needs.prepare.outputs.input-key }}
        run: bash "$ASSETS/build.sh"
      - name: Scan the dev artifact for secrets
        shell: bash
        env:
          CONTEXT: ${{ steps.inputs.outputs.context }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/trivy-cache"' EXIT
          # skip-patterns replaces Trivy's defaults. Keep them plus package caches:
          # installs hardlink into caches whose hashes defeat path-based allow rules.
          # Third-party package contents stay out of scope, matching Trivy's defaults.
          cat > "$RUNNER_TEMP/trivy-secret.yaml" <<'TRIVY'
          skip-patterns:
            - "**/.git/**"
            - "**/node_modules/**"
            - "**/go.mod"
            - "**/go.sum"
            - "**/package-lock.json"
            - "**/yarn.lock"
            - "**/pnpm-lock.yaml"
            - "**/Pipfile.lock"
            - "**/Gemfile.lock"
            - "**/*.jpg"
            - "**/*.png"
            - "**/*.gif"
            - "**/*.doc"
            - "**/*.pdf"
            - "**/*.bin"
            - "**/*.svg"
            - "**/*.socket"
            - "**/*.deb"
            - "**/*.rpm"
            - "**/*.zip"
            - "**/*.gz"
            - "**/*.gzip"
            - "**/*.tar"
            - "**/pnpm-store/**"
            - "**/_cacache/**"
            - "**/.cache/uv/**"
            - "**/.cache/pip/**"
            - "**/.cache/mise/npm/aube/store/**"
            - "**/.cache/mise/downloads-cas/**"
            - "usr/local/share/mise/installs/**"
            - "home/*/.local/share/mise/installs/**"
            - "root/.local/share/mise/installs/**"
            - "mnt/devcontainer-cache/mise/installs/**"
            - "var/cache/devcontainer/gomod/**"
            - "home/*/.cache/gomod/**"
            - "mnt/devcontainer-cache/gomod/**"
            - "home/*/go/pkg/mod/**"
            - "root/go/pkg/mod/**"
            - "home/*/.bun/install/cache/**"
            - "root/.bun/install/cache/**"
            - "var/cache/devcontainer/bun/**"
            - "mnt/devcontainer-cache/bun/**"
            - "home/*/.local/share/pnpm/store/**"
            - "root/.local/share/pnpm/store/**"
            - "var/cache/devcontainer/uv/**"
            - "mnt/devcontainer-cache/uv/**"
            - "home/*/.cache/cargo/registry/**"
            - "home/*/.local/share/rustup/toolchains/**"
            - "home/*/.local/share/uv/python/*-*-*/**"
            - "usr/local/bundle/gems/**"
            - "usr/local/bundle/cache/*.gem"
            - "usr/local/bundle/*/*/gems/**"
            - "usr/local/bundle/*/*/cache/*.gem"
            - "home/*/.gem/gems/**"
            - "home/*/.gem/cache/*.gem"
            - "root/.gem/gems/**"
            - "root/.gem/cache/*.gem"
            - "home/*/.gem/*/*/gems/**"
            - "home/*/.gem/*/*/cache/*.gem"
            - "root/.gem/*/*/gems/**"
            - "root/.gem/*/*/cache/*.gem"
            - "home/*/.local/share/gem/*/*/gems/**"
            - "home/*/.local/share/gem/*/*/cache/*.gem"
            - "root/.local/share/gem/*/*/gems/**"
            - "root/.local/share/gem/*/*/cache/*.gem"
            - "home/*/.cache/*/bundle/*/*/gems/**"
            - "home/*/.cache/*/bundle/*/*/cache/*.gem"
            - "root/.cache/*/bundle/*/*/gems/**"
            - "root/.cache/*/bundle/*/*/cache/*.gem"
            - "workspaces/*/.bundle/*/*/gems/**"
            - "workspaces/*/.bundle/*/*/cache/*.gem"
          # Keep the SDK prose guard for regular files in uncached install layouts.
          exclude-block:
            description: Anthropic SDK execution-identity documentation, not GCP credentials
            regexes:
              - 'sending `\{"type": "service_account"\}` stores the'
              - 'send null or `\{"type": "service_account"\}`'
              - 'Always present; `\{"type": "service_account"\}` when runs carry no customer-named'
          TRIVY
          # shellcheck disable=SC2016
          template='{{ range . }}{{ $target := .Target }}{{ range .Secrets }}{{ printf "%s:%d-%d: %s (%s)\n" $target .StartLine .EndLine .RuleID .Severity }}{{ end }}{{ end }}'
          ref="$(< "$CONTEXT/dev.ref")"
          SECONDS=0
          status=0
          "$RUNNER_TEMP/trivy/trivy" image \
            --image-src remote --insecure --scanners secret --image-config-scanners secret \
            --exit-code 1 --config '' --ignorefile '' --secret-config "$RUNNER_TEMP/trivy-secret.yaml" \
            --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --timeout 15m --format template --template "$template" \
            "$ref" || status=$?
          printf 'Secret scan (%s, %s): %s seconds (exit %s)\n' "$ref" "$ARCH" "$SECONDS" "$status"
          if [[ "$status" != 0 ]]; then exit "$status"; fi
      - name: Push the verified image pair
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          CONTEXT: ${{ steps.inputs.outputs.context }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          CI_IMAGE: ${{ needs.prepare.outputs.ci-image }}
        run: |
          set -euo pipefail
          crane_image=gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
          crane() {
            docker run --rm --network host --user "$(id -u):$(id -g)" --env DOCKER_CONFIG=/auth \
              --mount "type=bind,src=${DOCKER_CONFIG:-$HOME/.docker},dst=/auth,readonly" \
              "$crane_image" "$@"
          }
          for artifact in "$IMAGE" "$CI_IMAGE"; do
            name=dev
            if [[ "$artifact" == "$CI_IMAGE" ]]; then name=ci; fi
            ref="$(< "$CONTEXT/$name.ref")"
            target="$artifact:sha-$GITHUB_SHA-$ARCH"
            crane copy "$ref" "$target"
            if [[ "$(crane digest "$target")" != "${ref##*@}" ]]; then
              echo '::error::Published manifest differs from the verified artifact'
              exit 1
            fi
            printf 'Published verified digest: %s -> %s\n' "$ref" "$target"
          done
      - name: Publish single-platform indices and cache aliases
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          CI_IMAGE: ${{ needs.prepare.outputs.ci-image }}
        run: |
          set -euo pipefail
          for artifact in "$IMAGE" "$CI_IMAGE"; do
            # A bare manifest permits implicit emulation on arm64; an index fails platform selection.
            docker buildx imagetools create --prefer-index=true \
              --tag "$artifact:main" --tag "$artifact:sha-$GITHUB_SHA" \
              "$artifact:sha-$GITHUB_SHA-amd64"
            docker buildx imagetools create --prefer-index=false \
              --tag "$artifact:main-amd64" "$artifact:sha-$GITHUB_SHA-amd64"
            for tag in main "sha-$GITHUB_SHA"; do
              docker buildx imagetools inspect --raw "$artifact:$tag" | jq -e '
                .schemaVersion == 2 and
                (.mediaType == "application/vnd.oci.image.index.v1+json" or
                 .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
                (.manifests | length) == 1 and
                .manifests[0].platform.os == "linux" and
                .manifests[0].platform.architecture == "amd64"
              ' > /dev/null
            done
          done
      - name: Clean job-local artifacts
        if: always()
        shell: bash
        env:
          CONTEXT: ${{ steps.inputs.outputs.context }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          CI_IMAGE: ${{ needs.prepare.outputs.ci-image }}
        run: |
          rm -rf "$RUNNER_TEMP/standards-registry-cache"
          docker rm -f "repository-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" 2>/dev/null || true
          docker image rm "$IMAGE:sha-$GITHUB_SHA-$ARCH" "$CI_IMAGE:sha-$GITHUB_SHA-$ARCH" 2>/dev/null || true
          if [[ "$CONTEXT" == "$RUNNER_TEMP"/repository-image-* ]]; then rm -rf "$CONTEXT"; fi

  build:
    name: Build and publish (amd64)
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').docker || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 120
    env: *build-env
    steps: *build-steps

  alias:
    name: Alias the unchanged image pair
    needs: prepare
    if: needs.prepare.outputs.skip == 'true'
    permissions:
      packages: write
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 5
    steps:
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Point the commit tags at the published pair
        uses: Rubio-Enterprises/.github/actions/repository-image@main
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DEV_INDEX: ${{ needs.prepare.outputs.dev-index }}
          DEV_CHILD: ${{ needs.prepare.outputs.dev-child }}
          CI_INDEX: ${{ needs.prepare.outputs.ci-index }}
          CI_CHILD: ${{ needs.prepare.outputs.ci-child }}
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          operation: alias

  prune:
    name: Prune untagged versions
    needs: [prepare, build]
    permissions:
      packages: write
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    strategy:
      matrix:
        package:
          - ${{ needs.prepare.outputs.package }}
          - ${{ needs.prepare.outputs.ci-package }}
    steps:
      - name: Keep five untagged versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ matrix.package }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 5
