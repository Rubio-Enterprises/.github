name: repository image (reusable)

# Builds and publishes the repository's CI Image (`devcontainer-ci:main`) on the Build Service (amd64)
# for private repositories, or with local Docker on hosted runners for public repositories.
# The CI Image is the repository's own Dockerfile `ci` target, with base:main and runner:main pulled fresh.
# Dev images are never built or published (host-first shape §7).
"on":
  workflow_call:
    inputs:
      file:
        description: Dockerfile relative to repository root
        type: string
        default: Dockerfile
      target:
        description: Dockerfile stage to build
        type: string
        default: ci
      context:
        description: Build context directory, relative to repository root
        type: string
        default: .
      image-name:
        description: GHCR image without a tag; defaults to ghcr.io/<owner>/<repo>/devcontainer-ci
        type: string
        default: ""

permissions: {}

concurrency:
  group: repository-image-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve publication and admission
    if: >-
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.image-name != '')
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      package: ${{ steps.image.outputs.package }}
      public: ${{ steps.image.outputs.public }}
      skip: ${{ steps.key.outputs.skip }}
    steps:
      - name: Resolve image and publication policy
        id: image
        shell: bash
        env:
          IMAGE_INPUT: ${{ inputs.image-name }}
          FILE: ${{ inputs.file }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${IMAGE_INPUT:-ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer-ci}"
          image="${image,,}"
          prefix="ghcr.io/$owner/"
          package="${image#"$prefix"}"
          if [[ "$image" != "$prefix"* || ! "$package" =~ ^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$ ]]; then
            echo "::error::image-name must be an untagged GHCR image in the caller's owner namespace"
            exit 1
          fi
          own="ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer-ci"
          if [[ "$ON_DEFAULT_BRANCH" != true && "$image" == "$own" ]]; then
            echo "::error::a run outside the default branch must name a scratch image-name, not the repository's own image"
            exit 1
          fi
          public=false
          if [[ "${PRIVATE:-}" == false ]]; then public=true; fi
          printf 'image=%s\npackage=%s\npublic=%s\n' "$image" "$package" "$public" >> "$GITHUB_OUTPUT"

      - name: Check published commit tags
        id: key
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          FORCE: ${{ github.event_name != 'push' }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" == true ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Check whether sha-$GITHUB_SHA already exists
          crane_image="gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1"
          skip=false
          printf '%s' "$REGISTRY_TOKEN" | docker run --rm -i --network host "$crane_image" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin 2>/dev/null || true
          if docker run --rm --network host "$crane_image" manifest "$IMAGE:sha-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Commit sha-$GITHUB_SHA already published for $IMAGE"
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish (amd64)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.public != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').image || fromJSON('["linux-x64-image"]') }}
    timeout-minutes: 45
    env:
      ARCH: amd64
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the Build Service client tools
        uses: Rubio-Enterprises/.github/actions/dev-container-image@main
        with:
          operation: tools

      - name: Connect to the Build Service
        shell: bash
        run: bash "${GITHUB_ACTION_PATH}/connect.sh"

      - name: Install checksum-pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          version=0.76.1
          checksum=c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v$version/trivy_${version}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trivy" trivy

      - name: Build CI image on Build Service
        shell: bash
        env:
          FILE: ${{ inputs.file }}
          TARGET: ${{ inputs.target }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          source "${GITHUB_ACTION_PATH}/../build-service/retry.sh"
          args=(
            --platform "linux/$ARCH"
            --file "$FILE"
            --target "$TARGET"
            --pull
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.rubio-enterprises.image.built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          )
          retry_unavailable docker buildx build --provenance=false --sbom=false "${args[@]}" \
            --output "type=image,name=$STAGING/ci:$STAGING_TAG,push=true,compression=zstd,compression-level=9,oci-mediatypes=true" "$CONTEXT"

      - name: Scan CI image for secrets
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/trivy-cache"' EXIT
          cp "${GITHUB_ACTION_PATH}/trivy-secret.yaml" "$RUNNER_TEMP/trivy-secret.yaml"
          ref="$STAGING/ci:$STAGING_TAG"
          SECONDS=0
          status=0
          "$RUNNER_TEMP/trivy/trivy" image \
            --image-src remote --scanners secret --image-config-scanners secret \
            --exit-code 1 --config '' --ignorefile '' --secret-config "$RUNNER_TEMP/trivy-secret.yaml" \
            --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --timeout 15m "$ref" || status=$?
          printf 'Secret scan (%s, %s): %s seconds (exit %s)\n' "$ref" "$ARCH" "$SECONDS" "$status"
          if [[ "$status" != 0 ]]; then exit "$status"; fi

      - name: Push the verified CI image
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/build-service/docker-publish"
          printf '%s' "$REGISTRY_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref="$STAGING/ci:$STAGING_TAG"
          target="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          crane copy "$ref" "$target"
          if [[ "$(crane digest "$target")" != "${ref##*@}" ]]; then
            echo '::error::Published manifest differs from the verified artifact'
            exit 1
          fi
          printf 'Published verified digest: %s -> %s\n' "$ref" "$target"

      - name: Publish single-platform index and tags
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/build-service/docker-publish"
          unset BUILDX_BUILDER
          artifact="$IMAGE"
          docker buildx imagetools create --prefer-index=true \
            --tag "$artifact:main" --tag "$artifact:sha-$GITHUB_SHA" \
            "$artifact:sha-$GITHUB_SHA-amd64"
          docker buildx imagetools create --prefer-index=false \
            --tag "$artifact:main-amd64" "$artifact:sha-$GITHUB_SHA-amd64"

      - name: Remove job credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/build-service" "$RUNNER_TEMP/trivy-cache"

  build-public:
    name: Build and publish (amd64, hosted)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.public == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: amd64
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CI image with local Docker
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          FILE: ${{ inputs.file }}
          TARGET: ${{ inputs.target }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/$ARCH" \
            --file "$FILE" \
            --target "$TARGET" \
            --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.rubio-enterprises.image.built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE:sha-$GITHUB_SHA-$ARCH" \
            --push \
            "$CONTEXT"

      - name: Publish single-platform index and tags (hosted)
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          artifact="$IMAGE"
          docker buildx imagetools create --prefer-index=true \
            --tag "$artifact:main" --tag "$artifact:sha-$GITHUB_SHA" \
            "$artifact:sha-$GITHUB_SHA-amd64"
          docker buildx imagetools create --prefer-index=false \
            --tag "$artifact:main-amd64" "$artifact:sha-$GITHUB_SHA-amd64"

  prune:
    name: Prune untagged versions
    needs: [prepare, build, build-public]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build-public.result == 'success') }}
    permissions:
      packages: write
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    steps:
      - name: Keep five untagged versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ needs.prepare.outputs.package }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 5

