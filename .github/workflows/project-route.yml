name: project route (reusable)

"on":
  workflow_call:
    inputs:
      route:
        description: "auto uses ci-platform/ci-size; linux selects Linux checks; test also reads ci-test-route; capability jobs select a RUNNERS key"
        type: string
        default: auto
    outputs:
      platform:
        description: "Declared platform for auto/linux routes; capability platform otherwise"
        value: ${{ jobs.route.outputs.platform }}
      runner:
        description: "JSON runs-on labels"
        value: ${{ jobs.route.outputs.runner }}
      macos-concerns:
        description: "Declared macOS concerns in canonical order; empty when none"
        value: ${{ jobs.route.outputs.macos-concerns }}
      macos-runner:
        description: "JSON labels for macOS Test Gate execution"
        value: ${{ jobs.route.outputs.macos-runner }}
      ci-image:
        description: "true only when project commands will run in the repository's CI Image"
        value: ${{ jobs.route.outputs.ci-image }}

permissions:
  contents: read

jobs:
  route:
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.route.outputs.platform }}
      runner: ${{ steps.route.outputs.runner }}
      ci-image: ${{ steps.route.outputs.ci-image }}
      macos-concerns: ${{ steps.route.outputs.macos-concerns }}
      macos-runner: ${{ steps.route.outputs.macos-runner }}
    steps:
      - id: route
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROUTE: ${{ inputs.route }}
          RUNNERS: ${{ vars.RUNNERS || '{}' }}
          CI_IMAGE_REPOS: ${{ vars.CI_IMAGE_REPOS || '[]' }}
        with:
          script: |
            const fallbacks = {
              small: ['ubuntu-slim'], medium: ['ubuntu-latest'],
              docker: ['ubuntu-latest'], kvm: ['ubuntu-latest'],
              arm: ['ubuntu-24.04-arm'], macos: ['macos-26'],
            };
            const runners = JSON.parse(process.env.RUNNERS);
            const admitted = JSON.parse(process.env.CI_IMAGE_REPOS);
            if (!runners || Array.isArray(runners) || typeof runners !== 'object') {
              throw new Error('RUNNERS must be a JSON object');
            }
            if (!Array.isArray(admitted) || admitted.some(id => !Number.isSafeInteger(id) || id <= 0)) {
              throw new Error('CI_IMAGE_REPOS must be an array of positive integer repository IDs');
            }
            let route = process.env.ROUTE;
            const testRoute = route === 'test';
            let macosConcerns = [];
            let platform = route === 'macos' ? 'macos' : 'linux';
            if (['auto', 'linux', 'test'].includes(route)) {
              let properties = context.payload.repository?.custom_properties;
              if (!properties || !Object.hasOwn(properties, 'ci-platform') || !Object.hasOwn(properties, 'ci-size')
                  || (testRoute && (!Object.hasOwn(properties, 'ci-test-route') || !Object.hasOwn(properties, 'ci-test-macos')))) {
                const { data } = await github.request('GET /repos/{owner}/{repo}/properties/values', context.repo);
                properties = Object.fromEntries(data.map(({ property_name, value }) => [property_name, value]));
              }
              platform = properties['ci-platform'] ?? 'linux';
              const size = properties['ci-size'] ?? 'small';
              if (!['linux', 'macos'].includes(platform) || !['small', 'medium'].includes(size)) {
                throw new Error('Expected ci-platform=linux|macos and ci-size=small|medium');
              }
              const override = testRoute ? properties['ci-test-route'] : null;
              if (override != null && override !== '' && !['small', 'medium', 'docker', 'arm', 'macos'].includes(override)) {
                throw new Error('ci-test-route must be small, medium, docker, arm or macos when set');
              }
              route = override || (route !== 'linux' && platform === 'macos' ? 'macos' : size);
              if (testRoute) {
                platform = route === 'macos' ? 'macos' : 'linux';
                const declared = properties['ci-test-macos'];
                const order = ['test', 'typecheck', 'e2e', 'package'];
                if (declared != null && declared !== '') {
                  if (!Array.isArray(declared) || declared.some(value => !order.includes(value))) {
                    throw new Error('ci-test-macos must contain only test, typecheck, e2e or package');
                  }
                  macosConcerns = order.filter(value => declared.includes(value));
                }
                if (macosConcerns.length && platform === 'macos') {
                  throw new Error('ci-test-macos applies to repositories whose Test Gate runs on Linux');
                }
              }
            }
            if (!Object.hasOwn(fallbacks, route)) {
              throw new Error('route must be auto, linux, test, small, medium, docker, kvm, arm or macos');
            }
            const repository = context.payload.repository;
            let runner = testRoute && repository?.private !== true
              ? fallbacks[route] : runners[route] || fallbacks[route];
            if (!Array.isArray(runner) || runner.length === 0 || runner.some(label => typeof label !== 'string' || !label.trim())) {
              throw new Error('The selected RUNNERS route must be a nonempty array of labels');
            }
            if (!Number.isSafeInteger(repository?.id) || repository.id <= 0) {
              throw new Error('The event must identify the base repository with a positive integer ID');
            }
            const image = ['small', 'medium'].includes(route)
              && runner.length === 1 && runner[0] === `linux-x64-${route}`
              && repository.private === true
              && context.repo.owner.toLowerCase() === 'rubio-enterprises'
              && admitted.includes(repository.id);
            if (image) {
              // Match org-ops image_inventory.py, including truncation after stripping edge hyphens
              const slug = context.repo.repo.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
              if (!slug) throw new Error('Repository basename produces an empty CI Image label');
              runner = [`ci-${repository.id}-${slug}-${route}`];
            }
            // Generic small/medium runners have no Docker socket for the literal just recipes
            if (!image && ['small', 'medium'].includes(route) && runner.length === 1) {
              if (repository.private !== true) runner = ['ubuntu-latest'];
              else if (runner[0] === `linux-x64-${route}`) runner = runners.docker || ['ubuntu-latest'];
              else if (runner[0] === 'ubuntu-slim') runner = ['ubuntu-latest'];
            }
            const macosRunner = repository.private === true ? runners.macos || fallbacks.macos : fallbacks.macos;
            if (!Array.isArray(macosRunner) || !macosRunner.length || macosRunner.some(label => typeof label !== 'string' || !label.trim())) {
              throw new Error('The macOS RUNNERS route must be a nonempty array of labels');
            }
            core.setOutput('macos-concerns', macosConcerns.join(' '));
            core.setOutput('macos-runner', JSON.stringify(macosRunner));
            core.setOutput('platform', platform);
            core.setOutput('runner', JSON.stringify(runner));
            core.setOutput('ci-image', String(image));
            core.info(`Project route: ${route}; CI Image: ${image}; runs-on: ${JSON.stringify(runner)}`);
