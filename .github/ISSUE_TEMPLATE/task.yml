name: Task
description: Plan documentation, maintenance, infrastructure, or other concrete work.
type: task
labels:
  - intent:draft
body:
  - type: markdown
    attributes:
      value: |
        This form captures the Intent—what is asked and why—for documentation, maintenance, infrastructure or other concrete work.
        Decisions, scope and acceptance criteria are added later in Refinement.
        Filing does not mean approval; keep answers concise and leave out secrets.
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "Describe the current situation and why this documentation, maintenance or other work is needed."
      placeholder: |
        The setup guide still names retired task aliases, so following it fails before the first test run.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome"
      description: "What useful result should this work deliver, and for whom?"
      placeholder: |
        A new contributor can set up the repository using the documented commands.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: "Constraints"
      description: 'Optional: what must not change, and what limits apply to any solution? "None" is a valid answer.'
      placeholder: |
        - Keep the current task runner and CI configuration.
        - Do not upgrade dependencies as part of this work.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: "Open questions"
      description: >-
        Include a question only if its answer would change the Outcome, scope or a constraint,
        or if it is a decision you want to be asked about.
        For example: "Should setup cover a clean machine, or assume prerequisites are installed?"
        and "One setup guide or separate guides? I have a view."
        Leaving this empty is normal.
      placeholder: |
        Should the setup instructions cover both macOS and Linux?
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: "References"
      description: "Optional: links for context, never required reading. Use only sources readers can open (GitHub links, Knowledge documents, attachments), not local paths."
      placeholder: |
        Link to the setup guide and the change that removed the old task aliases.
    validations:
      required: false
