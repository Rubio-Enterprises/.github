name: Refactoring
description: Change internal structure while preserving behavior.
type: task
labels:
  - intent:draft
body:
  - type: markdown
    attributes:
      value: |
        This form captures the Intent—what is asked and why—for structural improvements that preserve behavior.
        Decisions, scope and acceptance criteria are added later in Refinement.
        Filing does not mean approval; keep answers concise and leave out secrets.
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "Describe the current structure and the specific problem it causes."
      placeholder: |
        The CLI and worker each contain a load_settings implementation with the same precedence rules.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome"
      description: "What maintainability, clarity, or testability improvement should this structural change achieve?"
      placeholder: |
        Configuration parsing has one implementation, so fixes do not have to be repeated in the CLI and worker.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: "Constraints"
      description: 'Optional: name behavior that must not change and limits on any solution. "None" is a valid answer.'
      placeholder: |
        - Preserve environment-variable and file precedence.
        - Keep the same defaults, accepted inputs and error messages for both callers.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: "Open questions"
      description: >-
        Include a question only if its answer would change the Outcome, scope or a constraint,
        or if it is a decision you want to be asked about.
        For example: "Must the shared loader remain usable without the CLI's dependencies?"
        and "New module or an existing one? I have a view."
        Leaving this empty is normal.
      placeholder: |
        Must callers outside this repository keep using the existing import paths?
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: "References"
      description: "Optional: links for context, never required reading. Use only sources readers can open (GitHub links, Knowledge documents, attachments), not local paths."
      placeholder: |
        Link to the two current implementations and the regression tests that capture their existing behavior.
    validations:
      required: false
