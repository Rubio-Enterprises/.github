name: Enhancement
description: Propose new or improved behavior.
type: enhancement
labels:
  - intent:draft
body:
  - type: markdown
    attributes:
      value: |
        This form captures the Intent—what is asked and why—for new or improved behavior.
        Decisions, scope and acceptance criteria are added later in Refinement.
        Filing does not mean approval; keep answers concise and leave out secrets.
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "Describe the current behavior, who it affects and why it needs to change."
      placeholder: |
        Inventory output is currently table-only. Small formatting changes break downstream scripts.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome"
      description: "What useful result should this new or improved behavior deliver, and for whom?"
      placeholder: |
        Operators can consume inventory results in scripts without parsing a human-readable table.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: "Constraints"
      description: 'Optional: what must not change, and what limits apply to any solution? "None" is a valid answer.'
      placeholder: |
        - Preserve the current default output.
        - Keep the existing inventory collection behavior.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: "Open questions"
      description: >-
        Include a question only if its answer would change the Outcome, scope or a constraint,
        or if it is a decision you want to be asked about.
        For example: "Should JSON output include nested records, or only summary fields?"
        and "New output module or an existing one? I have a view."
        Leaving this empty is normal.
      placeholder: |
        Should empty inventory results still produce a JSON array?
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: "References"
      description: "Optional: links for context, never required reading. Use only sources readers can open (GitHub links, Knowledge documents, attachments), not local paths."
      placeholder: |
        Link to the inventory consumer that currently parses the table, plus an example of the nested records it needs.
    validations:
      required: false
